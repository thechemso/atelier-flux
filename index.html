lyser et améliorer en continu\n* Analyser les incidents pour identifier les causes récurrentes et proposer des solutions d'amélioration\n* Participer à l'élaboration de rapports et de tableaux de bord pour suivre les performances et les indicateurs clés\n4. Travailler main dans la main avec les équipes\n* Collaborer étroitement avec les équipes logistiques, commerciales et du service client pour assurer une gestion fluide des incidents\n* Participer aux réunions de coordination et apporter un support opérationnel aux équipes sur le terrain\n5. Vérifier la facturation et gérer les litiges\n* Vérifier la facturation des livraisons pour s'assurer de l'exactitude des coûts et des services facturés\n* Gérer les litiges liés aux transports, en coordination avec les services financiers et juridiques de l'entreprise\nTA TEAM\nGwendoline sera ta manager pour cette nouvelle aventure 🤝 Tu seras aussi accompagné.e de toute l'équipe Transport/Logistique, composée de personnes aussi bienveillantes les unes que les autres 😉\nPrêt.e à rejoindre une équipe dynamique qui t'écoutera vraiment, laissera de la place à tes idées et te confiera des responsabilités dès le premier jour ? 💪\nLe profil recherché\nProfil recherché :\nTu es rigoureux.se, organisé.e et tu as une forte capacité d'analyse et de synthèse. Une première expérience en B2B, logistique/transport ou gestion de flux est appréciée. Une expérience pure en transport n'est pas obligatoire si tu maîtrises la logique de flux et/ou la résolution de problèmes. Les profils issus d'alternance sont également les bienvenus.\nCôté compétences, on attend de toi :\n* Une maîtrise d'Excel et des tableurs, avec une aisance pour l'analyse de fichiers de données\n* Des notions de base en transport/logistique\n* Des connaissances en géographie française (et idéalement européenne)\n* Des bases en Anglais (niveau B1, l'usage de Google Translate est accepté pour la gestion du flux)\nEt côté personnalité :\n* De la rigueur, de l'organisation et une bonne gestion des priorités\n* De la réactivité, une bonne capacité d'adaptation et un esprit ouvert : le poste comprend des imprévus et demande d'identifier et de résoudre rapidement les problèmes de livraison\n* Du dynamisme et de la proactivité, avec l'envie de t'étoffer et d'élargir ton périmètre à la gestion d'autres transporteurs\n* Le sens du travail en équipe et de l'entraide\n* Une capacité à accepter la critique\nNous avons besoin de quelqu'un qui matche avec nos valeurs : performance et convivialité !\nAussi, on espère que tu as un fort attrait pour l'univers du e-commerce et de l'aménagement de la maison ! 🛍️\nLe processus de recrutement :\nIl se déroule en 3 étapes principales :\n1- Tri des CV par les RH\n2- Entretien RH avec Nolane, Talent Acquisition Specialist (motivation, personnalité)\n3- Entretien Manager avec Gwendoline (Romain, notre responsable du pôle SEU, est susceptible d'être également présent)\nConditions & Avantages :\n* Type de contrat : CDD 12 mois\n* À pourvoir dès que possible\n* Rémunération selon profil\n* 1 jour de télétravail par semaine\n* 6 semaines de congés payés par an\n* Convention collective applicable : Négoce de l'ameublement 1880\n* Mutuelle Alan (70% à la charge de la société)\n* Swile : carte Tickets restaurant (50% à la charge de l'entreprise)\n* Participation à l'abonnement des transports en commun (50% à la charge de l'entreprise)\n* Pour les minis de la VU team, des places en crèche sont disponibles grâce aux Petits Chaperons Rouges ! 🧸\n* Dog friendly 🐶\n* Localisation : Poste basé à Clavel métro ligne 11, 5, 2, 7B ou bus ligne 20, 26, 71 🚇\nVente-unique.com est un employeur garantissant l'égalité des chances, ce qui signifie que nous nous engageons à ne pas discriminer les employés en fonction de leurs origines, de la , du sexe, de l'origine nationale, de l'âge, du handicap ou des informations génétiques. Si des aménagements raisonnables sont nécessaires pour le processus, n'hésitez pas à en discuter avec l'équipe recrutement.\nBienvenue chez VENTE UNIQUE.COM\nQui sommes-nous ?\nPionnier du e-commerce mobilier et décoration depuis 2006, Vente-unique.com s'est imposé comme une référence dans 16 pays grâce à son esprit visionnaire et son exigence de performance.\nAnnée après année, nous élargissons notre univers pour devenir un groupe en expansion continue dans l'équipement de la maison :\n* Avec la reprise de la marque Habitat en 2024, icône du design accessible,\n* Avec notre marketplace, qui connecte des millions de produits à nos clients,\n* Et avec nos solutions de fulfillment, qui garantissent une logistique rapide et fiable.\nDerrière cette aventure, une équipe jeune, internationale et passionnée réunit tous les métiers en interne (IT, Marketing, achats, logistique, service client...). Cette organisation intégrée nous permet de rester agiles, innovants et performants.\n👉 Chez Vente-unique.com, tu trouveras la solidité d'une entreprise cotée en bourse, allée à l'énergie d'un acteur e-commerce en pleine croissance.\n🎯 Notre mission : offrir du bonheur à tous les étages, en rendant le design et le confort accessibles à chacun.\nAvantages :\n* Tickets restaurants\n* Mutuelle\n* PEE\n* 50% Transports"}, {"id": "op-de26cf708133", "source_id": "4461744123", "source_name": "LinkedIn Emplois", "title": "Coordonnateur logistique et approvisionnement aéronautique (Le Bourget)", "company": "Bombardier", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Le Bourget (93)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 91, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires"], "posted_iso": "2026-10-14", "posted_fr": "14 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4461744123/", "highlights": ["En fonction du poste, Bombardier offre des politiques de travail flexibles et hybrides.", "Quelles sont vos contributions envers l’équipe?", "Rechercher et initier l’achat de matériaux, d’outillage et de composants en communiquant avec des sources internes, externes et des fournisseurs.", "Assurer le suivi accéléré des commandes de pièces et des bons de commande internes et externes en communiquant avec les fournisseurs et les opérations intersociétés."], "summary_excerpt": "En fonction du poste, Bombardier offre des politiques de travail flexibles et hybrides.\nPourquoi vous joindre à nous?\nChez Bombardier, nous concevons, construisons, modifions et entretenons les avions les plus performants du monde pour les individus, les entreprises, les gouvernements et les entités militaires les plus avisés. Nous réussissons à établir les normes les plus élevées grâce à notre approche centrée sur les personnes, et toujours en définissant l'excellence, ensemble.\nTravailler chez Bombardier signifie offrir ce qu’il se fait de mieux. Chaque jour, vous faites partie d’une équipe qui offre des expéri", "full_description": "En fonction du poste, Bombardier offre des politiques de travail flexibles et hybrides.\nPourquoi vous joindre à nous?\nChez Bombardier, nous concevons, construisons, modifions et entretenons les avions les plus performants du monde pour les individus, les entreprises, les gouvernements et les entités militaires les plus avisés. Nous réussissons à établir les normes les plus élevées grâce à notre approche centrée sur les personnes, et toujours en définissant l'excellence, ensemble.\nTravailler chez Bombardier signifie offrir ce qu’il se fait de mieux. Chaque jour, vous faites partie d’une équipe qui offre des expériences et des produits de qualité supérieure, repoussant les limites du possible dans notre industrie et au-delà. En priorisant la croissance et le développement des employé·es, nous permettons à chacun·e d'atteindre son plein potentiel à sa manière, parce que le meilleur travail se produit lorsque vous êtes libre d'être vous-même et de partager votre expertise unique.\nQuelles sont vos contributions envers l’équipe?\nRechercher et initier l’achat de matériaux, d’outillage et de composants en communiquant avec des sources internes, externes et des fournisseurs.\nAssurer le suivi accéléré des commandes de pièces et des bons de commande internes et externes en communiquant avec les fournisseurs et les opérations intersociétés.\nCollaborer avec le Centre de contrôle de la maintenance et les autres services de maintenance pour résoudre les problèmes critiques liés au matériel.\nMaintenir un rapport des pénuries afin d’assurer le suivi des commandes et de communiquer leur statut à la direction.\nCréer et émettre les commandes internes et autres documents applicables afin de répondre aux besoins en pièces et en matériel.\nFournir les renseignements nécessaires pour corriger les commandes comportant des écarts, traiter les messages d’exception et annuler les articles non reçus ou retournés en stock, au besoin.\nMaintenir un registre exact des transactions d’inventaire à l’aide de systèmes informatisés de gestion des stocks et de systèmes manuels de classement.\nDéterminer les articles prioritaires afin de garantir que les pièces sont livrées à temps et facilement accessibles.\nIdentifier les numéros de pièces de remplacement et les numéros de pièces remplacés.\nComment vous épanouir dans ce rôle?\nVous possédez généralement trois (3) années d’expérience dans le secteur de l’aviation, dans un environnement de gestion des matériaux ou des pièces, ou toute autre expérience équivalente démontrée.\nVous possédez les compétences en planification et en organisation nécessaires pour établir les priorités et coordonner la charge de travail dans un contexte de projets multiples.\nVous possédez les habiletés interpersonnelles nécessaires pour développer et maintenir des relations de travail efficaces avec l’équipe des ventes, les propriétaires, les conseillers juridiques externes et les autres départements.\nLa connaissance de SAP constitue un atout.\nVous possédez une connaissance de base de la planification des stocks.\nVous possédez une connaissance de base de l’approvisionnement en pièces.\nVous possédez une connaissance de base des outils informatiques permettant la saisie et l’extraction de données pour la gestion des stocks.\nVous possédez une connaissance de base de l’aménagement des installations et de l’emplacement des bâtiments.\nVous possédez une connaissance de base des processus de gestion des stocks d’un organisme de maintenance agréé (Repair Station).\nVous possédez une connaissance de base des pièces d’aéronef et de la terminologie associée.\nVous possédez une connaissance de base des programmes de fournisseurs internes et externes.\nVous possédez les compétences informatiques nécessaires pour apprendre à utiliser et/ou exploiter des logiciels de traitement de texte, des feuilles de calcul, des bases de données, des outils de présentation, le courrier électronique et les applications Web.\nVous possédez les compétences nécessaires pour recueillir, interpréter et enregistrer des données afin d’assurer l’exactitude des stocks.\nVous possédez les compétences requises pour communiquer efficacement par téléphone et en personne afin de transmettre de l’information.\nVous possédez les compétences nécessaires pour écouter les clients internes et externes et poser les questions appropriées.\nVous êtes capable de travailler de manière autonome tout en collaborant efficacement au sein d’une équipe.\nVous êtes en mesure d’estimer efficacement les quantités requises pour maintenir les niveaux de stock conformément aux exigences des clients.\nMaintenant que vous vous projetez dans ce rôle, postulez et rejoignez l'equipe Bombardier!\nVeuillez noter: Vous n'avez pas besoin de toutes les compétences, connaissances et expériences requises pour postuler à ce poste ! Nous ne sommes pas à la recherche du candidat·e parfait·e, mais d'une personne talentueuse et passionnée.\nBombardier est un employeur qui souscrit au principe de l'égalité d'accès à l'emploi et encourage les personnes de toute race, , origine ethnique, identité sexuelle, orientation sexuelle, âge, statut d'immigrant, handicap ou autres caractéristiques protégées par la loi à postuler.\nEmploi Coordonnateur logistique et approvisionnement aéronautique (Le Bourget)\nSite principal France\nOrganisation BA France SAS\nQuart de travail\nStatut de l'employé Régulier\nRéquisition 15170 Coordonnateur logistique et approvisionnement aéronautique (Le Bourget)"}, {"id": "op-22faf6e0dc56", "source_id": "4485754210", "source_name": "LinkedIn Emplois", "title": "[CDI] Acheteur / Acheteuse (H/F)", "company": "KONCRETE", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 91, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires"], "posted_iso": "2026-11-02", "posted_fr": "2 Novembre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4485754210/", "highlights": ["Koncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.", "Nous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.", "Tes missions1. Comprendre et qualifier les besoins d’achat", "Recueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances."], "summary_excerpt": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les ", "full_description": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.\nTu sais déjà mener une consultation, relancer des fournisseurs et défendre une recommandation chiffrée. Tu souhaites gagner en autonomie et développer ton expertise dans un environnement entrepreneurial où tes décisions ont un impact concret sur la compétitivité des offres et la rentabilité des projets.\nUn rôle 100 % achats : ton périmètre couvre le sourcing, les consultations, l’analyse des offres, la négociation et le suivi de la performance fournisseurs. La planification des livraisons, la coordination quotidienne des tournées et la gestion des incidents opérationnels ne constituent pas tes missions principales : elles relèvent des équipes opérations.\nTes missions1. Comprendre et qualifier les besoins d’achat\nRecueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances.\nVérifier que les informations nécessaires à une consultation sont complètes et lever les ambiguïtés avant de solliciter les partenaires.\nTraduire les besoins en demandes de prix ou cahiers des charges clairs, avec l’appui des équipes compétentes pour les exigences techniques et réglementaires.\nPrioriser les consultations selon leur urgence, leur potentiel et leurs enjeux économiques.\n2. Piloter les consultations fournisseurs de bout en bout\nIdentifier les fournisseurs, plateformes et transporteurs pertinents pour chaque besoin.\nPréparer et envoyer les demandes de prix, en précisant les quantités, spécifications, conditions attendues et délais de réponse.\nOrganiser la mise en concurrence et obtenir plusieurs offres comparables lorsque le marché le permet.\nSuivre les réponses, relancer les interlocuteurs et clarifier les éléments manquants ou incohérents.\nTenir un tableau de suivi des consultations : partenaires sollicités, réponses reçues, échéances, points ouverts et prochaines actions.\nConstruire une synthèse exploitable et recommander les solutions les plus pertinentes aux équipes concernées.\n3. Analyser les offres et négocier les conditions d’achat\nComparer les propositions à périmètre équivalent : prix, transport, frais annexes, disponibilité, délais, conditions de paiement et durée de validité.\nRaisonner en coût complet, et pas uniquement en prix unitaire, pour identifier la solution réellement compétitive.\nRepérer les écarts, exclusions et risques susceptibles de dégrader la marge ou la faisabilité de l’offre.\nNégocier les tarifs et les conditions commerciales dans le respect des objectifs et du cadre de validation interne.\nFormaliser les conditions obtenues par écrit et sécuriser leur bonne transmission aux équipes commerciales et opérationnelles.\nSolliciter une validation pour les engagements ou dérogations dépassant ton niveau de délégation.\n4. Développer et entretenir le réseau fournisseurs\nSourcer de nouveaux partenaires pour renforcer la couverture géographique et élargir les solutions disponibles.\nQualifier leur offre, leurs capacités, leurs zones d’intervention et leurs conditions commerciales.\nRecueillir les informations et documents nécessaires au référencement, avec l’appui des équipes compétentes.\nConstruire des relations de travail durables, tout en maintenant une mise en concurrence adaptée.\nIdentifier des alternatives sur les besoins récurrents ou sensibles pour limiter la dépendance à un partenaire unique.\nRéévaluer les conditions négociées en fonction des volumes, des évolutions de marché et des retours terrain.\n5. Fiabiliser les données et améliorer les méthodes achats\nMaintenir à jour la base fournisseurs, les grilles tarifaires et l’historique des consultations.\nAssurer la traçabilité des offres et des accords : version, date, périmètre, validité et conditions particulières.\nConstruire des modèles de consultation et des grilles de comparaison simples et réutilisables.\nSuivre les résultats de tes consultations et identifier les leviers d’amélioration.\nExploiter les retours des opérations pour ajuster la sélection et l’évaluation des partenaires.\nProposer des améliorations concrètes pour accélérer les consultations et fiabiliser les décisions d’achat.\nLe profil recherché\nUne première expérience solide, sans être un profil senior\nTu disposes idéalement de 1 à 3 ans d’expérience en achats, approvisionnement ou sourcing, avec une pratique réelle des consultations et de la négociation. Une alternance significative et responsabilisante peut être prise en compte.\nTu as déjà géré plusieurs demandes en parallèle, comparé des devis et échangé directement avec des fournisseurs.\nUne formation en achats, supply chain, commerce ou gestion est appréciée ; nous regardons surtout tes compétences et tes réalisations concrètes.\nUne expérience dans le BTP, les matériaux, le transport ou un environnement industriel est un plus, pas un prérequis.\nTes compétences\nRigueur analytique : tu sais construire un comparatif fiable, vérifier les unités et calculer un coût complet.\nNégociation : tu prépares tes échanges, argumentes avec des éléments concrets et sais rechercher un accord équilibré.\nOrganisation : tu pilotes tes échéances et relances sans perdre les dossiers en cours.\nRelationnel : tu es à l’aise au téléphone et sais poser les bonnes questions pour obtenir une réponse exploitable.\nAutonomie : tu fais avancer les sujets courants et sais alerter lorsqu’une décision nécessite un arbitrage.\nCuriosité : tu cherches à comprendre les produits, les contraintes des partenaires et les réalités des chantiers.\nEtape 1 : Entretien en visio avec Naila , notre Chief of Staff\nEtape 2 : Entretien avec Pierre-Marie, notre COO\nEtape 3 : Entretien avec Henri, notre CEO"}, {"id": "op-60ee00194be3", "source_id": "4481214269", "source_name": "LinkedIn Emplois", "title": "CHARGE DE LOGISTIQUE AVAL H/F", "company": "VEJA", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDD", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "la ue, adv., marketing, sav …) pour garantir un échange fluide d’informations et une bonne coordination\nSuivre les indicateurs en collaboration avec le responsable approvisionnement\nParticiper à la mise en place et au suivi des tableaux de bords du service\nSaisi et suivi des réceptions\nParticiper au rapprochement factures, commande, entrée en stock et comptabilisation des achats\nParticiper à la gestion de certaines négociations, en fonction de l’importance stratégique des achats et des fournisseurs\nProposer et animer les réunions S&OP\nCette liste reste non exhaustive et pourra évoluer en fonction de vos attentes et de votre potentiel.\nProfil Recherché\nTitulaire d’un diplôme de niveau Bac +2/3 dans le domaine de l’approvisionnement, vous justifiez idéalement d’une première expérience réussie sur un poste similaire.\nVous avez de bonnes notions en achats, logistique et qualité, ainsi qu’une connaissance des flux logistiques et du transport (tracking, Incoterms), en tenant compte de la réglementation en vigueur.\nVous êtes à l’aise avec l’anglais (lu, écrit, parlé) et avec les outils informatiques (Pack Office). La connaissance du logiciel SAGE X3 serait un atout.\nAu-delà de vos compétences techniques, vous êtes reconnu(e) pour votre rigueur, votre sens de l’organisation et votre capacité d’analyse. Vous êtes d’un naturel dynamique avec un bon sens du relationnel, faites preuve de rigueur et d’organisation.\nEnfin, vous aimez le travail en équipe et vous souhaitez rejoindre un environnement stimulant ?\nAlors rejoignez-nous ! Ce poste est fait pour vous !"}, {"id": "op-d07f981367f0", "source_id": "81762386", "source_name": "HelloWork", "title": "Approvisionneur CDI H/F", "company": "KAL Recrutement", "sector": "Industrie Agro-alimentaire", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France", "city_display": "Île-de-France", "city_raw": "Île-de-France", "family_id": "SUPPLY_CHAIN", "family tégrer Clasquin, c’est :\nRejoindre un environnement stimulant et bienveillant, dans lequel vous pourrez vous épanouir et développer vos compétences en relevant des challenges au quotidien.\nÉvoluer en autonomie au sein d'une équipe et tournée vers l'excellence.\nAdhérer à nos valeurs : enthousiasme, professionnalisme et intégrité.\nPoste : Agent de transit Rail, en CDI, à Roissy-en-France (95).\nMissions :\nL'équipe vous attend pour coordonner les opérations de transport ferroviaire :\nRéaliser et coordonner les opérations de transport dans le respect de la réglementation nationale et internationale, pour les clients Clasquin.\nPréparer tous les documents d’expéditions\nEnregistrer et traiter les anomalies et réclamations éventuelles\nTraiter les dossiers dans l’application Métier et d’assurer le suivi administratif des dossiers\nRéaliser le traitement des factures dans l’application Métier.\nCe que nous recherchons :\nDiplôme en transport ou commerce international\nIdéalement une expérience de minimum 3 ans sur un poste similaire.\nBon niveau d’anglais\nBonne maitrise des incoterms.\nVous êtes proactif et engagé pour fournir une excellente qualité de service pour nos clients, vous faites preuve d’un véritable esprit d’équipe.\nCe que nous proposons :\nSalaire évolutif et suivi du parcours individuel : intégration, formation et développement des compétences.\nManagement de proximité et à l’écoute dans une structure horizontale : 94% ont confiance dans la direction !\nPrimes d’intéressement et de participation : plus de 30% des résultats de CLASQUIN sont redistribués aux salariés.\nJours de RTT\nTickets restaurants (pris en charge à 60% par l’employeur)\nChèques vacances et chèques cadeaux\nAccord télétravail\nEncouragement à l’équilibre vie professionnelle-personnelle : 90% de nos salariés sont satisfaits de la flexibilité accordée au travail.\nVous souhaitez en savoir plus ? Postulez et participez à un process de recrutement sur mesure, au cours duquel vous rencon bien d’autres choses encore, comme un généreux plan de parrainage.\nAttention portée au bien-être : profitez de notre programme gratuit d’assistance aux employés pour soutenir votre santé mentale.\nChez Quadient, notre approche de Smart Work favorise la connexion, la collaboration et l'innovation, tout en offrant une flexibilité adaptée aux besoins des postes. Sur site, hybrides ou à distance, nos environnements de travail sont conçus pour favoriser la productivité et l'engagement. Les employés hybrides concilient travail à distance et travail au bureau, les postes sur site contribuent quotidiennement à notre culture d'entreprise dynamique, et les employés à distance restent connectés grâce à la collaboration virtuelle et aux événements en personne. Où que vous travailliez, vous ferez partie d'une communauté dynamique, centrée sur l'humain, qui favorise la réussite collective.\nSoyez vous-même chez Quadient\nNos valeurs déterminent la manière dont nous travaillons en tant qu’équipe : Empowerment (Responsabilisation), Passion (Passion), Inspiration (Inspiration) et Community (Communauté). Elles nous inspirent à adopter un comportement EPIC. Ensemble. Ce qui différencie Quadient, c’est justement les différences de chacun et chacune. Nous sommes une équipe d’individus qui ont un objectif commun, mais de nombreux points de vue. Lorsque vous entretenez des relations avec Quadient, vous rejoignez une communauté bienveillante dont la culture prône la différence et accorde de la valeur à chaque avis.\nNous étudierons toute modification suggérée du processus d’entretien, dans la mesure où elle raisonnable. Si vous avez besoin d’aide avec le processus de dépôt de candidature, veuillez nous envoyer un e-mail à l’adresse career@quadient.com.\nQuadient est un employeur garantissant l'égalité des chances en matière d’emploi. * : Nous croyons fermement à l'absence totale de discrimination en matière d'emploi, quelle que soit la raison, notamment la race, la couleur, la , le sexe, .\nAlors que des millions de logements doivent être rénovés dans les années à venir, nous faisons le choix de la rigueur, de l’exigence technique et de la pédagogie pour faire grandir une filiè", "full_description": "À propos de nous\nCréé en 2020, Spekty est LE tiers de confiance du secteur, spécialisé dans le contrôle qualité des travaux de rénovation énergétique. Accrédité par le Cofrac, Spekty s’inscrit dans la filière TIC (Testing, Inspection, Certification) pour vérifier la conformité, la performance et la durabilité des travaux réalisés partout en France.\n🎯 Notre raison d’être\nSécuriser la massification de la rénovation énergétique.\nAlors que des millions de logements doivent être rénovés dans les années à venir, nous faisons le choix de la rigueur, de l’exigence technique et de la pédagogie pour faire grandir une filière encore jeune et en pleine structuration.\nMission\nNotre force d’intervention terrain grandit, et notre équipe de coordination aussi ! Vous serez la personne qui aide nos équipes à donner le meilleur d’elles-mêmes.\nVos Missions Au Quotidien Seront De\nRéceptionner les nouvelles commandes et affecter les différentes missions aux techniciens\nRéaliser les plannings d'intervention et optimiser les tournées\nCommuniquer de façon quotidienne auprès des interlocuteurs internes et externes sur l'avancement des commandes\nCoordonner les équipes de techniciens, et s'assurer de l'application des standards et bonnes pratiques (process de travail, délais impartis à leurs missions, bonne transmission des informations, etc.)\nAssurer les relations entre les différents interlocuteurs du projet (clients, Chefs de projets, techniciens…)\nRépondre aux questions techniques et pratiques des équipes de techniciens à propos des contrôles à réaliser, le cas échéant - se coordonner avec les référents techniques internes sur les sujets complexes\nSuivre l'activité et gérer les différentes priorités au quotidien\nContribuer à l’excellence opérationnelle en proposant des améliorations sur l’ensemble des process et en partageant des bonnes pratiques\nL'équipe est jeune et dynamique avec de nombreux recrutements sur les 2 prochaines années. Les perspectives d'évolution sont donc rapides et réelles.\nPourquoi Spekty ?\nPour arriver dans une petite équipe au début d’une aventure ultra ambitieuse avec un très fort potentiel marché\nPour rejoindre un projet engagé qui participe à la transition énergétique\nPour avoir des responsabilités et un fort impact sur notre développement\nPour redorer le blason du marché de la rénovation énergétique, tout simplement !\nProfil\nTitulaire d’un diplôme Bac +2/+3 minimum, vous justifiez d’une première expérience réussie (stages et alternance inclus) en planification et/ou en ordonnancement d’équipes. Reconnu(e) pour votre rigueur et votre sens de l’organisation, vous savez allier diplomatie et sens des résultats, tout en gardant toujours en ligne de mire les objectifs de l’entreprise.\nDoté(e) d’un excellent relationnel, vous vous adaptez avec aisance à des interlocuteurs variés et appréciez le travail en équipe.\nLes +\nDe superbes bureaux tout neufs (avec une douche pour celles et ceux qui aiment faire du sport sur la pause déj !)\nCarte GET MUCHO (titres-resto, 9.85€/jour et cagnotte flex de 70€/mois)\nJusqu'à 50€ de prise en charge transports (Remboursement Passe Navigo ou forfait mobilité douce pour les adeptes du vélo)\nMutuelle Alan prise en charge à hauteur de 60%\nAccord d'intéressement\nRéférence de l'offre : f63n3bvtv1"}, {"id": "op-4b049c39b737", "source_id": "4477693804", "source_name": "LinkedIn Emplois", "title": "Coordinateur opérationnel en transfert d’entreprises F/H", "company": "Demeco Group", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "2 300 € brut/mois", "has_salary": true, "salary_max_eur": 27600, "affinity_score": 89, "match_tags": ["Ouverture Tech & Coordination projet", "Écosystème Art & Expositions"], "posted_iso": "2026-10-09", "posted_fr": "9 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4477693804/", "highlights": ["Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !", "Dans le cadre de notre développement, nous sommes à la recherche d'un Coordinateur opérationnel en transfert d’entreprises en CDI.", "Rattaché(e) au Chef de Projet et en lien avec les équipes opérationnelles, vous participez à la réussite des projets à haute valeur ajoutée en assurant la coordination complète des opérations sur le terrain.", "Vous veillez au bon déroulement des chantiers, de leur préparation jusqu'à leur réalisation, en garantissant le respect des délais, des exigences du client et des règles de sécurité."], "summary_excerpt": "Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !\nCréé en 1986, HEXVIA représente plus d’une cinquantaine de sociétés implantées au niveau européen. Groupe leader français dans le secteur de la mobilité, avec 140 M€ de chiffre d’affaires réalisés en 2026, nous comptons plus de 1300 collaborateurs rassemblés autour de valeurs communes : l’Humain, le Respect, la Force Collective et la Conquête.\nDemeco Entreprises, est la division du Groupe dédiée aux services des entreprises, propose depuis 40 ans des services sur-mesure à haute valeur ajoutée principalement auprès des grands groupes français, laboratoires, ", "full_description": "Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !\nCréé en 1986, HEXVIA représente plus d’une cinquantaine de sociétés implantées au niveau européen. Groupe leader français dans le secteur de la mobilité, avec 140 M€ de chiffre d’affaires réalisés en 2026, nous comptons plus de 1300 collaborateurs rassemblés autour de valeurs communes : l’Humain, le Respect, la Force Collective et la Conquête.\nDemeco Entreprises, est la division du Groupe dédiée aux services des entreprises, propose depuis 40 ans des services sur-mesure à haute valeur ajoutée principalement auprès des grands groupes français, laboratoires, hôpitaux et lieux accueillant du public (évènementiel, hôtellerie, musées). Demeco Entreprises est spécialisés dans le conseil, l’organisation et l’exécution d’opérations de manutention, de transfert et de déménagement d’équipements à forte valeur ajoutée.\nDans le cadre de notre développement, nous sommes à la recherche d'un Coordinateur opérationnel en transfert d’entreprises en CDI.\nPourquoi venir chez nous ?\nNous délivrons nos services dans des environnements variés, allant de bureaux tertiaires, en passant par l’installation et l’aménagement complet d’espaces évènementiels ou touristiques, jusqu’au transfert « clef en main » de laboratoires ou d’hôpitaux complets.\nNos clients nous choisissent pour notre image de marque rassurante, notre professionnalisme, notre réactivité et notre fort esprit de service (EDF, Veolia, Servier, Alstom, Grand Palais de Paris, Ambassade des Etats-Unis…).\nDescription Du Poste\nRattaché(e) au Chef de Projet et en lien avec les équipes opérationnelles, vous participez à la réussite des projets à haute valeur ajoutée en assurant la coordination complète des opérations sur le terrain.\nVous veillez au bon déroulement des chantiers, de leur préparation jusqu'à leur réalisation, en garantissant le respect des délais, des exigences du client et des règles de sécurité.\nVos Principales Activités\nRéaliser chez les clients des visites techniques préparatoires à l’exécution des opérations ou dans le cadre d’appels d’offres\nChiffrer les besoins en équipements, moyens et ressources humaines\nEtablir des notes méthodologiques et des plannings qui répondent aux besoins des Clients\nOrganiser et encadrer ses équipes opérationnelles dans le respect des consignes et de la feuille de route du chef de projet (planifier, expliquer, accompagner, contrôler)\nContrôler le respect des consignes de sécurité et de qualité, le respect des délais et le bon déroulement des opérations\nCommuniquer en continu avec les représentants du Client\nÊtre force de proposition, décider et apporter des solutions lors de la réalisation du chantier\nParticiper aux opérations dans un esprit d’exemplarité des bonnes pratiques (15% du temps de travail, conduite d’engins le cas échéants)\nRéaliser les contrôles de conformité et la traçabilité en fin d’opération\nVous assurez l'interface entre le client, les équipes opérationnelles et les différents intervenants afin de garantir la bonne exécution des prestations. Véritable référent terrain, vous anticipez les besoins, coordonnez les moyens humains et matériels et apportez des solutions adaptées aux problématiques rencontrées durant les opérations.\nProfil recherché\nIdéalement issu(e) d'une formation dans le domaine du transport ou de la gestion de projets, vous justifiez d'une expérience significative de + 3 ans en pilotage de transferts (déménagements d’entreprises ou industries) ou en management logistique\nDoté(e) d'un excellent relationnel, vous savez fédérer les équipes, communiquer efficacement avec les clients et les différents intervenants, et faire preuve de réactivité face aux imprévus.\nAutonome, rigoureux(se) et organisé(e), vous êtes capable de gérer plusieurs opérations simultanément tout en garantissant le respect des délais, des consignes de sécurité et de la qualité de service.\nVous disposez de solides capacités managériales, d'un bon sens d'exemplarité, discrétion et d'écoute. Vous êtes à l'aise avec l'anticipation et savez prendre des décisions rapidement dans un environnement opérationnel exigeant.\nLa maîtrise des techniques liées au transfert administratif, la connaissance de la réglementation du transport ainsi que la lecture de plans constituent de véritables atouts pour réussir dans cette fonction.\nLa possession des permis PL/SPL, Caces R489 cat.3-4, Caces R486 Nacelle sont un plus. Casier judicier vierge impératif.\nDans le cadre de notre politique d'insertion professionnelle, nous examinons toutes les candidatures sur un pied d’égalité, y compris celles des personnes en situation de handicap ou en retour à l'emploi.\nSalaire Et Conditions\nType de contrat : CDI\nRémunération selon profil et expérience : 2300 € à 3 000 € sur 12 mois + Intéressement + avantages entreprise\nMutuelle, comité d’entreprise\nPoste basé à Paris (75) ou Roissy (95)\nDéplacements réguliers toute France\nDéplacements avec découchés 2 à 5 jours /mois\nLes exigences de certaines opérations peuvent imposer des amplitudes horaires importantes mais ponctuelles\nRattachement à une équipe de coordinateurs dédiés aux projets à grande envergure\nEntreprise en croissance offrant des possibilités d’évolution\nVous recherchez un poste opérationnel et challengeant alors n'hésitez plus et candidatez ! Toute l'équipe de Demeco Entreprises sera ravie de vous accueillir !"}, {"id": "op-318116fed6ec", "source_id": "4483208423", "source_name": "LinkedIn Emplois", "title": "Data Center IT Project Coordinator H/F/N", "company": "OVHcloud", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris et périphérie", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 88, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_i offee company, with a presence in more than 100 markets. Guided by our ‘Reignite the Amazing’ strategy, we are focused on brand-led growth across three big bets: Peet’s, L’OR, and our 10 strategically selected local icons led by Jacobs. In 2025, JDE Peet’s generated total sales of EUR 9.9 billion and employed a global workforce of more than 21,000 employees. Discover more about our journey to deliver a coffee for every cup and a brand for every heart at www.jdepeets.com.\nStart your journey with a cup of amazing and Join our Global Management Trainee Program! From day one, you’ll dive into a world of opportunity, growth, and bold ideas.\nJob Description\nWHAT’S IN THE CUP FOR YOU?\nReady to kick-start your career with purpose, passion, and a whole lot of coffee? At JDE Peet's, our Global Management Trainee Program is your opportunity to step into a bold, fast-moving world where you can make an impact from day one. Now part of Keurig Dr Pepper, we’re shaping the future of coffee together, bringing together iconic brands, diverse markets, and talented people across the globe. Over 12 exciting months, you’ll experience our business from the inside out through a series of rotations across functions and, where relevant, markets. You’ll work alongside global teams, take on real business challenges, and lead a high-impact project that puts your ideas into action. With support from senior mentors to sharpen your leadership skills, you will build the confidence to shape what comes next.\nReady to think globally, move boldly, and help shape what’s next for coffee? Join us.\nDiscover more about the program on JDE Peet’s Global Management Trainee page.\nQualifications\nTo join our Global Management Trainee Program, here’s what you’ll need:\nYou’re on track to graduate (Bachelor’s or Master’s) in time for the program kick-off in September 2027 and ready to start full-time.\nYou bring fresh perspective, with a maximum of 2 years full-time professional experience.\nYou communicate Jacobs."}, {"id": "op-2e9cbf36befa", "source_id": "4480442680", "source_name": "LinkedIn Emplois", "title": "Operations Coordinator", "company": "Bolt", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Saint-Ouen (93)", "city_raw": "Saint-Ouen", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 81, "match_tags": ["Ouverture Tech & Coordination projet"], "posted_iso": "2026-10-20", "posted_fr": "20 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4480442680/", "highlights": ["We are looking for an organised, energetic and warm Operations Coordinator to join our ride-hailing operations in Paris.", "Let's build the future of mobility together!", "Based on-site in Saint-Ouen, Paris; remote work is not available.", "Occasional travel within Île-de-France."], "summary_excerpt": "About Bolt\nBolt is shaping a future where cities are built for people, not cars. What started as an ambitious project of a 19-year-old in 2013 has grown into a global mobility platform used by more than 200 million customers and 4.5 million driver and courier partners across 50 countries.\nFrom ride-hailing and food delivery to scooters, e-bikes, and car-sharing, Bolt helps people move through cities every day. Small, autonomous teams drive this work, combining the speed and ownership of a startup with the scale of a global technology company backed by more than €1bn in funding.\nAnd we're just getting started.\nAbo", "full_description": "About Bolt\nBolt is shaping a future where cities are built for people, not cars. What started as an ambitious project of a 19-year-old in 2013 has grown into a global mobility platform used by more than 200 million customers and 4.5 million driver and courier partners across 50 countries.\nFrom ride-hailing and food delivery to scooters, e-bikes, and car-sharing, Bolt helps people move through cities every day. Small, autonomous teams drive this work, combining the speed and ownership of a startup with the scale of a global technology company backed by more than €1bn in funding.\nAnd we're just getting started.\nAbout The Role\nWe are looking for an organised, energetic and warm Operations Coordinator to join our ride-hailing operations in Paris.\nBased at our Saint-Ouen partner hub, you will welcome and support new drivers, and help make the space a lively, useful and pleasant place for the whole community. You will work in a close-knit team, alongside a Team Lead and an Operations Manager.\nLet's build the future of mobility together!\nLocation and working arrangement\nBased on-site in Saint-Ouen, Paris; remote work is not available.\nOccasional travel within Île-de-France.\nMain Tasks And Responsibilities\nWelcome and support drivers\nWelcome new drivers, train them on the Bolt platform and support them through their first rides.\nCheck driver and vehicle documents carefully, answer drivers’ questions, resolve issues and share their feedback with the relevant teams.\nCoordinate and bring the partner hub to life\nCoordinate the hub’s day-to-day operations, including reception, visitor flow, cleanliness, service providers and safety.\nOrganise workshops, meetups and other on-site and off-site events across Île-de-France to connect drivers, raise awareness of Bolt and build partner loyalty.\nImprove our operations\nTrack and analyse results, then suggest practical improvements.\nTake ownership of cross-functional projects and work with HQ and French teams to improve how we operate.\nAbout You\nYou have a successful first experience in customer service, sales, hospitality or event hosting.\nYou build rapport easily with people from different backgrounds.\nYou are rigorous and attentive to detail.\nYou take initiative, enjoy solving problems and are comfortable suggesting ideas.\nYou stay calm during busy periods, manage deadlines well and are comfortable using digital tools.\nYou speak excellent French; English is a plus. Experience in events, tech, transport or a fast-growing company is also a plus.\nWhy you’ll love it here\nAccelerate your professional growth with unique career opportunities.\nEnjoy a rewarding salary and stock options, knowing that as Bolt succeeds, so do you.\nTake care of your physical and mental health with our wellness perks.\nCelebrate 5 years at Bolt with a 1-month paid sabbatical to recharge.\nConnect with colleagues at annual company events and smaller team gatherings.\nBalance flexibility and in-person collaboration with our hybrid model, including at least 12 monthly in-office days.\nSome perks may differ depending on your location and role.\nAt Bolt, using AI daily is a baseline expectation for everyone. If there’s a faster, smarter way to do your work, we expect you to find it. You’re still responsible for the output, so the standard stays high when using AI tools.\nExperience is great, but what we really look for is drive, intelligence, and integrity. So even if you don’t tick every box, please consider applying!\nEveryone is welcome\nBolt is an equal opportunity employer. We are committed to building a diverse and inclusive workplace where all qualified applicants are considered for employment without regard to race, colour, nationality, , gender or gender identity, sexual orientation, age, or disability.\nWe welcome applications from all backgrounds and are happy to make reasonable accommodations throughout our hiring process. If you require any adjustments, please let us know."}]}</script>

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { statuses: {}, notes: {}, snapshots: {} };
          const parsed = JSON.parse(raw);
          return {
            statuses: parsed.statuses || {},
            notes: parsed.notes || {},
            snapshots: parsed.snapshots || {}
          };
        } catch (e) {
          return { statuses: {}, notes: {}, snapshots: {} };
        }
      }

      let userState = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
        } catch (e) {}
        updateTrackedCounter();
      }

      const filters = {
        q: "",
        family: "ALL",
        zone: "ALL",
        contract: "ALL",
        onlyArt: false,
        onlySalary: false,
        onlyGrad: false,
        showHidden: false,
        sort: "relevance"
      };

      let selectedOfferId = LIVE_OFFERS.length > 0 ? LIVE_OFFERS[0].id : null;
      let activeView = "catalog";

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function foldAccents(str) {
        return String(str ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function safeExternalUrl(u) {
        const s = String(u || "").trim();
        if (s.startsWith("https://") || s.startsWith("http://")) return s;
        return "#";
      }

      function snapshotOffer(offer) {
        if (!offer || !offer.id) return;
        userState.snapshots[offer.id] = {
          id: offer.id,
          title: offer.title,
          company: offer.company,
          city_display: offer.city_display,
          contract_type: offer.contract_type,
          salary_display: offer.salary_display,
          has_salary: offer.has_salary,
          family_id: offer.family_id,
          family_short: offer.family_short,
          family_label: offer.family_label,
          exp_label: offer.exp_label,
          lang_badge: offer.lang_badge,
          url: offer.url,
          posted_fr: offer.posted_fr,
          highlights: offer.highlights || [],
          full_description: offer.full_description || ""
        };
      }

      function setOfferStatus(offerId, newStatus) {
        const offer = LIVE_OFFERS.find(o => o.id === offerId) || userState.snapshots[offerId];
        if (userState.statuses[offerId] === newStatus) {
          delete userState.statuses[offerId];
        } else {
          userState.statuses[offerId] = newStatus;
          if (offer) snapshotOffer(offer);
        }
        saveState();
        renderAll();
      }

      function setOfferNote(offerId, text) {
        const offer = LIVE_OFFERS.find(o => o.id === offerId) || userState.snapshots[offerId];
        const trimmed = String(text || "");
        if (!trimmed.trim()) {
          delete userState.notes[offerId];
        } else {
          userState.notes[offerId] = trimmed;
          if (offer) snapshotOffer(offer);
        }
        saveState();
      }

      function matchesBaseSearchAndToggles(o, ignoreAxis) {
        const st = userState.statuses[o.id];
        if (st === "hidden" && !filters.showHidden) return false;
        if (filters.onlyArt && o.family_id !== "ART_LOGISTICS") return false;
        if (filters.onlySalary && !o.has_salary) return false;
        if (filters.onlyGrad && !o.is_graduate_program && o.contract_type !== "Graduate Program") return false;

        if (ignoreAxis !== "family" && filters.family !== "ALL" && o.family_id !== filters.family) return false;
        if (ignoreAxis !== "zone" && filters.zone !== "ALL" && o.zone_id !== filters.zone) return false;
        if (ignoreAxis !== "contract" && filters.contract !== "ALL" && o.contract_type !== filters.contract) return false;

        if (filters.q) {
          const hay = foldAccents(
            `${o.title} ${o.company} ${o.city_display} ${o.sector} ${o.salary_display} ${(o.match_tags || []).join(" ")} ${o.summary_excerpt || ""}`
          );
          const terms = foldAccents(filters.q).split(/\s+/).filter(Boolean);
          for (const t of terms) {
            if (!hay.includes(t)) return false;
          }
        }
        return true;
      }

      function getFilteredOffers() {
        const list = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, null));
        const famRank = { ART_LOGISTICS: 0, SUPPLY_CHAIN: 1, TECH_PROJECT_OPS: 2 };
        list.sort((a, b) => {
          if (filters.sort === "recent") {
            return String(b.posted_iso || "").localeCompare(String(a.posted_iso || "")) || (b.affinity_score - a.affinity_score);
          }
          if (filters.sort === "salary") {
            if (Boolean(b.has_salary) !== Boolean(a.has_salary)) return b.has_salary ? 1 : -1;
            if ((b.salary_max_eur || 0) !== (a.salary_max_eur || 0)) return (b.salary_max_eur || 0) - (a.salary_max_eur || 0);
            return b.affinity_score - a.affinity_score;
          }
          // Default: trajectory relevance (Art spotlight -> Supply Chain -> Tech Ops, then score)
          const frA = famRank[a.family_id] ?? 9;
          const frB = famRank[b.family_id] ?? 9;
          if (frA !== frB) return frA - frB;
          if (b.affinity_score !== a.affinity_score) return b.affinity_score - a.affinity_score;
          return (a.zone_rank || 9) - (b.zone_rank || 9);
        });
        return list;
      }

      function updateDynamicCounts() {
        ["ALL", "ART_LOGISTICS", "SUPPLY_CHAIN", "TECH_PROJECT_OPS"].forEach(fam => {
          const el = document.querySelector(`[data-count-fam="${fam}"]`);
          if (!el) return;
          const n = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, "family") && (fam === "ALL" || o.family_id === fam)).length;
          el.textContent = String(n);
        });

        ["ALL", "PARIS_75", "IDF_93", "IDF_COURONNE", "REMOTE_FR"].forEach(zn => {
          const el = document.querySelector(`[data-count-zone="${zn}"]`);
          if (!el) return;
          const n = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, "zone") && (zn === "ALL" || o.zone_id === zn)).length;
          el.textContent = String(n);
        });

        const hiddenCount = LIVE_OFFERS.filter(o => userState.statuses[o.id] === "hidden").length;
        const hiddenWrap = document.getElementById("hidden-counter-wrap");
        const hiddenBtn = document.getElementById("toggle-show-hidden-btn");
        if (hiddenCount > 0) {
          hiddenWrap.style.display = "inline";
          hiddenBtn.textContent = filters.showHidden
            ? `Masquer à nouveau (${hiddenCount})`
            : `Afficher les offres masquées (${hiddenCount})`;
        } else {
          hiddenWrap.style.display = "none";
        }

        const anyFilter =
          filters.q !== "" ||
          filters.family !== "ALL" ||
          filters.zone !== "ALL" ||
          filters.contract !== "ALL" ||
          filters.onlyArt ||
          filters.onlySalary ||
          filters.onlyGrad;
        document.getElementById("reset-filters-btn").style.display = anyFilter ? "inline-block" : "none";
        document.getElementById("clear-search-btn").style.display = filters.q ? "block" : "none";
      }

      function updateTrackedCounter() {
        const trackedIds = Object.keys(userState.statuses).filter(id => {
          const s = userState.statuses[id];
          return s && s !== "hidden";
        });
        document.getElementById("nav-tracked-count").textContent = String(trackedIds.length);
      }

      function renderOfferList(filtered) {
        const container = document.getElementById("offer-list-container");
        const counterText = document.getElementById("results-counter-text");
        counterText.textContent = `${filtered.length} opportunité${filtered.length > 1 ? "s" : ""} active${filtered.length > 1 ? "s" : ""} sur ${LIVE_OFFERS.length}`;

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p style="font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-950);margin-bottom:6px;">Aucune offre ne correspond à ce croisement de filtres</p>
              <p style="font-size:13px;">Essaie d'élargir la zone Île-de-France ou de réinitialiser les filtres actifs.</p>
            </div>
          `;
          return;
        }

        if (!selectedOfferId || !filtered.some(o => o.id === selectedOfferId)) {
          selectedOfferId = filtered[0].id;
        }

        container.innerHTML = filtered.map(o => {
          const isSel = o.id === selectedOfferId;
          const st = userState.statuses[o.id];
          const polePrefix = o.family_id === "ART_LOGISTICS" ? "★ " : "";
          const salHtml = o.has_salary
            ? `<span class="salary-pill-yes">${escapeHtml(o.salary_display)}</span>`
            : `<span class="salary-pill-no">Salaire non précisé</span>`;
          const statusHtml = st && STATUS_LABELS[st]
            ? `<span class="status-dot-pill">${escapeHtml(STATUS_LABELS[st])}</span>`
            : "";

          return `
            <article class="offer-card ${isSel ? "selected" : ""}" data-offer-id="${escapeHtml(o.id)}">
              <div class="card-top-meta">
                <span class="pole-tag pole-${escapeHtml(o.family_id)}">${polePrefix}${escapeHtml(o.family_short)}</span>
                <span class="zone-stamp">${escapeHtml(o.city_display)}</span>
              </div>
              <h2 class="card-title">${escapeHtml(o.title)}</h2>
              <div class="card-company">${escapeHtml(o.company)}</div>
              <div class="card-bottom-meta">
                <div class="meta-pills">
                  <span class="mono-pill">${escapeHtml(o.contract_type)}</span>
                  <span class="mono-pill">${escapeHtml(o.lang_badge)}</span>
                  ${salHtml}
                </div>
                ${statusHtml}
              </div>
            </article>
          `;
        }).join("");

        container.querySelectorAll(".offer-card").forEach(card => {
          card.addEventListener("click", () => {
            selectedOfferId = card.getAttribute("data-offer-id");
            renderOfferList(filtered);
            renderDetailPane(filtered);
            if (window.innerWidth <= 940) {
              document.getElementById("detail-pane").classList.add("mobile-open");
            }
          });
        });
      }

      function renderDetailPane(filtered) {
        const pane = document.getElementById("detail-pane");
        const offer = filtered.find(o => o.id === selectedOfferId) || LIVE_OFFERS.find(o => o.id === selectedOfferId);
        if (!offer) {
          pane.innerHTML = `<div class="empty-state">Sélectionne une opportunité dans la liste pour afficher le descriptif complet.</div>`;
          return;
        }

        const st = userState.statuses[offer.id] || "";
        const noteVal = userState.notes[offer.id] || "";
        const polePrefix = offer.family_id === "ART_LOGISTICS" ? "★ " : "";
        const salClass = offer.has_salary ? "sal-highlight" : "sal-muted";
        const salText = offer.has_salary ? offer.salary_display : "Salaire non précisé";

        const tagsHtml = (offer.match_tags || []).map(
          t => `<span class="match-tag">${escapeHtml(t)}</span>`
        ).join("");

        const highlightsHtml = (offer.highlights && offer.highlights.length > 0)
          ? `<h3 class="section-subtitle">Points clés du poste</h3>
             <ul class="highlights-list">
               ${offer.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join("")}
             </ul>`
          : "";

        pane.innerHTML = `
          <div class="mobile-close-bar">
            <button type="button" class="mobile-back-btn" id="mobile-close-detail-btn">← Retour aux offres</button>
            <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-500);">${escapeHtml(offer.city_display)}</span>
          </div>

          <div class="detail-header">
            <div class="detail-kicker">
              <span class="pole-tag pole-${escapeHtml(offer.family_id)}">${polePrefix}${escapeHtml(offer.family_label)}</span>
              <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-500);">Publiée / vérifiée : ${escapeHtml(offer.posted_fr)} · ${escapeHtml(offer.source_name)}</span>
            </div>
            <h2 class="detail-title">${escapeHtml(offer.title)}</h2>
            <div class="detail-company-line">${escapeHtml(offer.company)} · <span style="color:var(--ink-500);font-weight:400;">${escapeHtml(offer.sector)}</span></div>
            <div class="cta-row">
              <a class="primary-apply-btn" href="${escapeHtml(safeExternalUrl(offer.url))}" target="_blank" rel="noopener noreferrer">
                Voir l'offre et postuler ↗
              </a>
            </div>
          </div>

          <div class="spec-grid">
            <div class="spec-cell">
              <div class="spec-label">Localisation</div>
              <div class="spec-val">${escapeHtml(offer.city_display)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Rémunération</div>
              <div class="spec-val ${salClass}">${escapeHtml(salText)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Contrat &amp; Expérience</div>
              <div class="spec-val">${escapeHtml(offer.contract_type)} · ${escapeHtml(offer.exp_label)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Langues</div>
              <div class="spec-val">${escapeHtml(offer.lang_badge)}</div>
            </div>
          </div>

          ${tagsHtml ? `<div class="match-tags-row">${tagsHtml}</div>` : ""}

          <div class="pipeline-box">
            <div class="pipeline-label">Classer dans mon suivi</div>
            <div class="pipeline-btns">
              <button type="button" class="pipe-btn ${st === "saved" ? "active" : ""}" data-set-status="saved">À postuler</button>
              <button type="button" class="pipe-btn ${st === "applied" ? "active" : ""}" data-set-status="applied">Postulé</button>
              <button type="button" class="pipe-btn ${st === "interview" ? "active" : ""}" data-set-status="interview">Entretien</button>
              <button type="button" class="pipe-btn ${st === "offer" ? "active" : ""}" data-set-status="offer">Offre reçue</button>
              <button type="button" class="pipe-btn hide-btn ${st === "hidden" ? "active" : ""}" data-set-status="hidden">Masquer</button>
            </div>
            <textarea class="note-area" id="detail-note-input" placeholder="Ajouter une note personnelle (contact, relance, date d'entretien)...">${escapeHtml(noteVal)}</textarea>
          </div>

          ${highlightsHtml}

          <h3 class="section-subtitle">Descriptif complet</h3>
          <div class="desc-body">${escapeHtml(offer.full_description || offer.summary_excerpt || "")}</div>
        `;

        const closeBtn = document.getElementById("mobile-close-detail-btn");
        if (closeBtn) {
          closeBtn.addEventListener("click", () => {
            pane.classList.remove("mobile-open");
          });
        }

        pane.querySelectorAll("[data-set-status]").forEach(btn => {
          btn.addEventListener("click", () => {
            setOfferStatus(offer.id, btn.getAttribute("data-set-status"));
          });
        });

        const noteInput = document.getElementById("detail-note-input");
        if (noteInput) {
          noteInput.addEventListener("input", () => {
            setOfferNote(offer.id, noteInput.value);
          });
        }
      }

      function renderKanban() {
        const board = document.getElementById("kanban-board-container");
        const cols = [
          { key: "saved", title: "À postuler" },
          { key: "applied", title: "Candidature envoyée" },
          { key: "interview", title: "Entretien en cours" },
          { key: "offer", title: "Offre reçue" }
        ];

        board.innerHTML = cols.map(col => {
          const items = Object.keys(userState.statuses)
            .filter(id => userState.statuses[id] === col.key)
            .map(id => LIVE_OFFERS.find(o => o.id === id) || userState.snapshots[id])
            .filter(Boolean);

          const cardsHtml = items.length === 0
            ? `<p style="font-size:12px;color:var(--ink-400);padding:8px 2px;">Aucune offre dans cette colonne.</p>`
            : items.map(item => {
                const note = userState.notes[item.id] || "";
                const isArchived = !LIVE_OFFERS.some(o => o.id === item.id);
                return `
                  <div class="k-card">
                    <div style="display:flex;justify-content:space-between;gap:6px;align-items:center;">
                      <span class="mono-pill">${escapeHtml(item.contract_type || "CDI")}</span>
                      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);">${escapeHtml(item.city_display || "")}</span>
                    </div>
                    <div class="k-card-title">${escapeHtml(item.title)}</div>
                    <div style="font-size:12.5px;color:var(--ink-700);font-weight:500;">${escapeHtml(item.company)}</div>
                    <div style="font-family:var(--font-mono);font-size:11px;color:${item.has_salary ? "var(--sal-700)" : "var(--ink-400)"};">
                      ${escapeHtml(item.salary_display || "Salaire non précisé")}
                    </div>
                    ${isArchived ? `<div style="font-size:11px;color:var(--warn-700);background:var(--warn-100);padding:3px 6px;border-radius:4px;">Archive conservée (annonce clôturée en ligne)</div>` : ""}
                    ${note ? `<div class="k-note-preview">${escapeHtml(note)}</div>` : ""}
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:6px;flex-wrap:wrap;">
                      <a href="${escapeHtml(safeExternalUrl(item.url))}" target="_blank" rel="noopener noreferrer" style="font-size:12px;font-weight:600;text-decoration:underline;">Lien annonce ↗</a>
                      <select data-move-id="${escapeHtml(item.id)}" style="font-size:11.5px;padding:3px 6px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--bg-sheet);">
                        <option value="saved" ${col.key === "saved" ? "selected" : ""}>À postuler</option>
                        <option value="applied" ${col.key === "applied" ? "selected" : ""}>Postulé</option>
                        <option value="interview" ${col.key === "interview" ? "selected" : ""}>Entretien</option>
                        <option value="offer" ${col.key === "offer" ? "selected" : ""}>Offre reçue</option>
                        <option value="remove">Retirer du suivi</option>
                      </select>
                    </div>
                  </div>
                `;
              }).join("");

          return `
            <section class="kanban-col">
              <div class="kanban-col-head">
                <span>${escapeHtml(col.title)}</span>
                <span class="mono-pill">${items.length}</span>
              </div>
              ${cardsHtml}
            </section>
          `;
        }).join("");

        board.querySelectorAll("[data-move-id]").forEach(sel => {
          sel.addEventListener("change", () => {
            const id = sel.getAttribute("data-move-id");
            const val = sel.value;
            if (val === "remove") {
              delete userState.statuses[id];
              saveState();
              renderAll();
            } else {
              userState.statuses[id] = val;
              saveState();
              renderAll();
            }
          });
        });
      }

      function renderAll() {
        document.getElementById("nav-total-count").textContent = String(LIVE_OFFERS.length);
        if (META.updated_at_fr) {
          document.getElementById("sync-meta-label").textContent =
            `Paris & Île-de-France · Actualisé le ${META.updated_at_fr}`;
        }
        updateDynamicCounts();
        updateTrackedCounter();
        const filtered = getFilteredOffers();
        renderOfferList(filtered);
        renderDetailPane(filtered);
        if (activeView === "kanban") {
          renderKanban();
        }
      }

      // Wire events
      document.getElementById("search-input").addEventListener("input", e => {
        filters.q = e.target.value || "";
        renderAll();
      });

      document.getElementById("clear-search-btn").addEventListener("click", () => {
        filters.q = "";
        document.getElementById("search-input").value = "";
        renderAll();
      });

      document.getElementById("toggle-art-btn").addEventListener("click", e => {
        filters.onlyArt = !filters.onlyArt;
        e.currentTarget.classList.toggle("active", filters.onlyArt);
        renderAll();
      });

      document.getElementById("toggle-salary-btn").addEventListener("click", e => {
        filters.onlySalary = !filters.onlySalary;
        e.currentTarget.classList.toggle("active", filters.onlySalary);
        renderAll();
      });

      document.getElementById("toggle-grad-btn").addEventListener("click", e => {
        filters.onlyGrad = !filters.onlyGrad;
        e.currentTarget.classList.toggle("active", filters.onlyGrad);
        renderAll();
      });

      document.getElementById("sort-select").addEventListener("change", e => {
        filters.sort = e.target.value;
        renderAll();
      });

      document.querySelectorAll("#family-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.family = btn.getAttribute("data-family");
          document.querySelectorAll("#family-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.querySelectorAll("#zone-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.zone = btn.getAttribute("data-zone");
          document.querySelectorAll("#zone-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.querySelectorAll("#contract-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.contract = btn.getAttribute("data-contract");
          document.querySelectorAll("#contract-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.getElementById("reset-filters-btn").addEventListener("click", () => {
        filters.q = "";
        filters.family = "ALL";
        filters.zone = "ALL";
        filters.contract = "ALL";
        filters.onlyArt = false;
        filters.onlySalary = false;
        filters.onlyGrad = false;
        document.getElementById("search-input").value = "";
        document.getElementById("toggle-art-btn").classList.remove("active");
        document.getElementById("toggle-salary-btn").classList.remove("active");
        document.getElementById("toggle-grad-btn").classList.remove("active");
        document.querySelectorAll("#family-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        document.querySelectorAll("#zone-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        document.querySelectorAll("#contract-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        renderAll();
      });

      document.getElementById("toggle-show-hidden-btn").addEventListener("click", () => {
        filters.showHidden = !filters.showHidden;
        renderAll();
      });

      function switchView(view) {
        activeView = view;
        const isCat = view === "catalog";
        document.getElementById("tab-catalog-btn").classList.toggle("active", isCat);
        document.getElementById("tab-catalog-btn").setAttribute("aria-selected", String(isCat));
        document.getElementById("tab-kanban-btn").classList.toggle("active", !isCat);
        document.getElementById("tab-kanban-btn").setAttribute("aria-selected", String(!isCat));
        document.getElementById("catalog-controls").style.display = isCat ? "block" : "none";
        document.getElementById("catalog-view").style.display = isCat ? "block" : "none";
        document.getElementById("kanban-view").classList.toggle("active", !isCat);
        renderAll();
      }

      document.getElementById("tab-catalog-btn").addEventListener("click", () => switchView("catalog"));
      document.getElementById("tab-kanban-btn").addEventListener("click", () => switchView("kanban"));

      document.getElementById("export-state-btn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(userState, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "suivi-opportunites.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });

      document.getElementById("import-state-btn").addEventListener("click", () => {
        document.getElementById("import-file-input").click();
      });

      document.getElementById("import-file-input").addEventListener("change", e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const imported = JSON.parse(String(ev.target.result || "{}"));
            if (imported && typeof imported === "object") {
              userState = {
                statuses: imported.statuses || {},
                notes: imported.notes || {},
                snapshots: imported.snapshots || {}
              };
              saveState();
              renderAll();
            }
          } catch (err) {}
        };
        reader.readAsText(f);
        e.target.value = "";
      });

      renderAll();
    })();
  </script>
</body>
