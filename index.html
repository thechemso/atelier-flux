<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Sélection vérifiée d'opportunités CDI, CDD et Graduate Programs à Paris, en Seine-Saint-Denis (93), en Île-de-France et en télétravail complet : Logistique d'œuvres d'art, Supply Chain et Opérations/Projets." />
  <title>ATELIER // FLUX — Opportunités Logistique d'Art, Supply Chain &amp; Projets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-ground: #F6F5F0;
      --bg-sheet: #FFFFFF;
      --bg-muted: #ECEAE2;
      --bg-hover: #F2F0E8;
      --bg-selected: #FBF4F0;

      --ink-950: #151513;
      --ink-700: #3D3C38;
      --ink-500: #66645E;
      --ink-400: #8C8981;

      --rule-light: #E4E1D8;
      --rule-strong: #C9C5B9;

      /* Pole 1: Fine Art & Exhibition Regie (Terracotta Crate Stencil) */
      --art-700: #AD3E1D;
      --art-600: #C24924;
      --art-100: #FCEEE9;
      --art-200: #F3D1C6;

      /* Pole 2: Supply Chain, Transit & Procurement (Maritime Petrol) */
      --supply-700: #184A66;
      --supply-100: #E9F2F7;
      --supply-200: #C6DDEA;

      /* Pole 3: Tech & Project Operations (Mineral Sage) */
      --ops-700: #245740;
      --ops-100: #EAF4EF;
      --ops-200: #C4DFD1;

      /* Salary & Status Accents */
      --sal-700: #1D5B3E;
      --sal-100: #E7F5EE;
      --warn-700: #8A5311;
      --warn-100: #FDF3E3;

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-ground);
      color: var(--ink-950);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle archival paper texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    a { color: inherit; }

    /* ---------------- MASTHEAD ---------------- */
    .masthead {
      background: var(--bg-sheet);
      border-bottom: 1px solid var(--rule-strong);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .masthead-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.03em;
      color: var(--ink-950);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark .slash {
      color: var(--art-600);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-500);
      padding-left: 12px;
      border-left: 1px solid var(--rule-strong);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-tabs {
      display: inline-flex;
      background: var(--bg-ground);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .view-tab {
      border: none;
      background: transparent;
      padding: 6px 13px;
      border-radius: var(--radius-xs);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-700);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .view-tab.active {
      background: var(--ink-950);
      color: #FFFFFF;
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(255,255,255,0.18);
    }
    .view-tab:not(.active) .tab-count {
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .utility-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .utility-btn:hover {
      background: var(--bg-hover);
      border-color: var(--ink-700);
    }

    /* ---------------- FILTER & SPOTLIGHT BAR ---------------- */
    .control-deck {
      background: var(--bg-ground);
      border-bottom: 1px solid var(--rule-light);
    }

    .control-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .top-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1 1 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 34px 9px 13px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--ink-950);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--ink-950);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--ink-500);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      display: none;
    }

    .spotlight-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .spot-pill {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.14s ease;
    }

    .spot-pill:hover {
      background: var(--bg-hover);
    }

    .spot-pill.art-spot.active {
      background: var(--art-700);
      border-color: var(--art-700);
      color: #FFFFFF;
    }

    .spot-pill.sal-spot.active {
      background: var(--sal-700);
      border-color: var(--sal-700);
      color: #FFFFFF;
    }

    .spot-pill.grad-spot.active {
      background: var(--supply-700);
      border-color: var(--supply-700);
      color: #FFFFFF;
    }

    .sort-select {
      padding: 7px 11px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      outline: none;
    }

    .filter-strips {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .group-caption {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-right: 4px;
    }

    .filter-chip {
      border: 1px solid var(--rule-light);
      background: var(--bg-sheet);
      color: var(--ink-700);
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .filter-chip:hover {
      border-color: var(--rule-strong);
      background: var(--bg-hover);
    }

    .filter-chip.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
    }

    .filter-chip .c-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      opacity: 0.78;
    }

    .reset-link {
      border: none;
      background: transparent;
      color: var(--art-700);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    /* ---------------- WORKSPACE SPLIT PANE ---------------- */
    .workspace {
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: minmax(370px, 47%) 1fr;
      gap: 18px;
      align-items: start;
    }

    .results-Summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 10px;
      font-size: 12px;
      color: var(--ink-500);
      font-family: var(--font-mono);
    }

    .offer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .offer-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease, background-color 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .offer-card:hover {
      border-color: var(--rule-strong);
      background: #FCFBF8;
    }

    .offer-card.selected {
      border-color: var(--ink-950);
      background: var(--bg-selected);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pole-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      letter-spacing: 0.01em;
    }

    .pole-ART_LOGISTICS {
      background: var(--art-100);
      color: var(--art-700);
      border: 1px solid var(--art-200);
    }

    .pole-SUPPLY_CHAIN {
      background: var(--supply-100);
      color: var(--supply-700);
      border: 1px solid var(--supply-200);
    }

    .pole-TECH_PROJECT_OPS {
      background: var(--ops-100);
      color: var(--ops-700);
      border: 1px solid var(--ops-200);
    }

    .zone-stamp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink-950);
    }

    .card-company {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-700);
    }

    .card-bottom-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px solid var(--bg-muted);
    }

    .meta-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mono-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      background: var(--bg-ground);
      color: var(--ink-700);
      border: 1px solid var(--rule-light);
    }

    .salary-pill-yes {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      background: var(--sal-100);
      color: var(--sal-700);
    }

    .salary-pill-no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-400);
    }

    .status-dot-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--ink-950);
      color: #FFFFFF;
    }

    /* ---------------- DETAIL READING PANE ---------------- */
    .detail-pane {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-md);
      position: sticky;
      top: 68px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding: 24px 26px;
    }

    .detail-header {
      border-bottom: 1px solid var(--rule-light);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .detail-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.24;
      color: var(--ink-950);
      margin-bottom: 6px;
    }

    .detail-company-line {
      font-size: 14.5px;
      color: var(--ink-700);
      font-weight: 500;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .primary-apply-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink-950);
      color: #FFFFFF;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13.5px;
      transition: background 0.14s ease;
    }
    .primary-apply-btn:hover {
      background: var(--art-700);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .spec-cell {
      background: var(--bg-ground);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .spec-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-bottom: 3px;
    }

    .spec-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-950);
    }

    .spec-val.sal-highlight {
      color: var(--sal-700);
    }

    .spec-val.sal-muted {
      color: var(--ink-500);
      font-weight: 500;
    }

    /* Pipeline action bar inside fiche */
    .pipeline-box {
      background: #FAF9F5;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .pipeline-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 8px;
    }

    .pipeline-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pipe-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .pipe-btn:hover { background: var(--bg-hover); }

    .pipe-btn.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
      font-weight: 600;
    }

    .pipe-btn.hide-btn.active {
      background: #8B2626;
      border-color: #8B2626;
      color: #FFFFFF;
    }

    .note-area {
      width: 100%;
      min-height: 58px;
      padding: 8px 10px;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-xs);
      background: var(--bg-sheet);
      font-size: 12.5px;
      resize: vertical;
      outline: none;
    }
    .note-area:focus { border-color: var(--ink-700); }

    .match-tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .match-tag {
      font-size: 11.5px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .section-subtitle {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-700);
      margin: 16px 0 8px;
    }

    .highlights-list {
      padding-left: 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--ink-700);
      font-size: 13.5px;
    }

    .desc-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-700);
      white-space: pre-line;
    }

    .empty-state {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 40px 24px;
      text-align: center;
      color: var(--ink-500);
    }

    /* ---------------- KANBAN SUIVI VIEW ---------------- */
    .kanban-wrap {
      display: none;
    }
    .kanban-wrap.active {
      display: block;
    }

    .kanban-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .kanban-col {
      background: var(--bg-muted);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 12px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13.5px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .k-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .k-card-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.3;
    }

    .k-note-preview {
      font-size: 12px;
      color: var(--ink-500);
      background: var(--bg-ground);
      padding: 5px 7px;
      border-radius: var(--radius-xs);
    }

    .mobile-close-bar {
      display: none;
    }

    /* ---------------- RESPONSIVE MOBILE DRAWER ---------------- */
    @media (max-width: 940px) {
      .catalog-grid {
        grid-template-columns: 1fr;
      }

      .detail-pane {
        display: none;
        position: fixed;
        inset: 0;
        top: 0;
        max-height: 100dvh;
        border-radius: 0;
        z-index: 90;
        padding: 16px 18px 36px;
      }

      .detail-pane.mobile-open {
        display: block;
      }

      .mobile-close-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--rule-strong);
      }

      .mobile-back-btn {
        border: 1px solid var(--rule-strong);
        background: var(--bg-ground);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }

      .kanban-board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">

 des dossiers, depuis l'étude du besoin et l'établissement du devis jusqu'à la livraison ou l'installation finale des oeuvres.\n----------------------------------------\nAvantages :\n* Mutuelle\n* Primes"}, {"id": "op-573b45a8584f", "source_id": "4487209443", "source_name": "LinkedIn Emplois", "title": "Coordinateur Logistique Art", "company": "Carpenters", "sector": "Œuvres d'Art, Régie & Patrimoine", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Mitry-Mory (77)", "city_raw": "Mitry-Mory", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-11-04", "posted_fr": "4 Novembre 2026", "verified_at_iso": "2026-11-04T11:38:56Z", "url": "https://www.linkedin.com/jobs/view/4487209443/", "highlights": ["Organise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.", "Coordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.", "Manage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.", "Liaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations."], "summary_excerpt": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operatio", "full_description": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operations & Registrar also plays a central role in art fair logistics and HNWI client installations and post-sales, ensuring a luxury-standard delivery experience at every touchpoint.\nDay-to-Day Responsibilities\n1. Packing, Shipping & Transport\nOrganise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.\nCoordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.\nManage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.\nLiaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations.\nMonitor and improve shipping lead times; target ≤ 3 weeks from payment and end of production to delivery.\nDevelop direct shipping routes from artist studios to clients/galleries where possible, reducing handling and transit time.\n2. Inventory, Condition Reporting & Data Management\nMaintain accurate shipping records, inventory logs, condition reports, and installation instructions across all CWG databases.\nComplete condition reports (Articheck) within 24 hours of receiving artworks and before any release.\nUpdate Sage X3 records in real time: stock receipts, intercompany transfers, deliveries, and invoicing.\nParticipate in bi-annual full inventories and monthly spot audits; contribute to maintaining stock discrepancy below 2%.\n3. Communication & Process Development\nAct as an operational link between the Logistics department, Production, Artist Studios, Sales, and Gallery teams to ensure fluid, structured communication.\nContribute to developing and documenting standard operating procedures for shipping, packing, installation, and condition reporting.\nParticipate in cross-departmental process improvement initiatives to streamline.\nActively contribute to the mise en place and optimisation of Logistics Department processes and organisation.\n4. Fairs, Exhibitions & HNWI Client Installations\nHandle end-to-end logistics for art fair participation: planning, transport, customs, booth set-up, artwork installation, and de-installation.\nCoordinate with the Fairs & Exhibitions team on retroactive calendars, steering meetings, and cross-departmental milestones.\nManage HNWI client installations with a luxury-standard approach: meticulous planning, white-glove handling, and post-installation follow-up.\nContribute to carbon footprint tracking per fair and material reuse objectives (target 70% reuse rate).\n5. Budget & Cost Control\nParticipate in tracking local logistics budgets and operational expenditure.\nVerify supplier invoices, compare quoted vs. actual vs. invoiced amounts, and flag discrepancies.\nIdentify cost reduction levers in crate production, transport, and storage operations.\nContribute to a monthly budget review meeting with the Global Head of Logistics, Fairs & Exhibitions.\n6. Client Satisfaction\nDrive improved satisfaction by streamlining communication with Production and increasing direct shipments from artist studios.\nContribute to the design and implementation of a client satisfaction tracking methodology in collaboration with Sales and Production.\nMaintain luxury-standard delivery experiences for all client-facing operations."}, {"id": "op-c60d862d6099", "source_id": "84647214", "source_name": "HelloWork", "title": "Chef d'Équipe Opérations - Œuvres d'Art H/F", "company": "MC Intérim (agence de Saint Avold)", "sector": "Services aux Entreprises", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Saint-Denis (93)", "city_raw": "Saint-Denis - 93", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "28 000 – 35 000 € brut/an", "has_salary": true, "salary_max_eur": 35000, "affinity_score": 98, "match_tags": ["Cœur parcours · Œuvres d'art & Régie"], "posted_iso": "2026-10-21", "posted_fr": "21 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:56Z", "url": "https://www.hellowork.com/fr-fr/emplois/84647214.html", "highlights": ["Encadrer et coordonner l'équipe de manutentionnaires et chauffeurs.", "Préparer les interventions : matériel, accès et répartition des tâches.", "Superviser l'emballage, le chargement et le transport des oeuvres.", "Assurer la manutention, l'installation et l'accrochage sur site."], "summary_excerpt": "Les missions du poste\nLe Groupe MC INTERIM recherche pour son client, un(e) Chef(fe) d'équipe qui assure la préparation, la coordination et le bon déroulement des opérations liées au transport, à la manutention et à l'installation d'oe urs aéroportuaires\n- Jouer un rôle de conseil auprès de la clientèle en matière d'optimisation pour l'acheminement de leurs produits\n- Traiter ", "full_description": "Les missions du poste\nMaMa recrute pour son client, société de transport, un Agent de transit AOG - F/H.\nEn horaires décalées, vous serez en charge de l'organisation et du suivi des opérations aériennes import / export, du suivi des opérations douane et d'une manière plus générale du traitement des AOG. Vos missions seront les suivantes :\n- Organisation des dépannages AOG dans les plus brefs délais. Optimisation des délais et des coûts\n- Interface entre les différents acteurs aéroportuaires\n- Jouer un rôle de conseil auprès de la clientèle en matière d'optimisation pour l'acheminement de leurs produits\n- Traiter complètement les dossiers d'exploitation, incluant la facturation, et organise les différentes opérations que nécessite le contrat de transport : dédouanement, enlèvement, livraison, stockage, emballage, etc. en choisissant les prestataires\nLe profil recherché\nVotre profil\n- Sérieux(se), motivé(e) et Dynamique\n- Expérience de minimum 3 ans dans les métiers de la logistique\n- bonne connaissance des opérations aériennes (import/export)\n- Anglais obligatoire\n- Esprit d'initiative, d'équipe et sens des responsabilités\n- Permis de conduire et véhicule recommandé\n- Formation minimum Bac +2 en transport ou commerce international\n>>> En plus de votre salaire, une prime de 600€ brut mensuelle est versée en contrepartie du travail effectif sur les horaires décalés.\nA propos de nous\nMATCHMAKER est un cabinet de recrutement qui veut donner du sens à son métier par un accompagnement personnalisé de ses candidats.\nNous travaillons sur tous secteurs d'activité sur l'ensemble du territoire national.\nAvec des valeurs fortes, nous nous présentons comme votre partenaire dédié et mettons notre expertise à votre disposition pour vous aider à trouver une nouvelle opportunité professionnelle !\n rvice\nOrganisation et gestion des priorités dans un environnement dynamique\nCe que nous offrons\nPoste basé à Roissy CDG (open space – pas de déplacements)\nCDI – Statut TAM\n37h/semaine\n1 jour de télétravail hebdomadaire\nRémunération : la fourchette salariale pour ce poste est comprise entre 34 000 € et 39 000 € bruts annuels, en fonction de l’expérience et des compétences.\nPourquoi nous rejoindre ?\nChez Yusen Logistics, vous aurez l’opportunité de contribuer à des projets porteurs de sens, de travailler aux côtés de professionnels talentueux et de développer votre carrière dans un environnement qui valorise l’innovation, la responsabilité et la collaboration.\nChez Yusen Logistics, nous comprenons l’intérêt d’utiliser l’IA et d’autres technologies pour accompagner le processus de candidature. Toutefois, nous encourageons les candidats à utiliser ces outils pour enrichir leur candidature, plutôt que pour remplacer leur propre effort et leur authenticité. Lors du processus d’entretien, nous attendons des réponses qui reflètent votre propre expérience, votre réflexion et vos compétences.\nYusen Logistics est un employeur garantissant l’égalité des chances. Nous accueillons les candidatures de toutes les personnes dûment qualifiées et fondons nos décisions de recrutement exclusivement sur les compétences, l’expérience et le potentiel. La diversité nous permet de créer un environnement inclusif où chacun peut s’épanouir et évoluer."}, {"id": "op-049e99fe6624", "source_id": "4479162425", "source_name": "LinkedIn Emplois", "title": "Coordinateur logistique", "company": "Sinetik", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Bruyères-le-Châtel (91)", "city_raw": "Bruyères-le-Châtel", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "e près de grands acteurs industriels et digitaux sur des environnements exigeants, avec une approche centrée sur la performance opérationnelle et l'humain.\nÀ taille humaine, SINETIK place l'expertise, la proximité et l'autonomie de ses collaborateurs au coeur de son modèle. Nous proposons des projets stimulants, des responsabilités réelles et de véritables perspectives d'évolution, dans un environnement fondé sur la confiance et l'excellence technique.\nDans le cadre du développement de l'un de nos projets industriels, SINETIK recrute un(e) Coordinateur(trice) Logistique H/F pour accompagner les opérations logistiques sur un chantier d'envergure.\nVous intervenez au coeur du projet afin de garantir la bonne organisation des flux, la coordination des approvisionnements et la disponibilité des équipements et matériels nécessaires au bon déroulement des travaux.\nRattaché(e) au responsable du projet, vous êtes notamment en charge de :\nOrganiser et coordonner les flux logistiques sur le chantier ;\nPlanifier les livraisons et gérer les réceptions de matériels et équipements ;\nAssurer le suivi des approvisionnements et anticiper les besoins du chantier ;\nCoordonner les différents intervenants : fournisseurs, transporteurs, équipes chantier et sous-traitants ;\nVeiller au respect des délais de livraison et des contraintes du planning travaux ;\nOrganiser le stockage et la mise à disposition des équipements sur site ;\nAssurer la traçabilité des mouvements de matériel et tenir à jour les outils de suivi ;\nIdentifier les éventuels dysfonctionnements ou retards et mettre en place les actions correctives nécessaires ;\nParticiper à l'amélioration continue de l'organisation logistique du chantier ;\nVeiller au respect des règles de sécurité et des procédures applicables sur site.\nDe formation Bac+2 à Bac+5 en logistique, supply chain, gestion des flux ou domaine industriel, vous disposez d'une première expérience en coordination logistique, idéalement acquise dans un environnement industriel ou sur chantier.\nVous êtes reconnu(e) pour votre :\nOrganisation et rigueur ;\nCapacité à anticiper et à gérer les priorités ;\nAisance relationnelle et capacité à coordonner différents interlocuteurs ;\nRéactivité face aux imprévus ;\nEsprit d'équipe et sens du service ;\nMaîtrise des outils bureautiques et des outils de suivi logistique.\nUne expérience dans un environnement industriel, travaux neufs, construction ou installation d'équipements sera particulièrement appréciée."}, {"id": "op-9f3da936225c", "source_id": "82621895", "source_name": "HelloWork", "title": "Agent de Transit Export Maritime H/F", "company": "Human Search", "sector": "Services aux Entreprises", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Tremblay-en-France (93)", "city_raw": "Tremblay-en-France - 93", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "35 000 – 40 000 € brut/an", "has_salary": true, "salary_max_eur": 40000, "affinity_score": 97, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-25", "posted_fr": "25 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:56Z", "url": "https://www.hellowork.com/fr-fr/emplois/82621895.html", "highlights": ["Rattaché(e) au Responsable d'équipe, vous serez notamment en charge de :", "Organiser et coordonner les opérations de transport maritime export.", "Conseiller les clients sur les solutions de transport international adaptées à leurs besoins.", "Constituer et suivre les dossiers d'expédition de A à Z."], "summary_excerpt": "Les missions du poste\nRattaché(e) au Responsable d'équipe, vous serez notamment en charge de :\nOrganiser et coordonner les opérations de transport maritime export îne logistique. Nos équipes y assurent la réception, le stockage et la préparation des commandes, garantissant une gestion efficace des stocks et une expédition rapide vers nos clients\n- Centres de tri (Amazon Transportation Services): Ces hubs logistiques sont au cœur de notre réseau de distribution. Nos équipes y orchestrent le tri et l'acheminement des colis entre les centres de distribution et les agences de livraison, optimisant les flux pour assurer rapidité et précision\n- Agences de livraison (Amazon Logistics): Ces sites représentent le dernier maillon de notre chaîne logistique, au plus près des clients. Nos équipes y coordonnent les livraisons du dernier kilomètre, travaillant en étroite collaboration avec nos partenaires pour offrir une expérience clients exceptionnelle\nLes postes à pourvoir suivent le rythme des équipes opérationnelles, et vous travaillez en horaires décalés.\n- Stage, alternance ou première expérience en environnement industriel/logistique\n- Expérience en gestion de projet ou en animation d'équipe\n- Maîtrise des outils bureautiques\nAmazon est un employeur engagé pour l'égalité des chances. Nous sommes convaincus qu'une main d'oeuvre diversifée est essentielle à notre réussite. Nous prenons nos décisions de recrutement en fonction de votre expérience et de vos compétences. Nous apprécions votre envie de découvrir, d'inventer, de simplifier et de construire. La protection de votre vie privée et la sécurité de vos données constituent depuis longtemps une priorité absolue pour Amazon. Veuillez consulter notre Politique de Confidentialité pour en savoir plus sur la façon dont nous collectons, utilisons et traitons les données personnelles de nos candidats.\nOur inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https  livraison annoncées.", "Effectuer les relances fournisseurs en français et en anglais afin d'obtenir les confirmations attendues, d'actualiser les échéances et d'identifier les éventuels retards ou points de blocage.", "Mettre à jour les outils de suivi achats : statuts des commandes, engagements fournisseurs et actions en cours."], "summary_excerpt": "Les missions du poste\nDans le cadre d'un projet dans le secteur des data centers, nous recherchons un(e) Assistant(e) achats / Acheteur(se) projets junior pour renforcer une équipe achats intervenant sur des projets techniques à forte valeur ajoutée.\nIntégré(e) à l'équipe achats, vous participerez aux achats de travaux, d'équipements industriels et de machines spéciales, dans un environnement de projets EPC (ingénierie, achats et construction).\nAccompagné(e) par des acheteurs expérimentés, vous interviendrez sur le suivi opérationnel des commandes et apporterez votre soutien aux acheteurs projets, de la consultat", "full_description": "Les missions du poste\nDans le cadre d'un projet dans le secteur des data centers, nous recherchons un(e) Assistant(e) achats / Acheteur(se) projets junior pour renforcer une équipe achats intervenant sur des projets techniques à forte valeur ajoutée.\nIntégré(e) à l'équipe achats, vous participerez aux achats de travaux, d'équipements industriels et de machines spéciales, dans un environnement de projets EPC (ingénierie, achats et construction).\nAccompagné(e) par des acheteurs expérimentés, vous interviendrez sur le suivi opérationnel des commandes et apporterez votre soutien aux acheteurs projets, de la consultation des fournisseurs jusqu'au suivi des livraisons.\nVos missions\nAssurer le suivi des commandes fournisseurs : récupérer les accusés de réception, vérifier les informations communiquées et suivre les dates de livraison annoncées.\nEffectuer les relances fournisseurs en français et en anglais afin d'obtenir les confirmations attendues, d'actualiser les échéances et d'identifier les éventuels retards ou points de blocage.\nMettre à jour les outils de suivi achats : statuts des commandes, engagements fournisseurs et actions en cours.\nParticiper au sourcing fournisseurs et aux consultations : identifier de nouveaux fournisseurs, préparer les demandes de prix et collecter les offres.\nContribuer à l'analyse des offres en comparant les prix, les délais et les conditions de livraison, et préparer les tableaux comparatifs nécessaires aux acheteurs.\nParticiper à la préparation et au suivi des dossiers achats : rassembler les informations nécessaires aux commandes, assurer la traçabilité des échanges et faciliter la coordination entre les fournisseurs, les acheteurs et les équipes projets.\nLe profil recherché\nVous disposez d'une première expérience en achats, approvisionnement ou gestion de commandes, acquise idéalement en entreprise ou en alternance.\nVous souhaitez développer vos compétences en achats projets tout en conservant une forte implication dans le suivi quotidien des fournisseurs et des commandes.\nOrganisé(e), rigoureux(se) et réactif(ve), vous savez gérer plusieurs dossiers en parallèle, effectuer des relances régulières et alerter les interlocuteurs concernés en cas de difficulté.\nCompétences attendues\nAnglais professionnel obligatoire, à l'oral comme à l'écrit, pour échanger avec les fournisseurs, comprendre leurs offres et effectuer les relances.\nBonne maîtrise d'Excel et des tableaux de suivi.\nRigueur dans le suivi des commandes, la vérification des informations et le respect des échéances.\nBon relationnel, esprit d'équipe et capacité à collaborer avec des interlocuteurs variés.\nUne première expérience dans l'industrie, la construction ou les achats d'équipements techniques constitue un atout.\nLa connaissance d'un ERP ou d'un outil de gestion des achats serait appréciée.\nBienvenue chez Astorm\nASTORM est une Société de Consulting, basée à Paris et à Brive-la-Gaillarde qui apporte son expertise à ses clients principalement dans les domaines suivants :\nBANQUE/ASSURANCE\nTELECOM\nAERONAUTIQUE/DEFENSE\nINDUSTRIE AUTOMOBILE\nENERGIE\nTout en étant une entreprise à taille humaine, ASTORM bénéficie d'un référencement en direct auprès de Grands Comptes.\nAstorm détient une filiale en Tunisie et une autre au Maroc afin d'y accompagner certains de ses clients.\nNous cherchons à recruter des ingénieurs de valeur afin de renforcer notre équipe de consultants.\nAstorm a comme politique d'impliquer chaque consultant dans le développement de l'entreprise en soutenant les initiatives par des primes d'intéressements.\nChez Astorm, vous ne serez pas seulement un consultant mais vous serez un acteur de la société.\nVous avez confiance en votre potentiel, vous cherchez de nouvelles opportunités pour faire avancer votre carrière, vous souhaitez être considéré pour ce que vous êtes et êtes motivé pour réussir. Vous êtes notre candidat !"}, {"id": "op-080beb9d4f61", "source_id": "4482722412", "source_name": "LinkedIn Emplois", "title": "Agent de Transit Aérien Import/Export (H/F)", "company": "Kuehne+Nagel", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 2, "exp_label": "2–3 ans d'exp.", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-22", "posted_fr": "22 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4482722412/", "highlights": ["Ouvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.", "Organiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éventuelles) et suivre le statut des marchandises jusqu’à la livraison.", "Établir, vérifier et transmettre l’ensemble de la documentation transport & douane (MAWB, HAWB, certificats, manifeste, compliance, instructions douanières).", "Coordonner les opérations avec les compagnies aériennes, agents overseas, manutentionnaires et transporteurs, pour garantir une fluidité des flux."], "summary_excerpt": "C'est plus qu'un métier\nChez Kuehne+Nagel, le transport c'est bien plus qu’acheminer de la marchandise. Chaque jour, grâce à votre expertise, des produits du quotidien mais également des produits à forte valeur ajoutée arrivent auprès de ceux qui en ont besoin : des pièces d’avion livrées en urgence à l’aéroport, des cellules souches expédiées dans un strict respect des mesures de sécurité, etc. Chez Kuehne+Nagel, chaque mission fait la différence. Et la vôtre encore plus que vous ne l’imaginez.\n‎\nPrêt(e) à faire décoller votre carrière au cœur du fret aérien international ? Chez Kuehne+Nagel, nous recherchons de", "full_description": "C'est plus qu'un métier\nChez Kuehne+Nagel, le transport c'est bien plus qu’acheminer de la marchandise. Chaque jour, grâce à votre expertise, des produits du quotidien mais également des produits à forte valeur ajoutée arrivent auprès de ceux qui en ont besoin : des pièces d’avion livrées en urgence à l’aéroport, des cellules souches expédiées dans un strict respect des mesures de sécurité, etc. Chez Kuehne+Nagel, chaque mission fait la différence. Et la vôtre encore plus que vous ne l’imaginez.\n‎\nPrêt(e) à faire décoller votre carrière au cœur du fret aérien international ? Chez Kuehne+Nagel, nous recherchons des Agents de Transit Aérien Général Cargo (Import/Export) H/F capables de piloter des dossiers de transport de bout en bout, d'orchestrer des flux sensibles, et d’offrir un service client irréprochable. Si vous aimez résoudre les imprévus, coordonner des acteurs du monde entier et garantir des opérations sans faille, rejoignez notre équipe à Tremblay-en-France ! Votre expertise fera toute la différence.\nComment avoir de l'impact\nOuvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.\nOrganiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éventuelles) et suivre le statut des marchandises jusqu’à la livraison.\nÉtablir, vérifier et transmettre l’ensemble de la documentation transport & douane (MAWB, HAWB, certificats, manifeste, compliance, instructions douanières).\nCoordonner les opérations avec les compagnies aériennes, agents overseas, manutentionnaires et transporteurs, pour garantir une fluidité des flux.\nPlanifier et superviser les enlèvements et livraisons, en s’assurant de la conformité des marchandises (DG, particularités cargo).\nGérer les imprévus et litiges (retards, avaries, manquants) en apportant des solutions rapides et en maintenant une communication proactive avec les clients.\nFournir un support client proactif et professionnel, en apportant conseils sur les solutions de transport, coûts, délais et contraintes réglementaires.\nGarantir la satisfaction client par un suivi rigoureux et une gestion transparente de chaque étape du dossier.\nAssurer la facturation, le contrôle des coûts et l’analyse de rentabilité par dossier, en étant capable d’expliquer écarts ou pertes si nécessaire.\nSuivre les indicateurs de performance (OTD, litiges, délais) et respecter les procédures internes qualité et sécurité.\nCe que nous recherchons chez vous\nMinimum Bac+2 en transport, logistique ou filière équivalente.\nMinimum 2 ans d’expérience en fret aérien exigés.\nExcellente connaissance des réglementations aériennes (IATA) et des règles douanières import/export.\nMaîtrise des documents de transport aérien (MAWB, HAWB, certificats, manifeste, etc.).\nSolides compétences en logistique internationale : Incoterms, freight, handling, spécificités cargo.\nEsprit d’équipe, excellent relationnel et sens du service client.\nProactivité, autonomie, adaptabilité et capacité à trouver des solutions alternatives.\nMaîtrise de l’anglais professionnel.\nCe que nous vous proposons\nRejoindre Kuehne+Nagel, c’est s’engager dans une entreprise labellisée Great Place to Work et être prêt(e) à relever les défis du futur. Au-delà de rejoindre une équipe agréable dans un contexte stimulant, nous vous proposons (selon les postes) une rémunération attractive, des primes sur objectifs, un dispositif d’intéressement et participation, des tickets restaurant, des formations tout au long de votre vie chez Kuehne+Nagel, ainsi que des possibilités d’évolution en France et à l’international.\nQui sommes-nous\nLa logistique façonne notre vie quotidienne – des biens que nous consommons, aux soins de santé dont nous avons besoin. Chez Kuehne+Nagel, votre quotidien va au-delà de la logistique ; il accompagne les petits comme les grands moments de tout un chacun à travers le monde.\nEn tant que leader mondial avec une structure solide et avec une vision tournée vers l'avenir, nous offrons un environnement sûr et stable où votre carrière peut avoir un véritable impact. Que nous aidions à livrer des médicaments vitaux, à développer des solutions de transport durables ou à soutenir des associations locales, votre carrière contribuera à bien plus que vous ne l’imaginez.\nNous remercions les cabinets de recrutement pour leur intérêt. Toutefois, nous vous invitons à ne pas soumettre de candidatures non sollicitées. Toute candidature transmise sans accord préalable signé ne pourra être prise en compte, et aucun frais ne sera engagé."}, {"id": "op-d4059d1d7490", "source_id": "4461734311", "source_name": "LinkedIn Emplois", "title": "Aviation Logistics and Materials Coordinator (Le Bourget)", "company": "Bombardier", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Le Bourget (93)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Tableaux de bord & Coûts"], "posted_iso": "2026-11-03", "posted_fr": "3 Novembre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4461734311/", "highlights": ["When applicable, Bombardier promotes flexible and hybrid work policies.", "What are your contributions to the team?", "Locate and initiate the purchase of materials, tools and components via communication with internal and external sources and suppliers.", "Expedite status of external and internal parts orders and purchase orders via communication with suppliers and inter-company operations."], "summary_excerpt": "When applicable, Bombardier promotes flexible and hybrid work policies.\nWhy join us?\nAt Bombardier, we design, build and maintain the world’s peak-performing aircraft for the world’s most discerning people and businesses, governments and militaries. We have been successful in setting the highest standards by putting our people at the heart of it all, and defining excellence, together.\nWorking at Bombardier means operating at the highest level. Every day, you are part of a team that delivers superior experiences and products, pushing the boundaries of what's possible in our industry and beyond. By prioritizing emp", "full_description": "When applicable, Bombardier promotes flexible and hybrid work policies.\nWhy join us?\nAt Bombardier, we design, build and maintain the world’s peak-performing aircraft for the world’s most discerning people and businesses, governments and militaries. We have been successful in setting the highest standards by putting our people at the heart of it all, and defining excellence, together.\nWorking at Bombardier means operating at the highest level. Every day, you are part of a team that delivers superior experiences and products, pushing the boundaries of what's possible in our industry and beyond. By prioritizing employee growth and development, we empower everyone to reach their full potential on their own terms, because the best work happens when you are free to be yourself and share your unique expertise.\nWhat are your contributions to the team?\nLocate and initiate the purchase of materials, tools and components via communication with internal and external sources and suppliers.\nExpedite status of external and internal parts orders and purchase orders via communication with suppliers and inter-company operations.\nInterface with Maintenance Control Center and other Maintenance departments on critical material problems.\nMaintain shortage report to track orders and communicate status to management.\nCreate and issue internal orders and other applicable documents to meet parts and materials requirements.\nProvide information to adjust discrepant orders/exception messages and cancel line items not received or returned to stock as needed.\nMaintain accurate inventory of transactions using computerized inventory and manual filing systems.\nDetermine priority items to ensure parts delivered on time and are readily accessible.\nIdentify alternate and superseded part numbers.\nHow to thrive in this role?\nYou have typically three (3) years of experience in aviation or in a material/parts environment or other demonstrated equivalent experience.\nYou have planning and organizational skills necessary to prioritize and coordinate workload within a multiple project setting.\nYou have interpersonal skills necessary to develop and maintain effective working relationships with sales team, owners, outside counsel, and other departments.\nKnowledge of SAP would be an asset.\nYou have basic knowledge of inventory planning.\nYou have basic knowledge of parts procurement.\nYou have basic knowledge of computers to input and retrieve data for Inventory Management.\nYou have basic knowledge of facility layout and building locations.\nYou have basic knowledge of Repair Station System inventory processes.\nYou have basic knowledge of aircraft parts and terminology.\nYou have basic knowledge of internal and external supplier programs.\nYou have computer skills necessary to learn and/or operate word processing, spreadsheet, database, presentation, email, and web-based applications.\nYou have skills to gather, interpret, and record data to assure inventory accuracy.\nYou have skills in communicating effectively over the telephone as well as in person to convey information.\nYou have skills in listening to internal and external customers and asking appropriate questions.\nYou have the ability to work independently as well as part of a team.\nYou have the ability to effectively estimate quantities needed to maintain stock in accordance with customer requirements.\nNow that you can see yourself in this role, apply and join the Bombardier Team!\nPlease note: You don’t need all the skills, knowledge, and experience listed to apply for this position. We’re not looking for the perfect candidate, we’re looking for great talent and passionate individuals.\nBombardier is an equal opportunity employer and encourages persons of any race, , ethnicity, gender identity, sexual orientation, age, immigration status, disability or other applicable legally protected characteristics to apply.\nJob Aviation Logistics and Materials Coordinator (Le Bourget)\nPrimary Location France\nOrganization BA France SAS\nShift\nEmployee Status Regular\nRequisition 15170 Aviation Logistics and Materials Coordinator (Le Bourget)"}, {"id": "op-7ff7c4d5a398", "source_id": "4479814546", "source_name": "LinkedIn Emplois", "title": "Passenger Car Supply Chain Logistics Specialist", "company": "BYD EUROPE", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Courbevoie (92)", "city_raw": "Courbevoie", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-15", "posted_fr": "15 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.linkedin.com/jobs/view/4479814546/", "highlights": ["Our Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.", "BYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicles, including all-electric cars, all-electric buses, and all-electric forklift trucks.", "Below Should Be Changed", "Skills, Qualifications, and Experience Required:"], "summary_excerpt": "About BYD\nOur Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.\nBYD is a leading, high-tech multinational, based in Shenzhen, China. Operates in four core fields of IT, automotive, new energy, and rail transit and employs over 300,000 people worldwide. As a global pioneer in New Energy Solutions BYD is dedicated to building a zero-emission ecosystem.\nBYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicl", "full_description": "About BYD\nOur Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.\nBYD is a leading, high-tech multinational, based in Shenzhen, China. Operates in four core fields of IT, automotive, new energy, and rail transit and employs over 300,000 people worldwide. As a global pioneer in New Energy Solutions BYD is dedicated to building a zero-emission ecosystem.\nBYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicles, including all-electric cars, all-electric buses, and all-electric forklift trucks.\nBelow Should Be Changed---------------------------------\nAbout BYD France\nBYD France is the French National Sales Company of BYD BV Europe and BYD Company Ltd, a China-based company and a leading global supplier of green energy technologies. BYD France offers a range of electric vehicles, including all-electric cars, buses & forklifts. BYD is expanding its operations in France to support a growing portfolio of New Electric Vehicle Passenger car and LCVs projects.\nKey Responsibilities:\n1/Coordinate outbound loading & shipment of passenger cars, closely track vessel schedules, ocean freight status and ETA updates for vehicle consignments. 2/Manage daily collaboration and performance evaluation for European local logistics vendors (ocean forwarder, port operator, yard agent, customs broker), push for service improvement and cost‑efficiency. 3/Full lifecycle monitoring of port arrival, customs declaration & clearance progress; proactively identify document risks, resolve clearance holds and avoid delivery delays. 4/Troubleshoot on‑site logistics incidents including cargo damage, port congestion, yard stock discrepancy, transshipment anomalies; drive cross‑party problem closure with vendors and internal stakeholders. 5/Maintain shipment & inventory data accuracy, produce regular logistics status reports, highlight risks and propose countermeasures to leadership. 6/Align with internal planning, sales and quality teams to match regional delivery KPIs, optimize logistics flow and continuously improve end‑to‑end vehicle delivery reliability.\nSkills, Qualifications, and Experience Required:\nBachelor’s degree in Logistics, Supply Chain, Business Administration, or a related field.\n1–3 years of experience in logistics, transportation, or supply chain operations.\nExperience in automotive logistics is a plus.\nProficiency in Microsoft Excel and logistics reporting tools.\nStrong organizational, communication, and problem-solving skills.\nAbility to work in a fast-paced international environment.\nFluent in French and English; Chinese is a plus."}, {"id": "op-dc4d6dcfe5ca", "source_id": "84179850", "source_name": "HelloWork", "title": "Agent de Transit Export H/F", "company": "Staff'U", "sector": "Agriculture • Pêche", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Tremblay-en-France (93)", "city_raw": "Tremblay-en-France - 93", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "32 000 – 36 000 € brut/an", "has_salary": true, "salary_max_eur": 36000, "affinity_score": 93, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux"], "posted_iso": "2026-10-07", "posted_fr": "7 Octobre 2026", "verified_at_iso": "2026-11-04T11:38:57Z", "url": "https://www.hellowork.com/fr-fr/emplois/84179850.html", "highlights": ["En tant qu'Agent de Transit Export, vous jouerez un rôle clé dans la gestion et le suivi des opérations d'exportation, depuis la prise en charge des dossiers jusqu'à leur acheminement final.", "Vos principales responsabilités seront :", "Organiser et coordonner les expéditions export dans le respect des délais et des procédures en vigueur.", "Préparer, vérifier et suivre les documents nécessaires aux opérations de transit export."], "summary_excerpt": "Les missions du poste\nEn tant qu'Agent de Transit Export, vous jouerez un rôle clé dans la gestion et le suivi des opérations d'exportation, depuis la prise en charge des dossiers jusqu'à leur acheminement final.\nVos principales responsabilités seront :\n- Organiser et coordonner les expéditions export dans le respect des délais et des procédures en vigueur.\n- Préparer, vérifier et suivre les documents nécessaires aux opérations de transit export.\n- Assurer la liaison avec les clients, les transporteurs, les compagnies maritimes/aériennes et les différents intervenants logistiques.\n- Contrôler la conformité des do", "full_description": "Les missions du poste\nEn tant qu'Agent de Transit Export, vous jouerez un rôle clé dans la gestion et le suivi des opérations d'exportation, depuis la prise en charge des dossiers jusqu'à leur acheminement final.\nVos principales responsabilités seront :\n- Organiser et coordonner les expéditions export dans le respect des délais et des procédures en vigueur.\n- Préparer, vérifier et suivre les documents nécessaires aux opérations de transit export.\n- Assurer la liaison avec les clients, les transporteurs, les compagnies maritimes/aériennes et les différents intervenants logistiques.\n- Contrôler la conformité des dossiers export et anticiper les éventuels blocages opérationnels ou administratifs.\n- Suivre l'avancement des expéditions et communiquer les informations utiles aux parties prenantes.\n- Gérer les priorités quotidiennes avec rigueur afin de garantir un service fiable et réactif.\nLe profil recherché\nVous
