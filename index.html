<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Sélection vérifiée d'opportunités CDI, CDD et Graduate Programs à Paris, en Seine-Saint-Denis (93), en Île-de-France et en télétravail complet : Logistique d'œuvres d'art, Supply Chain et Opérations/Projets." />
  <title>ATELIER // FLUX — Opportunités Logistique d'Art, Supply Chain &amp; Projets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-ground: #F6F5F0;
      --bg-sheet: #FFFFFF;
      --bg-muted: #ECEAE2;
      --bg-hover: #F2F0E8;
      --bg-selected: #FBF4F0;

      --ink-950: #151513;
      --ink-700: #3D3C38;
      --ink-500: #66645E;
      --ink-400: #8C8981;

      --rule-light: #E4E1D8;
      --rule-strong: #C9C5B9;

      /* Pole 1: Fine Art & Exhibition Regie (Terracotta Crate Stencil) */
      --art-700: #AD3E1D;
      --art-600: #C24924;
      --art-100: #FCEEE9;
      --art-200: #F3D1C6;

      /* Pole 2: Supply Chain, Transit & Procurement (Maritime Petrol) */
      --supply-700: #184A66;
      --supply-100: #E9F2F7;
      --supply-200: #C6DDEA;

      /* Pole 3: Tech & Project Operations (Mineral Sage) */
      --ops-700: #245740;
      --ops-100: #EAF4EF;
      --ops-200: #C4DFD1;

      /* Salary & Status Accents */
      --sal-700: #1D5B3E;
      --sal-100: #E7F5EE;
      --warn-700: #8A5311;
      --warn-100: #FDF3E3;

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-ground);
      color: var(--ink-950);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle archival paper texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    a { color: inherit; }

    /* ---------------- MASTHEAD ---------------- */
    .masthead {
      background: var(--bg-sheet);
      border-bottom: 1px solid var(--rule-strong);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .masthead-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.03em;
      color: var(--ink-950);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark .slash {
      color: var(--art-600);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-500);
      padding-left: 12px;
      border-left: 1px solid var(--rule-strong);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-tabs {
      display: inline-flex;
      background: var(--bg-ground);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .view-tab {
      border: none;
      background: transparent;
      padding: 6px 13px;
      border-radius: var(--radius-xs);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-700);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .view-tab.active {
      background: var(--ink-950);
      color: #FFFFFF;
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(255,255,255,0.18);
    }
    .view-tab:not(.active) .tab-count {
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .utility-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .utility-btn:hover {
      background: var(--bg-hover);
      border-color: var(--ink-700);
    }

    /* ---------------- FILTER & SPOTLIGHT BAR ---------------- */
    .control-deck {
      background: var(--bg-ground);
      border-bottom: 1px solid var(--rule-light);
    }

    .control-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .top-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1 1 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 34px 9px 13px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--ink-950);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--ink-950);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--ink-500);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      display: none;
    }

    .spotlight-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .spot-pill {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.14s ease;
    }

    .spot-pill:hover {
      background: var(--bg-hover);
    }

    .spot-pill.art-spot.active {
      background: var(--art-700);
      border-color: var(--art-700);
      color: #FFFFFF;
    }

    .spot-pill.sal-spot.active {
      background: var(--sal-700);
      border-color: var(--sal-700);
      color: #FFFFFF;
    }

    .spot-pill.grad-spot.active {
      background: var(--supply-700);
      border-color: var(--supply-700);
      color: #FFFFFF;
    }

    .sort-select {
      padding: 7px 11px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      outline: none;
    }

    .filter-strips {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .group-caption {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-right: 4px;
    }

    .filter-chip {
      border: 1px solid var(--rule-light);
      background: var(--bg-sheet);
      color: var(--ink-700);
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .filter-chip:hover {
      border-color: var(--rule-strong);
      background: var(--bg-hover);
    }

    .filter-chip.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
    }

    .filter-chip .c-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      opacity: 0.78;
    }

    .reset-link {
      border: none;
      background: transparent;
      color: var(--art-700);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    /* ---------------- WORKSPACE SPLIT PANE ---------------- */
    .workspace {
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: minmax(370px, 47%) 1fr;
      gap: 18px;
      align-items: start;
    }

    .results-Summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 10px;
      font-size: 12px;
      color: var(--ink-500);
      font-family: var(--font-mono);
    }

    .offer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .offer-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease, background-color 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .offer-card:hover {
      border-color: var(--rule-strong);
      background: #FCFBF8;
    }

    .offer-card.selected {
      border-color: var(--ink-950);
      background: var(--bg-selected);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pole-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      letter-spacing: 0.01em;
    }

    .pole-ART_LOGISTICS {
      background: var(--art-100);
      color: var(--art-700);
      border: 1px solid var(--art-200);
    }

    .pole-SUPPLY_CHAIN {
      background: var(--supply-100);
      color: var(--supply-700);
      border: 1px solid var(--supply-200);
    }

    .pole-TECH_PROJECT_OPS {
      background: var(--ops-100);
      color: var(--ops-700);
      border: 1px solid var(--ops-200);
    }

    .zone-stamp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
    }

    .card-brand-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .company-logo-box {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 8px;
      background: #FFFFFF;
      border: 1px solid var(--rule-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
      box-shadow: 0 1px 2px rgba(21, 21, 19, 0.04);
    }

    .company-logo-box.logo-lg {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 10px;
      padding: 5px;
    }

    .company-logo-box.logo-sm {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      padding: 3px;
    }

    .company-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .company-monogram {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.02em;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-lg .company-monogram { font-size: 17px; }
    .logo-sm .company-monogram { font-size: 10.5px; }

    .mono-ART_LOGISTICS { background: var(--art-100); color: var(--art-700); }
    .mono-SUPPLY_CHAIN { background: var(--supply-100); color: var(--supply-700); }
    .mono-TECH_PROJECT_OPS { background: var(--ops-100); color: var(--ops-700); }

    .card-brand-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink-950);
    }

    .card-company {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-700);
    }

    .card-bottom-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px solid var(--bg-muted);
    }

    .meta-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mono-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      background: var(--bg-ground);
      color: var(--ink-700);
      border: 1px solid var(--rule-light);
    }

    .salary-pill-yes {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      background: var(--sal-100);
      color: var(--sal-700);
    }

    .salary-pill-no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-400);
    }

    .status-dot-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--ink-950);
      color: #FFFFFF;
    }

    /* ---------------- DETAIL READING PANE ---------------- */
    .detail-pane {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-md);
      position: sticky;
      top: 68px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding: 24px 26px;
    }

    .detail-header {
      border-bottom: 1px solid var(--rule-light);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .detail-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.24;
      color: var(--ink-950);
      margin-bottom: 6px;
    }

    .detail-company-line {
      font-size: 14.5px;
      color: var(--ink-700);
      font-weight: 500;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .primary-apply-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink-950);
      color: #FFFFFF;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13.5px;
      transition: background 0.14s ease;
    }
    .primary-apply-btn:hover {
      background: var(--art-700);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .spec-cell {
      background: var(--bg-ground);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .spec-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-bottom: 3px;
    }

    .spec-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-950);
    }

    .spec-val.sal-highlight {
      color: var(--sal-700);
    }

    .spec-val.sal-muted {
      color: var(--ink-500);
      font-weight: 500;
    }

    /* Pipeline action bar inside fiche */
    .pipeline-box {
      background: #FAF9F5;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .pipeline-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 8px;
    }

    .pipeline-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pipe-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .pipe-btn:hover { background: var(--bg-hover); }

    .pipe-btn.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
      font-weight: 600;
    }

    .pipe-btn.hide-btn.active {
      background: #8B2626;
      border-color: #8B2626;
      color: #FFFFFF;
    }

    .note-area {
      width: 100%;
      min-height: 58px;
      padding: 8px 10px;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-xs);
      background: var(--bg-sheet);
      font-size: 12.5px;
      resize: vertical;
      outline: none;
    }
    .note-area:focus { border-color: var(--ink-700); }

    .match-tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .match-tag {
      font-size: 11.5px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .section-subtitle {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-700);
      margin: 16px 0 8px;
    }

    .highlights-list {
      padding-left: 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--ink-700);
      font-size: 13.5px;
    }

    .desc-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-700);
      white-space: pre-line;
    }

    .empty-state {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 40px 24px;
      text-align: center;
      color: var(--ink-500);
    }

    /* ---------------- KANBAN SUIVI VIEW ---------------- */
    .kanban-wrap {
      display: none;
    }
    .kanban-wrap.active {
      display: block;
    }

    .kanban-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .kanban-col {
      background: var(--bg-muted);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 12px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13.5px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .k-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 11px 12px;

nator - French & English bilingual", "company": "Convelio", "logo_url": "", "sector": "Logistique & Transport d'Œuvres d'Art (ArtTech)", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Tableaux de bord & Coûts"], "posted_iso": "2025-07-29", "posted_fr": "29 Juillet 2025", "verified_at_iso": "2026-11-11T05:50:18Z", "url": "https://jobs.lever.co/convelio/7375dd4f-0c49-40b2-8d62-a153e4240280", "highlights": ["Our mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.", "We currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.", "You'll be managing the shipment end to end -- from customer interation, quoting, booking the shipment until final delivery, overseeing the whole project from start to finish for the clients in your portfolio.", "Manage incoming customers requests, including quotes & use of our pricing algorithm."], "summary_excerpt": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe curren", "full_description": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.\n🎩 Your Role:\nWe are looking for a high-energy, results-driven, team-oriented Fine Art Shipping coordinator to join our rapidly-growing team Operations team to help us extend our success and keep our clients happy! You will be the key point of contact for both our customers and our transport partners.\nYou'll be managing the shipment end to end -- from customer interation, quoting, booking the shipment until final delivery, overseeing the whole project from start to finish for the clients in your portfolio.\n✏️ What you'll do:\n- Manage incoming customers requests, including quotes & use of our pricing algorithm.\n- Follow the customers shipments and proactively update them on latest evolutions.\n- Develop your own customers relationships and guarantee Convelio's reactivity and level of service.\n- Communicate with the 3PL to fix thousands of different issues every day, from booking white glove handlers to airlines.\n- Suggest improvements in operational processes within the Operations team.\n- Contribute to improvements hand in hand with the tech team on our current and future (very!) sexy platforms and products.\n🧑‍🎨 Your profile:\n- You have a first experience in Freight Forwarding and a desire to develop your customer care skills.\n- You are positive, curious, self-motivated and hands-on\n- You are an excellent learner and have the desire to adapt to new concepts and technologies\n- You are comfortable working with numbers (you’ll need to handle quotes for our customers!)\n- You are detail-oriented, you have strong organizational skills and are disciplined in daily activity planning (ability to manage tightly, over time, a large quantity of information)\n- You enjoy working in a challenging, fast-paced, target-driven and team-oriented environment\n- You are fluent in French and English, you have excellent written and verbal communication skills.\n🌍 What we offer:\n- An opportunity to be part of a fast-growing and innovative company that is transforming the art logistics industry.\n- Work from our new office in Le Bourget in the same building as our warehouse, to be close to our operations.\n- Flexible remote policy (up to 3 days per week) to accommodate a healthy work-life balance.\n- A challenging and fulfilling role with a high level of autonomy and responsibility in managing operations for art shipments.\n- Develop a strong bedrock of logistics and art market knowledge to leverage in your new role through Convelio’s onboarding program.\n- A supportive and dynamic work environment, where your ideas and initiatives are valued.\n- Continuous learning and development opportunities to enhance your professional growth in the art logistics domain.\n⚙️ The hiring process:\n- First phone and video call with a Talent Acquisition team member\n- Video interview with a Team Lead\n- Case study and debrief with our Head of Operations\n- Final team fit interview\n---------------------\nLearn more...\n---------------------\nEqual Employment Opportunity employer\nConvelio is pro ed for customs declaration\n- Ensure compliance with customs regulations\n- Provide accurate and timely data entry into our operating system\n- Gather all of the documentation to apply for customs procedures or formalities\n- Process these requests either directly or through agents : request export or import customs declaration, launch applications for customs formalities, etc.\n- Make sure that our customs processes are conducted in a timely manner, and well-documented\n- Keep our operations teams and our clients informed on the status of all of these processes\n🧑‍🎨 Your profile:\nAt Convelio, we value diversity and believe in giving opportunities to talented individuals from a variety of backgrounds. We do not want to limit the potential of exceptional candidates by imposing a long list of requirements. However, to succeed in this role, you should possess the following attributes:\n- You are fluent in French and English\n- You have formal training and a first experience as a customs declarant\n- General knowledge of customs regulations, procedures, and document requirements for international transport (familiarity with art specificities desired, but not mandatory)\n- You have a strong interest in operations\n- You have great attention to detail, and good organizational skills\n- You are enthusiastic, ambitious, self-motivated, and hands-on\n- You enjoy working in a challenging fast-paced, target-driven, and team-oriented environment\n- You are comfortable learning and adapting to new concepts and new tools\n- You have excellent written and oral communication skills, and aim to simplify complex customs problems into accessible information\n🌍 What we offer:\n- An opportunity to be part of a fast-growing and innovative company that is transforming the art logistics industry.\n- A challenging and fulfilling role with a high level of autonomy and responsibility in managing customs operations for art shipments.\n- A supportive and dynamic work environment, where your ideas and initiatives are valued.\n- Flexible teleworking policy (up to 3 days per week) to accommodate a healthy work-life balance.\n- Continuous learning and development opportunities to enhance your professional growth in the art logistics domain.\n---------------------\nLearn more...\n---------------------\nEqual Employment Opportunity employer\nConvelio is proud to be an Equal Employment Opportunity employer. We are committed to equal opportunities based upon race, , colour, national origin, gender (including pregnancy, childbirth, or related medical conditions), sexual orientation, gender identify, gender expression, age, status as a protected veteran, status as an individual with a disability, or other applicable legally protected characteristics. We carefully hire the best talent we can find, which means actively seeking diversity of beliefs, backgrounds, education, and ways of thinking. We are passionate about building an inclusive culture where diversity is celebrated and leveraged to create better design and business decisions."}, {"id": "op-1a8b94bb8531", "source_id": "4489435594", "source_name": "LinkedIn Emplois", "title": "Coordinateur technique des expositions (H/F)", "company": "Fondation Cartier pour l'art contemporain", "logo_url": "", "sector": "Œuvres d'Art, Régie & Patrimoine", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Devis & Prestataires", "Tableaux de bord & Coûts"], "posted_iso": "2026-11-10", "posted_fr": "10 Novembre 2026", "verified_at_iso": "2026-11-11T05:51:43Z", "url": "https://www.linkedin.com/jobs/view/4489435594/", "highlights": ["Coordinateur technique des expositions (H/F) en CDI", "Il/elle veille au bon état de fonctionnement des salles d’exposition et est responsable du parc de matériel technique.", "COMMENT ALLEZ-VOUS AVOIR UN IMPACT ?", "Préparation technique de l’exposition"], "summary_excerpt": "Coordinateur technique des expositions (H/F) en CDI\nMécénée par la Maison Cartier et institution pionnière du mécénat privé, la Fondation Cartier pour l’art contemporain fut créée en 1984 avec l’ambition d’offrir un cadre d’inspiration et d’expression aux artistes du monde entier. Depuis 40 ans, elle favorise des dialogues et des formes d’expression artistique inédites, à travers une programmation tout aussi singulière qu’audacieuse. De la photographie au design, de la peinture au spectacle vivant, de la mode à l’architecture, des sciences au cinéma, la Fondation Cartier questionne le monde en décloisonnant les d", "full_description": "Coordinateur technique des expositions (H/F) en CDI\nMécénée par la Maison Cartier et institution pionnière du mécénat privé, la Fondation Cartier pour l’art contemporain fut créée en 1984 avec l’ambition d’offrir un cadre d’inspiration et d’expression aux artistes du monde entier. Depuis 40 ans, elle favorise des dialogues et des formes d’expression artistique inédites, à travers une programmation tout aussi singulière qu’audacieuse. De la photographie au design, de la peinture au spectacle vivant, de la mode à l’architecture, des sciences au cinéma, la Fondation Cartier questionne le monde en décloisonnant les disciplines, en bousculant les points de vue et en initiant des rencontres fécondes. Installée depuis octobre 2025 au 2, place du Palais-Royal, la Fondation Cartier déploie ses activités et ses engagements avec la volonté et l’ambition de rendre accessible la création contemporaine au plus grand nombre. À travers des projets d’expositions et une programmation de rencontres et débats, performances, conférences, elle crée des passerelles entre les lieux de création et nourrit un véritable espace de dialogue multiculturel.\nCE QUE NOUS OFFRONS\nChez Cartier, vous intégrerez une communauté unie par un sens fort des responsabilités, où florissent connexion, collaboration et esprit collectif. Nous valorisons l’individualité de nos talents, animés par un engagement commun envers l'excellence, inspirés par la diversité des cultures du monde, et attachés à respecter et enrichir notre héritage unique. Nous sommes convaincus que des perspectives variées nourrissent l'innovation et nous encouragent à créer des expériences exceptionnelles. Nous vous offrons un environnement stimulant et l’opportunité de contribuer, par votre vision personnelle, à un héritage de créativité. Nous célébrons toutes les réussites, quelles qu’elles soient, favorisant ainsi des liens significatifs fondés sur la gratitude et le soutien mutuel et cultivant un fort sentiment d'appartenance. Rejoignez-nous chez Cartier, un lieu unique et en constante évolution.\nSous la responsabilité du Directeur adjoint de la Production et de la Régie, le Coordinateur technique des expositions (H/F) planifie et suit toutes les étapes de mise en place de l’exposition dans ses aspects techniques. La dimension écoresponsable des propositions techniques est considérée de manière privilégiée au regard du projet d’établissement.\nIl/elle veille au bon état de fonctionnement des salles d’exposition et est responsable du parc de matériel technique.\nCOMMENT ALLEZ-VOUS AVOIR UN IMPACT ?\nPréparation technique de l’exposition\nEvaluation de la faisabilité technique et financière de l’exposition\nAccueil et accompagnement technique des artistes en phase de préparation\nDéfinition des besoins en matériel et en prestations au regard des spécificités, des budgets et des plannings du projet (exposition, production d’œuvres nouvelles, etc.)\nPréparation des consultations adéquates en collaboration avec les services administratifs : rédaction des cahiers des charges, demandes de devis aux fournisseurs afin de construire le budget des opérations dont il/elle a la charge, en coordination avec les Chargés de production et les Régisseurs d’œuvres ; analyse des offres et sélection des prestataires, engagement et suivi administratif des dépenses dans une logique d’optimisation budgétaire\nInterlocuteur privilégié des équipes et/ou des entreprises de production d’œuvres nouvelles, d’aménagement, de peinture, d’électricité, d’audiovisuel, de lumière. Le Coordinateur technique des expositions (H/F) accompagne aussi les Régisseurs d’œuvres dans l’analyse des besoins techniques liés aux œuvres et à leur installation, dans la rédaction des consultations d’accrochage et dans l’analyse des offres associées\nPlanification des étapes de montage de l’exposition et de présence des équipes techniques\nPréparation et mise à jour des plans et documents techniques (plans détaillés, notices techniques...)\nMontage\nPréparation du chantier d’aménagement et production et pilotage du chantier de montage en veillant au respect du planning et du budget\nCoordination des entreprises et équipes sur site\nSupervision de la fabrication des éléments de scénographie et de la construction des œuvres (le cas échéant auprès des entreprises missionnées)\nGestion commune de l'accrochage des œuvres, en étroit dialogue avec les Régisseurs des œuvres\nContrôle de la conformité des réalisations techniques, participation à la rédaction des bilans de l’exposition\nMaintenance technique des expositions\nPlanification et supervision des opérations de maintenance technique de l’exposition\nCoordination de ces opérations avec la Régie des œuvres et avec les entreprises en charge des maintenances d’exploitation du bâtiment\nSureté, sécurité et accessibilité\nEvaluation de la faisabilité sécurité de l’exposition en lien avec les référents sécurité\nPréparation et rédaction des documents obligatoires en matière de sécurité et de sûreté concernant le montage de l’exposition en lien avec le Directeur de la sécurité et de la sureté (plan de prévention, permis de feu, document unique d’évaluation des risques, dépôt préfecture etc.)\nMise en œuvre des obligations de sécurité\nMatériel\nPlanification et gestion des besoins en matériel dans l’atelier\nOrganisation du stockage, du rangement, de l’entretien du matériel, des équipements et des machines\nVeille sur le matériel et les normes applicables aux activités de la Régie d’exposition, ainsi que sur les fournitures et les techniques de réalisation écoresponsables\nCE QUE NOUS RECHERCHONS\nExpérience en régie d’exposition de 4 ans minimum\nCapacité d’organisation, de coordination des équipes et prestataires, en faisant preuve d’initiative et d’adaptation ;\nSolides compétences techniques : construction (menuiserie, métal, peinture), électricité, audiovisuel, éclairage, multimédia, accrochage-levage\nMaîtrise des logiciels bureautique (Pack Office) et logiciels de conception (Suite Adobe)\nMaîtrise des règles de sécurité d’un ERP\nConnaissances des règles de conservation préventive et de manipulation des œuvres\nHabilitations électriques et CACES souhaités\nMaîtrise de l’anglais\nDynamique et rigoureux/se, autonome, créatif/ve, curieux/se, sociable et aimant travailler en équipe\nIntérêt et goût pour l’art contemporain\nPostulez dès maintenant via ce lien : Coordinateur technique des expositions (H/F) - CDI\nLa date limite de candidature est fixée au 30/11/2026\nVOTRE EXPERIENCE AVEC NOUS\nAu fur et à mesure de votre avancée dans notre processus de recrutement, vous rencontrerez, le/la Responsable du poste, la Directrice du service et un membre de notre équipe RH et passerez des cas d’étude ou d’évaluation en fonction des besoins du poste."}, {"id": "op-9e857933c9c1", "source_id": "501546", "source_name": "ProfilCulture (Art & Patrimoine)", "title": "Coordinateur.rice technique des expositions", "company": "Fondation C ment\nSureté, sécurité et accessibilité\n• Evaluation de la faisabilité sécurité de l’exposition en lien avec les référents sécurité\n• Préparation et rédaction des documents obligatoires en matière de sécurité et de sûreté concernant le montage de l’exposition en lien avec le Directeur de la sécurité et de la sureté (plan de prévention, permis de feu, document unique d’évaluation des risques, dépôt préfecture etc.)\n• Mise en œuvre des obligations de sécurité\nMatériel\n• Planification et gestion des besoins en matériel dans l’atelier\n• Organisation du stockage, du rangement, de l’entretien du matériel, des équipements et des machines\n• Veille sur le matériel et les normes applicables aux activités de la Régie d’exposition, ainsi que sur les fournitures et les techniques de réalisation écoresponsables\nDescription du profil recherché\nCE QUE NOUS RECHERCHONS\nExpérience en régie d’exposition de 4 ans minimum\nCapacité d’organisation, de coordination des équipes et prestataires, en faisant preuve d’initiative et d’adaptation ;\nSolides compétences techniques : construction (menuiserie, métal, peinture), électricité, audiovisuel, éclairage, multimédia, accrochage-levage\nMaîtrise des logiciels bureautique (Pack Office) et logiciels de conception (Suite Adobe)\nMaîtrise des règles de sécurité d’un ERP\nConnaissances des règles de conservation préventive et de manipulation des œuvres\nHabilitations électriques et CACES souhaités\nMaîtrise de l’anglais\nDynamique et rigoureux/se, autonome, créatif/ve, curieux/se, sociable et aimant travailler en équipe\nIntérêt et goût pour l’art contemporain\nRémunération\nAnnuelle - Brute - 45 000,00 € - 50 000,00 € - Tickets restaurant d'une valeur faciale de 12,10€ +Prise en charge à hauteur de 75% du Pass Navigo + Participation et intéressement\nDate limite de candidature\n30/11/2026\nPostulez simplement depuis votre espace candidat\nÀ propos de votre candidature\nPostuler dès maintenant\nRetour aux offres\nAnnonce sauvegardée\nS nPiloter les différentes étapes : emballage, transport (aérien, maritime, routier), déballage, mise en place, installation et accrochage,\nAssurer un suivi fluide du projet et être l'interlocuteur privilégié du client tout au long du processus.\nCoordination interne et externe :\nCollaborer étroitement avec les équipes opérationnelles, les emballeurs, installateurs et le chargé de projet du cabinet d’architecte,\nGarantir une communication claire et continue entre les parties prenantes : clients, partenaires, prestataires, équipes internes,\nGérer les aspects administratifs du projet : devis, bons de transport, assurances, formalités douanières si nécessaire.\nSuivi qualité et satisfaction client :\nContrôler la qualité des prestations et la conformité des installations réalisées,\nGérer les imprévus, risques et litiges avec réactivité, professionnalisme et diplomatie,\nRéaliser un bilan de fin de projet : retour d’expérience, axes d’amélioration, évaluation de la satisfaction client.\nGestion de la facturation :\nRéception et traitement des factures fournisseurs : vérification de la conformité, validation avec les équipes concernées, transmission aux services comptables,\nEmission des factures clients : collecte des éléments nécessaires (devis, bons d’intervention, heures, prestations réalisées), préparation et envoi des factures selon les délais établis,\nSuivi et relances : assurer le suivi des paiements, relancer les clients en cas d’impayés ou de retard, maintenir un reporting clair et a jour,\nCoordination interne : travailler avec la comptabilité et les opérations pour garantir la cohérence entre prestations réalisées et éléments facturés.\nProfil recherché\nFormation & Expérience\nBac+3 à Bac+5 en gestion de projet, logistique, arts appliqués ou architecture d’intérieur,\nExpérience significative en coordination de projets, idéalement dans le secteur culturel, muséal, du transport spécialisé ou de l'aménagement haut de gamme.\nCompétences :\nMaitrise des outils de gestion de projet et de planification,\nConnaissance du transport et de la manipulation d’œuvres d’art (normes, emballage, sécurité),\nSensibilité à l’univers de la décoration, du design et du patrimoine artistique,\nMaitrise des processus de facturation et aisance avec les outils administratifs et logiciels internes,\nOrganisation, rigueur et sens du détail,\nEsprit de service, autonomie et capacité à évoluer dans un environnement exigeant,\nExcellente communication et aisance relationnelle.\nTous nos postes sont ouverts aux personnes en situation de handicap."}, {"id": "op-573b45a8584f", "source_id": "4487209443", "source_name": "LinkedIn Emplois", "title": "Coordinateur Logistique Art", "company": "Carpenters", "logo_url": "", "sector": "Œuvres d'Art, Régie & Patrimoine", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Mitry-Mory (77)", "city_raw": "Mitry-Mory", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-11-04", "posted_fr": "4 Novembre 2026", "verified_at_iso": "2026-11-11T05:51:42Z", "url": "https://www.linkedin.com/jobs/view/4487209443/", "highlights": ["Organise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.", "Coordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.", "Manage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.", "Liaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations."], "summary_excerpt": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operatio", "full_description": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operations & Registrar also plays a central role in art fair logistics and HNWI client installations and post-sales, ensuring a luxury-standard delivery experience at every touchpoint.\nDay-to-Day Responsibilities\n1. Packing, Shipping & Transport\nOrganise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.\nCoordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.\nManage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.\nLiaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations.\nMonitor and improve shipping lead times; target ≤ 3 weeks from payment and end of production to delivery.\nDevelop direct shipping routes from artist studios to clients/galleries where possible, reducing handling and transit time.\n2. Inventory, Condition Reporting & Data Management\nMaintain accurate shipping records, inventory logs, condition reports, and installation instructions across all CWG databases.\nComplete condition reports (Articheck) within 24 hours of receiving artworks and before any release.\nUpdate Sage X3 records in real time: stock receipts, intercompany transfers, deliveries, and invoicing.\nParticipate in bi-annual full inventories and monthly spot audits; contribute to maintaining stock discrepancy below 2%.\n3. Communication & Process Development\nAct as an operational link between the Logistics department, Production, Artist Studios, Sales, and Gallery teams to ensure fluid, structured communication.\nContribute to developing and documenting standard operating procedures for shipping, packing, installation, and condition reporting.\nParticipate in cross-departmental process improvement initiatives to streamline.\nActively contribute to the mise en place and optimisation of Logistics Department processes and organisation.\n4. Fairs, Exhibitions & HNWI Client Installations\nHandle end-to-end logistics for art fair participation: planning, transport, customs, booth set-up, artwork installation, and de-installation.\nCoordinate with the Fairs & Exhibitions team on retroactive calendars, steering meetings, and cross-departmental milestones.\nManage HNWI client installations with a luxury-standard approach: meticulous planning, white-glove handling, and post-installation follow-up.\nContribute to carbon footprint tracking per fair and material reuse objectives (target 70% reuse rate).\n5. Budget & Cost Control\nParticipate in tracking local logistics budgets and operational expenditure.\nVerify supplier invoices, compare quoted vs. actual vs. invoiced amounts, and flag discrepancies.\nIdentify cost reduction levers in crate production, transport, and storage operations.\nContribute to a monthly budget review meeting with the Global Head of Logistics, Fairs & Exhibitions.\n6. Client Satisfaction\nDrive improved satisfaction by streamlining communication with Production and increasing direct shipments from artist studios.\nContribute to the design and implementation of a client satisfaction tracking methodology in collaboration with Sales and Production.\nMaintain luxury-standard delivery experiences for all client-facing operations."}, {"id": "op-b511baabbab5", "source_id": "498913", "source_name": "ProfilCulture (Art & Patrimoine)", "title": "Coordinateur·rice des actions culturelles et artistiques", "company": "La Constellation", "logo_url": "", "sector": "Galeries, Musées & Patrimoine Culturel", "contract_type": "CDD", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Grigny (91)", "city_raw": "Grigny (91)", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 92, "match_tags": ["Cœur parcours · Œuvres d'art & Régie"], "posted_iso": "2026-11-11", "posted_fr": "11 Novembre 2026", "verified_at_iso": "2026-11-11T05:50:26Z", "url": "https://www.profilculture.com/annonce/coordinateur-rice-des-actions-culturelles-artistiques-498913.html", "highlights": ["Coordinateur·rice des actions culturelles et artistiques La Constellation", "CDD 9 mois renouvelable et évolutif", "Description de l'entreprise/de l'organisme", "La/le coordinateur·rice des actions culturelles et artistiques est embauché·e afin d'accompagner, entre autres, les projets suivants :"], "summary_excerpt": "Retour aux offres\nCoordinateur·rice des actions culturelles et artistiques La Constellation\nSpectacle vivant\nArt • Architecture • Design\nGrigny (91)\nCDD 9 mois renouvelable et évolutif\nDébut : Dès que possible\nDescription de l'entreprise/de l'organisme\nLa Constellation est une compagnie d'arts en espace public dont l'objectif est de proposer des réponses artistiques aux besoins et désirs des territoires sur lesquels elle intervient, et des partenaires avec qui elle travaille. Elle conçoit des projets territoriaux alliant création originale et diffusion de spectacles d'autres compagnies.\nLa Constellation est co-di", "full_description": "Retour aux offres\nCoordinateur·rice des actions culturelles et artistiques La Constellation\nSpectacle vivant\nArt • Architecture • Design\nGrigny (91)\nCDD 9 mois renouvelable et évolutif\nDébut : Dès que possible\nDescription de l'entreprise/de l'organisme\nLa Constellation est une compagnie d'arts en espace public dont l'objectif est de proposer des réponses artistiques aux besoins et désirs des territoires sur lesquels elle intervient, et des partenaires avec qui elle travaille. Elle conçoit des projets territoriaux alliant création originale et diffusion de spectacles d'autres compagnies.\nLa Constellation est co-dirigée par Hélène Savina-Ribeyrolles et Alexandre Ribeyrolles qui inventent et créent des projets selon deux grands axes principaux : le spectacle vivant et la lecture à haute voix, et les arts plastiques en espace public.\nLa/le coordinateur·rice des actions culturelles et artistiques rejoindra une équipe composée également d'une administratrice, ainsi que de personnel intermittent embauché selon les projets. Iel sera amené·e à travailler sous la direction d'Hélène Savina-Ribeyrolles pour les projets en lien avec le spectacle vivant et la lecture à haute voix, et sous la direction d'Alexandre Ribeyrolles pour les projets en lien avec les arts plastiques.\nDescription du poste\nMissions :\nLa/le coordinateur·rice des actions culturelles et artistiques est embauché·e afin d'accompagner, entre autres, les projets suivants :\n- Des résidences artistiques (écriture, arts plastiques,...)\n- Des créations de fresques dans l'espace public\n- L'accompagnement artistique d'une rénovation urbaine\n- Des projets de lecture à haute voix à destination de publics variés\nDans le cadre de ces différents projets, iel sera amené·e à effectuer les tâches suivantes :\n- Coordination : suivi et conception des plannings des ateliers et interventions, élaboration des feuilles de route, participation aux réunions avec les partenaires, rédaction de compte-rendu,...\n- Médiation culturelle : accompagnement logistique des artistes en amont, pendant et après les ateliers, les actions artistiques ou les spectacles, préparation des données de bilan, lien avec le public et les structures partenaires, gestion des groupes, accompagnement des ateliers\n- Communication : mise à jour et suivi des réseaux sociaux et site internet, création des supports de communication\nDescription du profil recherché\nNous recherchons une personne :\n- rapidement autonome\n- capable de s'adapter facilement\n- qui aime le contact avec le public et les artistes\n- qui a de bonnes compétences en RS, gestion de site internet, création de visuels\n- pouvant témoigner d'une première expérience professionnelle en lien avec le poste\nPermis B souhaitable\nInformations complémentaires\nCDD de 9 mois renouvelable, évolutif en CDI\nRémunération\nMensuelle - Brute - 2 140,00 € - A partir de 2140 EUR brut, selon profil\nAdresse postale du recruteur\n7, Chemin du Clotay\n91350 Grigny\nPostulez simplement depuis votre espace candidat\nÀ propos de votre candidature\nPostuler dès maintenant t en œuvre pour bâtir un territoire durable, inclusif et solidaire.\n1 200 agents investis dans les métiers des filières techniques (bâtiments, voirie, assainissement, propreté urbaine, restauration collective, collecte des déchets, hygiène, numérique...), sportives et culturelles (lecture publique, danse, musique, théâtre, sports aquatiques...) et administratives (droit, finances, achats publics...).\nLa diversité des provenances, des personnalités et des expertises de nos agents constitue la richesse de GPSEA, richesse à la mesure de l'ambition du territoire.\nEn 2025, GPSEA a réalisé entre autres projets, une soixantaine d’opérations de travaux sur les voiries et les réseaux d’assainissement et d’eaux pluviales, une dizaine d'opérations de construction, de réhabilitation ou de rénovation des équipements culturels et sportifs du Territoire, 60 opérations d’aménagement...\nVous aussi, vous avez de l'ambition pour votre carrière. Alors, postulez ! Et rejoignez-nous.\n*Alfortville, Boissy-Saint-Léger, Bonneuil-sur-Marne, Chennevières-sur-Marne, Créteil, La Queue-en-Brie, Le Plessis-Trévise, Limeil-Brévannes, Mandres-les-Roses, Marolles-en-Brie, Noiseau, Ormesson-sur-Marne, Périgny-sur-Yerres, Santeny, Sucy-en-Brie, Villecresnes.\nContexte :\nDans le domaine des enseignements artistiques, la collectivité, par le biais de sa Direction des Sports et de la Culture (DSC) rattachée à la Direction Générale Adjointe Citoyenneté (DGAC), pilote et assure aujourd’hui le développement de 9 conservatoires gérés en régie directe. Ce réseau d’envergure, diversifié dans sa composition, comptant trois conservatoires classés (CRI d’Alfortville et de Limeil-Brévannes et CRR de Créteil), nourrit le double objectif de proposer localement des services culturels adaptés aux communes d’implantation et d’irriguer de manière équilibrée le territoire, en travaillant à la diversification de l’offre, au renforcement de synergies, à l’harmonisation, à l’optimisation et à la modernisation des fonctionnements.\nPositionnés au cœur de cet environnement dynamisant, les conservatoires de Boissy-Saint-Léger et Limeil-Brévannes, qui totalisent pour l’heure 600 élèves (interventions scolaires non comprises) sont en outre tous 2 concernés par l’actuelle étude de programmation bâtimentaire dans la perspective de nouveaux pôles culturels, propices au développement des croisements pédagogiques, artistiques, des complémentarités fonctionnelles et organisationnelles que la future direction devra pouvoir concevoir en dialogue avec les communes et le Territoire.\nAu sein d'une équipe d'une cinquantaine d'agents, vous évoluez selon un principe de transversalité dans les domaines de la pédagogie, de l’accueil, de la communication, de l’administration et de la régie technique. Dans ce contexte, vous veillez à déployer vos compétences, savoir-faire et qualités humaines pour réaliser les missions suivantes.\nDescription du poste\nMissions :\nMissions :\nAssurer la mise en œuvre technique et logistique des manifestations des établissements (liens avec les enseignants, les artistes invités, installation scénique, transport du matériel…) ;\nSoutenir la régie technique et être présent lors des évènements ;\nPréparer les salles de cours, la salle d’orchestre et les salles de réunions ;\nInstaller les salles de spectacles dans le respect des normes en vigueur dans les ERP ;\nGérer le matériel musical et le mobilier des établissements (devis, commandes, inventaires, locations, prévisions budgétaires, suivi, entretien, réparations, transports…).\nDescription du profil recherché\nSens de l'organisation ;\nDynamisme et force de proposition y compris sur le plan artistique ;\nGoût du travail en équipe ;\nConnaissance des normes d’accueil dans les ERP ;\nAutonomie, rigueur, fiabilité, polyvalence, réactivité et disponibilité ;\nBonnes qualités relationnelles et goût pour l’accompagnement de publics variés et de leurs projets ;\nCalme, politesse et diplomatie.\nDescription de l'expérience recherchée\nFormation technicien du son et/ou lumière ;\nConnaissances de base en audiovisuel ;\nHabilitation électrique souhaitée.\nInformations complémentaires\nConditions du poste :\nTemps de travail : 37h30 ;\nPoste à amplitudes et horaires variables selon pics d’activité de l’établissement ;\nTravail en soirée et le weekend dans le cadre des manifestations ;\nPrise des congés sur les vacances scolaires exclusivement ;\nDéplacements réguliers sur le territoire de GPSEA ;\nPermis B indispensable ;\nRémunération :\nRémunération statutaire + RIFSEEP ;\nSelon profil et expérience ;\nAvantages :\nRTT ;\nPrestations d’action sociale via le CNAS ;\nParticipation mutuelles labellisées (jusqu’à 30€/mois) ;\nPossibilité d’adhérer au contrat collectif prévoyance - maintien de salaire (PSC) avec prise en charge à hauteur de 50% par la collectivité ;\nPossibilité de bénéficier de séances d’ostéopathie (gratuitement), organisées tous les trimestres sur différents sites de la collectivité.\nRémunération\nMensuelle - Nette - 1 502,00 € - 1 700,00 €\nDate limite de candidature\n10/12/2026\nAdresse postale du recruteur\nLimeil-Brévannes/Boissy-Saint-Léger\nPour postuler :\nRenseignements auprès de Madame Céline LALOU, directrice par intérim des conservatoires de Boissy-Saint-Léger et Limeil-Brévannes : clalou@gpsea.fr - 06 27 37 09 20.\nCréer votre compte candidat ci-dessous et joindre une lettre de motivation ainsi que votre CV\nPostulez simplement depuis votre espace candidat\nÀ propos de votre candidature\nPostuler dès maintenant\nRetour aux offres\nAnnonce sauvegardée\nSauvegarder\nImprimer\nVotre espace candidat.e\nMot de passe oublié ?\nSe connecter\nCréer votre compte\nOnly bots should fill this\nLes dernières actualités du secteur\nMaison du Geste et de l'Image - La pratique artistique comme ressource pédagogique\nSaw Up - Formation certifiante sur Ableton Live 12 - Dernières places pour la session d'octobre !\nAgence Artémis - Formation OGA pour ouvrir une galerie d'art\n té de service\nOptimiser les flux (groupage, consolidation des envois)\nPré-saisir les données douanières\nGérer les litiges en lien avec le service client\nCe que vous apporterez au poste\nFormation Bac+2 minimum en Transport / Commerce international\nA minima 3 ans d’expérience en transit aérien export (hors alternance)\nAnglais professionnel à l’oral et à l’écrit (échanges réguliers à l’international)\nRéglementation transport aérien & douane\nOutils informatiques (Excel ; idéalement CargoWise)\nGestion des flux internationaux\nAutonomie et proactivité\nRigueur et sens des responsabilités\nEsprit d’équipe et adaptabilité\nMaîtrise des opérations de transit aérien export\nOrientation client et culture du service\nOrganisation et gestion des priorités dans un environnement dynamique\nCe que nous offrons\nPoste basé à Roissy CDG (open space – pas de déplacements)\nCDI – Statut TAM\n37h/semaine\n1 jour de télétravail hebdomadaire\nRémunération : la fourchette salariale pour ce poste est comprise entre 34 000 € et 39 000 € bruts annuels, en fonction de l’expérience et des compétences.\nPourquoi nous rejoindre ?\nChez Yusen Logistics, vous aurez l’opportunité de contribuer à des projets porteurs de sens, de travailler aux côtés de professionnels talentueux et de développer votre carrière dans un environnement qui valorise l’innovation, la responsabilité et la collaboration.\nChez Yusen Logistics, nous comprenons l’intérêt d’utiliser l’IA et d’autres technologies pour accompagner le processus de candidature. Toutefois, nous encourageons les candidats à utiliser ces outils pour enrichir leur candidature, plutôt que pour remplacer leur propre effort et leur authenticité. Lors du processus d’entretien, nous attendons des réponses qui reflètent votre propre expérience, votre réflexion et vos compétences.\nYusen Logistics est un employeur garantissant l’égalité des chances. Nous accueillons les candidatures de toutes les personnes dûment qualifiées et fondons nos décisions de recrutement exclusivement sur les compétences, l’expérience et le potentiel. La diversité nous permet de créer un environnement inclusif où chacun peut s’épanouir et évoluer."}, {"id": "op-08c166ae3156", "source_id": "4487477952", "source_name": "LinkedIn Emplois", "title": "Coordinateur Logistique Oil & Gas H/F", "company": "HOUSE OF ABY", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "35 000 € brut/an", "has_salary": true, "salary_max_eur": 35000, "affinity_score": 99, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-11-10", "posted_fr": "10 Novembre 2026", "verified_at_iso": "2026-11-11T05:52:10Z", "url": "https://www.linkedin.com/jobs/view/4487477952/", "highlights": ["Dans le cadre de projets industriels à dimension internationale, Abylsen recherche un Coordinateur Logistique H/F chargé d’organiser et de suivre les opérations de transport et d’expédition des équipements.", "Organiser et suivre les expéditions d’équipements dans un environnement industriel international.", "Coordonner les opérations de transport multimodal : routier, maritime et aérien.", "Assurer l’interface avec les fournisseurs, transporteurs, transitaires et équipes projets."], "summary_excerpt": "Dans le cadre de projets industriels à dimension internationale, Abylsen recherche un Coordinateur Logistique H/F chargé d’organiser et de suivre les opérations de transport et d’expédition des équipements.\nVous intervenez en interface avec les équipes projets, les fournisseurs, les transporteurs et les transitaires afin de garantir la bonne livraison des équipements dans le respect des délais, des contraintes contractuelles et des exigences HSE.\n﻿Vos principales missions\nOrganiser et suivre les expéditions d’équipements dans un environnement industriel international.\nCoordonner les opérations de transport multim", "full_description": "Dans le cadre de projets industriels à dimension internationale, Abylsen recherche un Coordinateur Logistique H/F chargé d’organiser et de suivre les opérations de transport et d’expédition des équipements.\nVous intervenez en interface avec les équipes projets, les fournisseurs, les transporteurs et les transitaires afin de garantir la bonne livraison des équipements dans le respect des délais, des contraintes contractuelles et des exigences HSE.\n﻿Vos principales missions\nOrganiser et suivre les expéditions d’équipements dans un environnement industriel international.\nCoordonner les opérations de transport multimodal : routier, maritime et aérien.\nAssurer l’interface avec les fournisseurs, transporteurs, transitaires et équipes projets.\nPréparer et contrôler les documents nécessaires au transport et aux opérations douanières.\nVeiller à l’application des Incoterms et des procédures douanières applicables.\nSuivre les enlèvements, acheminements et livraisons jusqu’à destination.\nAnticiper les risques logistiques et proposer des solutions en cas d’aléas ou de retard.\nParticiper au suivi des coûts et des prestations de transport.\nGarantir la traçabilité des opérations et le reporting auprès des équipes projets.\nVeiller au respect des exigences HSE applicables aux opérations logistiques.\n​\nVous justifiez d’une expérience confirmée en coordination logistique, idéalement acquise dans un environnement industriel, énergie, Oil & Gas ou sur des projets internationaux.\nVous êtes diplômé(e) d’une formation Bac+2 à Bac+5 en transport, logistique, supply chain ou commerce international.\nVous maîtrisez l’organisation du transport international et multimodal.\nVous connaissez les Incoterms, les procédures import/export et les principes de la réglementation douanière.\nVous êtes à l’aise avec un ERP ou des outils de gestion logistique ; la connaissance de SAP ou d’un TMS constitue un atout.\nVous êtes capable de coordonner plusieurs interlocuteurs et de gérer simultanément plusieurs expéditions et priorités.\nVous disposez d’un anglais professionnel, indispensable pour échanger dans un environnement international.\n​\nLe salaire proposé pour ce poste se situe entre 35 000 € et 40 000 € brut par an, selon votre expérience et vos qualifications.\n​ HOUSE OF ABY : un terrain de jeu unique pour nos talents !\nLe Groupe HOUSE OF ABY rassemble 10 marques complémentaires au sein d’un même écosystème, couvrant des secteurs variés tels que l’aéronautique, le digital, le nucléaire, le pharmaceutique, le ferroviaire et l’infrastructure... Cette diversité fait de HOUSE OF ABY un véritable terrain de jeu professionnel, offrant à nos consultants et Business Partners l’opportunité d’évoluer dans des environnements, métiers et projets aux enjeux multiples.\nGrâce à cette organisation multi-marques, chacun peut construire un parcours sur mesure, développer ses expertises, explorer de nouveaux domaines et intervenir sur des projets à forte valeur ajoutée.\nRejoindre HOUSE OF ABY, c’est intégrer un Groupe en mouvement, qui fait confiance à ses équipes et leur offre les moyens de performer, grandir et réussir.\n✅ ABYLSEN est une société de conseil en ingénierie qui accompagne ses clients dans la réalisation de leurs projets technologiques grâce à des consultants experts. Leur mission : apporter expertise, innovation et capacité d’exécution.\nDepuis plus de 20 ans, Abylsen s’impose comme un acteur majeur du conseil en ingénierie en Europe. Abylsen accompagne plus de 660 clients dans leurs projets industriels, digitaux et opérationnels.\nNos domaines d’expertise :\nR&D\nProduction & opérations\nDigital & IT\nIndustrialisation\nValidation & tests\nMaintenance & sûreté\nNos secteurs d’activité : ⚡ Énergie ✈️ Aéronautique, Spatial & Défense 🚗 Automobile 🧬 Life Sciences 🏗 BTP & Infrastructures ⚙️ Industrie lourde 📡 IT & Télécommunications 💼 Banque, Finance & Assurance\nÉgalité des chances\nAucune barrière ne doit freiner le talent ! Engagé pour l’égalité des chances, notre Groupe s’inscrit dans une démarche inclusive : chaque poste est ouvert à toutes et tous, et nous soutenons activement l’intégration des personnes en situation de handicap."}, {"id": "op-13e822b60045", "source_id": "82742994", "source_name": "HelloWork", "title": "Agent de Transit - Aerospace Routine H/F", "company": "Mathez Transports Internationaux", "logo_url": "", "sector": "Transport • Logistique", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Tremblay-en-France (93)", "city_raw": "Tremblay-en-France - 93", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "35 000 – 39 000 € brut/an", "has_salary": true, "salary_max_eur": 39000, "affinity_score": 96, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-27", "posted_fr": "27 Octobre 2026", "verified_at_iso": "2026-11-11T05:50:34Z", "url": "https://www.hellowork.com/fr-fr/emplois/82742994.html", "highlights": ["Vous avez l'habitude de gérer des dossiers de transport aérien de bout en bout ?", "Vous appréciez coordonner différents interlocuteurs dans un environnement international ?", "Vous recherchez un cadre structuré avec des échanges opérationnels concrets au quotidien ?", "L'activité s'inscrit dans un environnement international, avec des échanges réguliers avec clients, agents et équipes internes."], "summary_excerpt": "Les missions du poste\n
