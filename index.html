s et fluides.\nNotre mission\nNous recrutons, formons et fidélisons les meilleurs experts en logistique et en technologie à travers le monde. Nous adorons promouvoir en interne : plus de 50 % de nos collaborateurs sont chez Expeditors depuis plus de cinq ans. Notre taux de fidélisation élevé s’explique notamment par un programme de rémunération unique pour des postes qui sont bien plus que de simples emplois — ce sont de véritables opportunités d’évoluer, de faire ce que vous aimez et de construire une carrière avec nous !\nDescription Du Poste\nPrincipales Responsabilités:\nOrganiser les enlèvements et les livraisons des marchandises\nPréparer et éditer les documents de transport\nTraiter les expéditions\nAssurer le suivi des dossiers\nOrganiser le dédouanement des marchandises en lien avec le Dpt Douanes\nCommuniquer les informations auprès des clients, du réseau et des transporteurs\nQualifications\nExcellente capacité à communiquer dans un milieu international\nAisance avec les outils bureautiques (outlook, excel…)\nSens de l’écoute et du détail\nEsprit d’équipe\nAnglais courant\nInformations supplémentaires\nPoste basé à Survilliers\nContrat en CDI\n13ème mois + Mutuelle complémentaire santé + CE\nPlans de développement de compétences\nFormation continue (52 h par an minimum)\nTickets restaurant (11 euros/ jour)\nPrise en charge de 50% de l’abonnement de transport en commun\nwww.expeditors.com\nSalaire = entre 30000 euros et 33800 euros bruts annuels sur 13 mois"}, {"id": "op-22faf6e0dc56", "source_id": "4485754210", "source_name": "LinkedIn Emplois", "title": "[CDI] Acheteur / Acheteuse (H/F)", "company": "KONCRETE", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 91, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires"], "posted_iso": "2026-11-02", "posted_fr": "2 Novembre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4485754210/", "highlights": ["Koncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.", "Nous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.", "Tes missions1. Comprendre et qualifier les besoins d’achat", "Recueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances."], "summary_excerpt": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les ", "full_description": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.\nTu sais déjà mener une consultation, relancer des fournisseurs et défendre une recommandation chiffrée. Tu souhaites gagner en autonomie et développer ton expertise dans un environnement entrepreneurial où tes décisions ont un impact concret sur la compétitivité des offres et la rentabilité des projets.\nUn rôle 100 % achats : ton périmètre couvre le sourcing, les consultations, l’analyse des offres, la négociation et le suivi de la performance fournisseurs. La planification des livraisons, la coordination quotidienne des tournées et la gestion des incidents opérationnels ne constituent pas tes missions principales : elles relèvent des équipes opérations.\nTes missions1. Comprendre et qualifier les besoins d’achat\nRecueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances.\nVérifier que les informations nécessaires à une consultation sont complètes et lever les ambiguïtés avant de solliciter les partenaires.\nTraduire les besoins en demandes de prix ou cahiers des charges clairs, avec l’appui des équipes compétentes pour les exigences techniques et réglementaires.\nPrioriser les consultations selon leur urgence, leur potentiel et leurs enjeux économiques.\n2. Piloter les consultations fournisseurs de bout en bout\nIdentifier les fournisseurs, plateformes et transporteurs pertinents pour chaque besoin.\nPréparer et envoyer les demandes de prix, en précisant les quantités, spécifications, conditions attendues et délais de réponse.\nOrganiser la mise en concurrence et obtenir plusieurs offres comparables lorsque le marché le permet.\nSuivre les réponses, relancer les interlocuteurs et clarifier les éléments manquants ou incohérents.\nTenir un tableau de suivi des consultations : partenaires sollicités, réponses reçues, échéances, points ouverts et prochaines actions.\nConstruire une synthèse exploitable et recommander les solutions les plus pertinentes aux équipes concernées.\n3. Analyser les offres et négocier les conditions d’achat\nComparer les propositions à périmètre équivalent : prix, transport, frais annexes, disponibilité, délais, conditions de paiement et durée de validité.\nRaisonner en coût complet, et pas uniquement en prix unitaire, pour identifier la solution réellement compétitive.\nRepérer les écarts, exclusions et risques susceptibles de dégrader la marge ou la faisabilité de l’offre.\nNégocier les tarifs et les conditions commerciales dans le respect des objectifs et du cadre de validation interne.\nFormaliser les conditions obtenues par écrit et sécuriser leur bonne transmission aux équipes commerciales et opérationnelles.\nSolliciter une validation pour les engagements ou dérogations dépassant ton niveau de délégation.\n4. Développer et entretenir le réseau fournisseurs\nSourcer de nouveaux partenaires pour renforcer la couverture géographique et élargir les solutions disponibles.\nQualifier leur offre, leurs capacités, leurs zones d’intervention et leurs conditions commerciales.\nRecueillir les informations et documents nécessaires au référencement, avec l’appui des équipes compétentes.\nConstruire des relations de travail durables, tout en maintenant une mise en concurrence adaptée.\nIdentifier des alternatives sur les besoins récurrents ou sensibles pour limiter la dépendance à un partenaire unique.\nRéévaluer les conditions négociées en fonction des volumes, des évolutions de marché et des retours terrain.\n5. Fiabiliser les données et améliorer les méthodes achats\nMaintenir à jour la base fournisseurs, les grilles tarifaires et l’historique des consultations.\nAssurer la traçabilité des offres et des accords : version, date, périmètre, validité et conditions particulières.\nConstruire des modèles de consultation et des grilles de comparaison simples et réutilisables.\nSuivre les résultats de tes consultations et identifier les leviers d’amélioration.\nExploiter les retours des opérations pour ajuster la sélection et l’évaluation des partenaires.\nProposer des améliorations concrètes pour accélérer les consultations et fiabiliser les décisions d’achat.\nLe profil recherché\nUne première expérience solide, sans être un profil senior\nTu disposes idéalement de 1 à 3 ans d’expérience en achats, approvisionnement ou sourcing, avec une pratique réelle des consultations et de la négociation. Une alternance significative et responsabilisante peut être prise en compte.\nTu as déjà géré plusieurs demandes en parallèle, comparé des devis et échangé directement avec des fournisseurs.\nUne formation en achats, supply chain, commerce ou gestion est appréciée ; nous regardons surtout tes compétences et tes réalisations concrètes.\nUne expérience dans le BTP, les matériaux, le transport ou un environnement industriel est un plus, pas un prérequis.\nTes compétences\nRigueur analytique : tu sais construire un comparatif fiable, vérifier les unités et calculer un coût complet.\nNégociation : tu prépares tes échanges, argumentes avec des éléments concrets et sais rechercher un accord équilibré.\nOrganisation : tu pilotes tes échéances et relances sans perdre les dossiers en cours.\nRelationnel : tu es à l’aise au téléphone et sais poser les bonnes questions pour obtenir une réponse exploitable.\nAutonomie : tu fais avancer les sujets courants et sais alerter lorsqu’une décision nécessite un arbitrage.\nCuriosité : tu cherches à comprendre les produits, les contraintes des partenaires et les réalités des chantiers.\nEtape 1 : Entretien en visio avec Naila , notre Chief of Staff\nEtape 2 : Entretien avec Pierre-Marie, notre COO\nEtape 3 : Entretien avec Henri, notre CEO"}, {"id": "op-60ee00194be3", "source_id": "4481214269", "source_name": "LinkedIn Emplois", "title": "CHARGE DE LOGISTIQUE AVAL H/F", "company": "VEJA", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDD", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 90, "match_tags": ["Supply Chain & Pilotage des flux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-19", "posted_fr": "19 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4481214269/", "highlights": ["Plus précisément, vos missions seront les suivantes :", "Assurer le suivi quotidien des opérations avec l’entrepôt", "Suivi des délais d’intégration, de préparation et de livraison", "Planification et organisation des livraisons clients"], "summary_excerpt": "En pleine expansion, Veja recherche un(e) chargé(e) de logistique aval. Au sein du département Supply Chain basé(e) au siège de Paris, vous intégrez l’équipe logistique aval France / Europe. Rattaché au Team Leader logistique aval vous aurez pour objectif principal de veiller au bon fonctionnement de l’entrepôt, vous contribuez activement au pilotage et à l’organisation des flux logistiques.\nPlus précisément, vos missions seront les suivantes :\nAssurer le suivi quotidien des opérations avec l’entrepôt\nSuivi des délais d’intégration, de préparation et de livraison\nPlanification et organisation des livraisons clien", "full_description": "En pleine expansion, onal de marchandises. Véritable interface entre les clients, les transporteurs, les compagnies maritimes, aériennes ou routières, vous veillez au bon acheminement des expéditions dans le respect des délais, des coûts et des réglementations en vigueur.\nQu'allez-vous faire ?\nOrganiser et coordonner les expéditions nationales et internationales.\nGérer les dossiers import/export de A à Z.\nAssurer la relation avec les clients, les transporteurs, les compagnies maritimes et aériennes ainsi que les autorités douanières.\nÉtablir et contrôler les documents de transport et de dédouanement.\nSuivre l'acheminement des marchandises et informer les clients de l'avancement de leurs expéditions.\nIdentifier et résoudre les éventuels aléas liés au transport.\nVeiller au respect des réglementations douanières, de transport et de commerce international.\nContrôler la facturation des opérations et garantir la rentabilité des dossiers.\nDescription du profil :\nQui recherchons-nous ?\nVous êtes titulaire d'une formation en transport, logistique, commerce international ou équivalent.\nVous justifiez d'une première expérience réussie dans le transit international, l'import/export ou la logistique.\nVous maîtrisez les incoterms, les procédures douanières et les documents de transport.\nVous êtes à l'aise avec les outils informatiques et les logiciels métiers.\nVous possédez un bon niveau d'anglais professionnel, à l'écrit comme à l'oral.\nVous faites preuve d'organisation, de rigueur et de réactivité.\nVous avez le sens du service client et appréciez le travail en équipe dans un environnement dynamique."}, {"id": "op-8477e00a3d12", "source_id": "4481453257", "source_name": "LinkedIn Emplois", "title": "Approvisionneur - H/F", "company": "Eurobio Scientific FR", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Les Ulis (91)" s dans leur transformation digitale et leur croissance, en libérant de l’efficacité opérationnelle grâce à des processus d’automatisation fiables, sécurisés et durables.\nNotre succès dans l’innovation et le développement de l’activité s’inspire des liens que nos équipes diverses créent chaque jour, avec nos clients comme entre elles.\nCe sont ces connexions qui font de Quadient un lieu exceptionnel pour faire évoluer votre carrière, développer vos compétences et avoir un véritable impact – en aidant notre entreprise tournée vers l’avenir à montrer la", "full_description": "Chez Quadient, nous accompagnons les entreprises de toutes tailles dans leur transformation digitale et leur croissance, en libérant de l’efficacité opérationnelle grâce à des processus d’automatisation fiables, sécurisés et durables.\nNotre succès dans l’innovation et le développement de l’activité s’inspire des liens que nos équipes diverses créent chaque jour, avec nos clients comme entre elles.\nCe sont ces connexions qui font de Quadient un lieu exceptionnel pour faire évoluer votre carrière, développer vos compétences et avoir un véritable impact – en aidant notre entreprise tournée vers l’avenir à montrer la voie dans la création de connexions professionnelles sécurisées et durables, à travers des canaux digitaux et physiques.\nDescription Du Poste\nApprovisionneur(se) Junior\nMission principale\nGarantir la disponibilité des produits finis et pièces détachées en assurant la fiabilité, la fluidité et l’optimisation des flux d’approvisionnement entre les fournisseurs, l’entreprise et les clients.\nResponsabilités clés\nGestion des approvisionnements & des stocks\nAnalyser et suivre les niveaux de stock ; proposer des actions d’optimisation.\nPasser les commandes fournisseurs et assurer leur suivi jusqu’à la livraison.\nGérer les approvisionnements des produits du catalogue (produits finis, imprimés, pièces détachées, SWAP).\nAssurer la bonne intégration des commandes dans les systèmes d’information (gestion des rejets).\nSuivre les transporteurs et garantir la bonne exécution des livraisons.\nRelation clients (interne / externe)\nInformer les clients sur les délais de livraison et les éventuels aléas.\nTraiter les sollicitations via les appels entrants et le CRM.\nGérer les priorités avec fournisseurs et prestataires.\nTraiter les anomalies, retours et non‑conformités produits.\nSuivre les avoirs liés à son périmètre.\nPiloter les prises de rendez‑vous de livraison lorsque nécessaire.\nSuivi de l’activité\nParticiper aux inventaires et analyses d’écarts.\nAssurer un reporting régulier des actions menées et de la performance opérationnelle.\nQualifications\nCompétences requises\nMaîtrise des outils bureautiques et des systèmes SAP / SFDC.\nSens du service client et excellente communication.\nRigueur, organisation, autonomie.\nCapacité d’analyse et force de proposition.\nEngagements & responsabilités\nLe Titulaire Est Garant\nDe la disponibilité du stock et de la cohérence entre stock physique, informatique et financier.\nDu respect des délais clients.\nDe la qualité de la relation avec fournisseurs, prestataires et clients.\nIl S’engage à\nRespecter les règles internes, procédures, sécurité, qualité et environnement.\nContribuer à l’amélioration continue et à la réduction de l’impact environnemental.\nSignaler les anomalies et proposer des actions correctives.\nInformations supplémentaires\nFlexibilité de travail : bénéficiez d’un modèle de travail hybride, alliant bureau et télétravail, pour un mode de vie équilibré.\nAccès illimité à la formation : accédez à des opportunités mondiales de développement grâce à notre plateforme de formation en ligne, disponible 24 h/24 et 7 j/7.\nCommunauté inclusive : Rejoignez nos communautés engagées et participez à notre programme philanthropique.\nRécompenses exhaustives : obtenez des récompenses exhaustives compétitives pour le bien-être, l’équilibre entre vie professionnelle et vie privée, et bien d’autres choses encore, comme un généreux plan de parrainage.\nAttention portée au bien-être : profitez de notre programme gratuit d’assistance aux employés pour soutenir votre santé mentale.\nChez Quadient, notre approche de Smart Work favorise la connexion, la collaboration et l'innovation, tout en offrant une flexibilité adaptée aux besoins des postes. Sur site, hybrides ou à distance, nos environnements de travail sont conçus pour favoriser la productivité et l'engagement. Les employés hybrides concilient travail à distance et travail au bureau, les postes sur site contribuent quotidiennement à notre culture d'entreprise dynamique, et les employés à distance restent connectés grâce à la collaboration virtuelle et aux événements en personne. Où que vous travailliez, vous ferez partie d'une communauté dynamique, centrée sur l'humain, qui favorise la réussite collective.\nSoyez vous-même chez Quadient\nNos valeurs déterminent la manière dont nous travaillons en tant qu’équipe : Empowerment (Responsabilisation), Passion (Passion), Inspiration (Inspiration) et Community (Communauté). Elles nous inspirent à adopter un comportement EPIC. Ensemble. Ce qui différencie Quadient, c’est justement les différences de chacun et chacune. Nous sommes une équipe d’individus qui ont un objectif commun, mais de nombreux points de vue. Lorsque vous entretenez des relations avec Quadient, vous rejoignez une communauté bienveillante dont la culture prône la différence et accorde de la valeur à chaque avis.\nNous étudierons toute modification suggérée du processus d’entretien, dans la mesure où elle raisonnable. Si vous avez besoin d’aide avec le processus de dépôt de candidature, veuillez nous envoyer un e-mail à l’adresse career@quadient.com.\nQuadient est un employeur garantissant l'égalité des chances en matière d’emploi. * : Nous croyons fermement à l'absence totale de discrimination en matière d'emploi, quelle que soit la raison, notamment la race, la couleur, la , le sexe, l'origine nationale, l'âge, le handicap, le statut d'ancien combattant ou de militaire, les informations génétiques, la citoyenneté et toute autre caractéristique protégée par la législation locale, étatique ou fédérale.\nNous tous. Unis dans nos relations."}, {"id": "op-ee23a512391f", "source_id": "4478675412", "source_name": "LinkedIn Emplois", "title": "Chargé(e) de planification H/F", "company": "Spekty", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Courbevoie (92)", "city_raw": "Courbevoie", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 83, "match_tags": ["Supply Chain & Pilotage des flux"], "posted_iso": "2026-10-20", "posted_fr": "20 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:25Z", "url": "https://www.linkedin.com/jobs/view/4478675412/", "highlights": ["Sécuriser la massification de la rénovation énergétique.", "Notre force d’intervention terrain grandit, et notre équipe de coordination aussi ! Vous serez la personne qui aide nos équipes à donner le meilleur d’elles-mêmes.", "Vos Missions Au Quotidien Seront De", "Réceptionner les nouvelles commandes et affecter les différentes missions aux techniciens"], "summary_excerpt": "À propos de nous\nCréé en 2020, Spekty est LE tiers de confiance du secteur, spécialisé dans le contrôle qualité des travaux de rénovation énergétique. Accrédité par le Cofrac, Spekty s’inscrit dans la filière TIC (Testing, Inspection, Certification) pour vérifier la conformité, la performance et la durabilité des travaux réalisés partout en France.\n🎯 Notre raison d’être\nSécuriser la massification de la rénovation énergétique.\nAlors que des millions de logements doivent être rénovés dans les années à venir, nous faisons le choix de la rigueur, de l’exigence technique et de la pédagogie pour faire grandir une filiè", "full_description": "À propos de nous\nCréé en 2020, Spekty est LE tiers de confiance du secteur, spécialisé dans le contrôle qualité des travaux de rénovation énergétique. Accrédité par le Cofrac, Spekty s’inscrit dans la filière TIC (Testing, Inspection, Certification) pour vérifier la conformité, la performance et la durabilité des travaux réalisés partout en France.\n🎯 Notre raison d’être\nSécuriser la massification de la rénovation énergétique.\nAlors que des millions de logements doivent être rénovés dans les années à venir, nous faisons le choix de la rigueur, de l’exigence technique et de la pédagogie pour faire grandir une filière encore jeune et en pleine structuration.\nMission\nNotre force d’intervention terrain grandit, et notre équipe de coordination aussi ! Vous serez la personne qui aide nos équipes à donner le meilleur d’elles-mêmes.\nVos Missions Au Quotidien Seront De\nRéceptionner les nouvelles commandes et affecter les différentes missions aux techniciens\nRéaliser les plannings d'intervention et optimiser les tournées\nCommuniquer de façon quotidienne auprès des interlocuteurs internes et externes sur l'avancement des commandes\nCoordonner les équipes de techniciens, et s'assurer de l'application des standards et bonnes pratiques (process de travail, délais impartis à leurs missions, bonne transmission des informations, etc.)\nAssurer les relations entre les différents interlocuteurs du projet (clients, Chefs de projets, techniciens…)\nRépondre aux questions techniques et pratiques des équipes de techniciens à propos des contrôles à réaliser, le cas échéant - se coordonner avec les référents techniques internes sur les sujets complexes\nSuivre l'activité et gérer les différentes priorités au quotidien\nContribuer à l’excellence opérationnelle en proposant des améliorations sur l’ensemble des process et en partageant des bonnes pratiques\nL'équipe est jeune et dynamique avec de nombreux recrutements sur les 2 prochaines années. Les perspectives d'évolution sont donc rapides et réelles.\nPourquoi Spekty ?\nPour arriver dans une petite équipe au début d’une aventure ultra ambitieuse avec un très fort potentiel marché\nPour rejoindre un projet engagé qui participe à la transition énergétique\nPour avoir des responsabilités et un fort impact sur notre développement\nPour redorer le blason du marché de la rénovation énergétique, tout simplement !\nProfil\nTitulaire d’un diplôme Bac +2/+3 minimum, vous justifiez d’une première expérience réussie (stages et alternance inclus) en planification et/ou en ordonnancement d’équipes. Reconnu(e) pour votre rigueur et votre sens de l’organisation, vous savez allier diplomatie et sens des résultats, tout en gardant toujours en ligne de mire les objectifs de l’entreprise.\nDoté(e) d’un excellent relationnel, vous vous adaptez avec aisance à des interlocuteurs variés et appréciez le travail en équipe.\nLes +\nDe superbes bureaux tout neufs (avec une douche pour celles et ceux qui aiment faire du sport sur la pause déj !)\nCarte GET MUCHO (titres-resto, 9.85€/jour et cagnotte flex de 70€/mois)\nJusqu'à 50€ de prise en charge transports (Remboursement Passe Navigo ou forfait mobilité douce pour les adeptes du vélo)\nMutuelle Alan prise en charge à hauteur de 60%\nAccord d'intéressement\nRéférence de l'offre : f63n3bvtv1"}, {"id": "op-d86c34b525dc", "source_id": "4455782819", "source_name": "LinkedIn Emplois", "title": "Responsable d'Equipe Logistique (H/F), Responsable d’Equipe Logistique (Fulfilment Center)", "company": "Amazon", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Brétigny-sur-Orge (91)", "city_raw": "Brétigny-s pédier les commandes de manière efficace afin que nos clients reçoivent leurs articles en temps et en heure. En tant que responsable de secteur, vous veillerez à ce que votre site fonctionne parfaitement afin de répondre à la demande de nos clients. Vous serez à la tête d’une équipe qui contribue à la sécurité, à l’efficacité et à la qualité de nos opérations et vous prendrez en charge un certain nombre de projets sur l’ensemble de notre réseau afin de stimuler la productivité.\nKey job responsibilities\nCréer, superviser et encourager une culture de la sécurité et du bien-être\nAnalyser et mettre en œuvre des changements pour maintenir la qualité et la productivité à un niveau élevé et constant\nSuperviser les projets visant à rationaliser les processus, à optimiser la productivité et à améliorer la qualité du service pour les clients dans votre périmètre de responsabilité\nAnalyser les performances de l’équipe par rapport aux objectifs de l’entreprise et mettre en place des actions pour améliorer notre excellence opérationnelle\nTravailler en collaboration avec des collègues de la direction pour normaliser les pratiques des équipes\nA day in the life\nVous travaillerez en équipe sur l’un de nos sites, en veillant à ce qu’il soit aussi productif que possible. Vous aurez pour tâche principale d’instaurer une culture de la sécurité et de faire respecter les normes de qualité et de performance de l’équipe. Vous superviserez également les améliorations apportées aux processus dans votre secteur et en assurerez la mise en œuvre. Vos missions seront variées au cours d’une journée type : gestion de l’équipe, pilotage des opérations quotidiennes, amélioration des processus, missions d’urgence à grande échelle, etc. Vous servirez également d’exemple et de mentor aux nouveaux managers.\nAbout The Team\nNotre centre de traitement des commandes (Customer Fulfilment, ou CF), est l’endroit où tout a commencé pour Amazon. D’une modeste équipe de libraires, le CF est devenu une équipe mondiale spécialisée qui traite plus de 1,5 million de commandes chaque jour. L’équipe CF est le moteur de notre entreprise et ses efforts nous ont permis de nous tourner vers de nouvelles régions et de proposer de nouveaux services. Avec l’aide des technologies émergentes, nous sommes en permanence à la recherche de solutions nouvelles pour proposer une gamme de produits plus large et de meilleure qualité, livrée rapidement et à un prix abordable.\nL’équipe CF est le premier maillon de la chaîne qui permet aux clients d’obtenir les produits à la vitesse qui fait notre réputation. Nous sommes basés dans les centres de traitement des commandes, qui sont au cœur du réseau des opérations d’Amazon. Nos centres sont parfois appelés le « premier kilomètre », car c’est là que la plupart des colis Amazon commencent leur voyage. Nous aidons à gérer les stocks dynamiques et à faciliter les livraisons rapides, 24 heures sur 24, 7 jours sur 7.\nNos centres de traitement des commandes regroupent des profils variés et les opportunités y sont nombreuses. Certains membres de l’équipe travaillent avec des produits physiques, tandis que d’autres analysent des données. Ensemble, nous travaillons pour que chacun puisse prendre des décisions éclairées dans toute l’entreprise.\nBasic Qualifications\nUn diplôme universitaire\nUne expérience significative dans la gestion des ressources humaines\nUne expérience dans la communication avec un large éventail de parties prenantes, y compris avec vos pairs et la direction\nUne expérience significative dans l’utilisation de données ou de témoignages pour influencer la prise de décisions de l’entreprise\nParfaite maîtrise de l’anglais et du français, à l’oral et à l’écri\nPreferred Qualifications\nLes compétences dites « souhaitables » vous aideront à tirer votre épingle du jeu mais elles ne sont pas nécessaires pour postuler à une offre chez Amazon. Si vous possédez toutes les compétences requises listées précédemment, contactez-nous sans plus tarder.\nConnaissance des techniques Lean, Six Sigma et Kaizen\nConnaissance d’un autre environnement logistique\nBonne maîtrise de la suite MS Office (Word, Excel, Outlook) dans un environnement professionnel\nAmazon est un employeur engagé pour l'égalité des chances. Nous sommes convaincus qu'une main d'oeuvre diversifée est essentielle à notre réussite. Nous prenons nos décisions de recrutement en fonction de votre expérience et de vos compétences. Nous apprécions votre envie de découvrir, d'inventer, de simplifier et de construire. La protection de votre vie privée et la sécurité de vos données constituent depuis longtemps une priorité absolue pour Amazon. Veuillez consulter notre Politique de Confidentialité pour en savoir plus sur la façon dont nous collectons, utilisons et traitons les données personnelles de nos candidats.\nOur inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https://amazon.jobs/content/en/how-we-hire/accommodations for more information. If the country/region you’re applying in isn’t listed, please contact your Recruiting Partner.\nCompany - Amazon France Logistique SAS\nJob ID: A10459810"}, {"id": "op-4b049c39b737", "source_id": "4477693804", "source_name": "LinkedIn Emplois", "title": "Coordinateur opérationnel en transfert d’entreprises F/H", "company": "Demeco Group", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_displa et la Conquête.\nDemeco Entreprises, est la division du Groupe dédiée aux services des entreprises, propose depuis 40 ans des services sur-mesure à haute valeur ajoutée principalement auprès des grands groupes français, laboratoires, hôpitaux et lieux accueillant du public (évènementiel, hôtellerie, musées). Demeco Entreprises est spécialisés dans le conseil, l’organisation et l’exécution d’opérations de manutention, de transfert et de déménagement d’équipements à forte valeur ajoutée.\nDans le cadre de notre développement, nous sommes à la recherche d'un Coordinateur opérationnel en transfert d’entreprises en CDI.\nPourquoi venir chez nous ?\nNous délivrons nos services dans des environnements variés, allant de bureaux tertiaires, en passant par l’installation et l’aménagement complet d’espaces évènementiels ou touristiques, jusqu’au transfert « clef en main » de laboratoires ou d’hôpitaux complets.\nNos clients nous choisissent pour notre image de marque rassurante, notre professionnalisme, notre réactivité et notre fort esprit de service (EDF, Veolia, Servier, Alstom, Grand Palais de Paris, Ambassade des Etats-Unis…).\nDescription Du Poste\nRattaché(e) au Chef de Projet et en lien avec les équipes opérationnelles, vous participez à la réussite des projets à haute valeur ajoutée en assurant la coordination complète des opérations sur le terrain.\nVous veillez au bon déroulement des chantiers, de leur préparation jusqu'à leur réalisation, en garantissant le respect des délais, des exigences du client et des règles de sécurité.\nVos Principales Activités\nRéaliser chez les clients des visites techniques préparatoires à l’exécution des opérations ou dans le cadre d’appels d’offres\nChiffrer les besoins en équipements, moyens et ressources humaines\nEtablir des notes méthodologiques et des plannings qui répondent aux besoins des Clients\nOrganiser et encadrer ses équipes opérationnelles dans le respect des consignes et de la feuille de route du chef de projet (planifier, expliquer, accompagner, contrôler)\nContrôler le respect des consignes de sécurité et de qualité, le respect des délais et le bon déroulement des opérations\nCommuniquer en continu avec les représentants du Client\nÊtre force de proposition, décider et apporter des solutions lors de la réalisation du chantier\nParticiper aux opérations dans un esprit d’exemplarité des bonnes pratiques (15% du temps de travail, conduite d’engins le cas échéants)\nRéaliser les contrôles de conformité et la traçabilité en fin d’opération\nVous assurez l'interface entre le client, les équipes opérationnelles et les différents intervenants afin de garantir la bonne exécution des prestations. Véritable référent terrain, vous anticipez les besoins, coordonnez les moyens humains et matériels et apportez des solutions adaptées aux problématiques rencontrées durant les opérations.\nProfil recherché\nIdéalement issu(e) d'une formation dans le domaine du transport ou de la gestion de projets, vous justifiez d'une expérience significative de + 3 ans en pilotage de transferts (déménagements d’entreprises ou industries) ou en management logistique\nDoté(e) d'un excellent relationnel, vous savez fédérer les équipes, communiquer efficacement avec les clients et les différents intervenants, et faire preuve de réactivité face aux imprévus.\nAutonome, rigoureux(se) et organisé(e), vous êtes capable de gérer plusieurs opérations simultanément tout en garantissant le respect des délais, des consignes de sécurité et de la qualité de service.\nVous disposez de solides capacités managériales, d'un bon sens d'exemplarité, discrétion et d'écoute. Vous êtes à l'aise avec l'anticipation et savez prendre des décisions rapidement dans un environnement opérationnel exigeant.\nLa maîtrise des techniques liées au transfert administratif, la connaissance de la réglementation du transport ainsi que la lecture de plans constituent de véritables atouts pour réussir dans cette fonction.\nLa possession des permis PL/SPL, Caces R489 cat.3-4, Caces R486 Nacelle sont un plus. Casier judicier vierge impératif.\nDans le cadre de notre politique d'insertion professionnelle, nous examinons toutes les candidatures sur un pied d’égalité, y compris celles des personnes en situation de handicap ou en retour à l'emploi.\nSalaire Et Conditions\nType de contrat : CDI\nRémunération selon profil et expérience : 2300 € à 3 000 € sur 12 mois + Intéressement + avantages entreprise\nMutuelle, comité d’entreprise\nPoste basé à Paris (75) ou Roissy (95)\nDéplacements réguliers toute France\nDéplacements avec découchés 2 à 5 jours /mois\nLes exigences de certaines opérations peuvent imposer des amplitudes horaires importantes mais ponctuelles\nRattachement à une équipe de coordinateurs dédiés aux projets à grande envergure\nEntreprise en croissance offrant des possibilités d’évolution\nVous recherchez un poste opérationnel et challengeant alors n'hésitez plus et candidatez ! Toute l'équipe de Demeco Entreprises sera ravie de vous accueillir !"}, {"id": "op-318116fed6ec", "source_id": "4483208423", "source_name": "LinkedIn Emplois", "title": "Data Center IT Project Coordinator H/F/N", "company": "OVHcloud", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris et périphérie", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 88, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-26", "posted_fr": "26 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:25Z", "url": "https://www.linkedin.com/jobs/view tres avec Planning, Projets et Supply Chain.\nPiloter les KPIs/OKRs et animer la performance.\nIdentifier les écarts et mettre en place les actions d'amélioration.\n- Méthodes & Amélioration continue\nStructurer et standardiser les processus et bonnes pratiques.\nPiloter des initiatives d'amélioration continue et de transformation.\nAccompagner les équipes dans le déploiement des nouvelles pratiques et formations.\n- Outils\nIdentifier les besoins d'évolution des outils métiers.\nÊtre le relais entre les Data Centres et les équipes CIO.\nVotre futur impact\nDans 6 mois, vous aurez…\nPris en main votre écosystème et développé votre réseau international.\nFiabilisé les principaux reportings projets et performance.\nIdentifié les principaux leviers d'amélioration.\nLancé vos premières actions concrètes.\nDans 1 an, vous maîtriserez…\nLe pilotage de projets et NPI internationaux.\nLe pilotage de la performance des Data Centres.\nLes processus et standards opérationnels.\nLa conduite de projets d'amélioration et de transforma\nCompétences requises\nExpérience en gestion de projets et coordination transverse.\nMaîtrise d'outils comme Jira, Microsoft Project ou équivalents.\nConnaissance des méthodes Agile / Scrum / Kanban.\nSolides capacités d'analyse, de reporting et de planification.\nCapacité à gérer plusieurs sujets et priorités simultanément.\nExcellente communication et capacité à fédérer sans lien hiérarchique.\nAnglais professionnel.\nC'est un +\nExpérience Data Centre, industriel ou IT.\nExpérience en NPI ou projets internationaux.\nExpérience en amélioration continue / transformation.\nAppétence pour la data et la digitalisation."}, {"id": "op-4ff0f81781c8", "source_id": "4484853370", "source_name": "LinkedIn Emplois", "title": "Chargé de projet exploitation transport (H/F)", "company": "PAPREC", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "La Courneuve (93)", "city_raw": "La Courneuve", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 88, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-30", "posted_fr": "30 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:25Z", "url": "https://www.linkedin.com/jobs/view/4484853370/", "highlights": ["Rejoignez-nous dans une aventure extraordinaire au service de la planète !", "Analyser les processus de planification et d'exploitation actuels;", "Identifier les problématiques terrain et les sources de non-productivité;", "Recueillir les besoins des exploitants et agents de planning;"], "summary_excerpt": "Rejoignez-nous dans une aventure extraordinaire au service de la planète !\nFondé en 1994, Paprec est en France le leader du recyclage et un des grands acteurs européens de la gestion des déchets et de la production d'énergies vertes. Le groupe est détenu majoritairement par la famille Petithuguenin qui a investi massivement en France et à l'international dans ses usines et outils technologiques. Notre raison d'être est d'œuvrer pour une planète verte en faisant de nos déchets la matière première de notre siècle.\nContexte\nDans le cadre de l'amélioration continue de ses activités transport et de sa transformation d", "full_description": "Rejoignez-nous dans une aventure extraordinaire au service de la planète !\nFondé en 1994, Paprec est en France le leader du recyclage et un des grands acteurs européens de la gestion des déchets et de la production d'énergies vertes. Le groupe est détenu majoritairement par la famille Petithuguenin qui a investi massivement en France et à l'international dans ses usines et outils technologiques. Notre raison d'être est d'œuvrer pour une planète verte en faisant de nos déchets la matière première de notre siècle.\nContexte\nDans le cadre de l'amélioration continue de ses activités transport et de sa transformation digitale, l'entreprise recherche un collaborateur chargé d'identifier, analyser, sélectionner et déployer une solution de type TMS permettant d'optimiser la planification des tournées, l'affectation des ressources et la productivité opérationnelle. L'objectif est de compléter les outils métiers existants sans les remplacer.\nMissions principales\nAnalyser les processus de planification et d'exploitation actuels;\nIdentifier les problématiques terrain et les sources de non-productivité;\nRecueillir les besoins des exploitants et agents de planning;\nRéaliser une veille et un benchmark des solutions TMS et d'optimisation de tournées;\nConstruire les cahiers des charges fonctionnels;\nParticiper aux consultations et aux échanges avec les éditeurs;\nOrganiser et piloter les phases de test (POC);\nAccompagner le paramétrage et le déploiement de la solution retenue;\nAssurer le suivi des indicateurs de performance et du retour sur investissement;\nAccompagner la conduite du changement auprès des utilisateurs;\nAnalyser les données d'exploitation et identifier les gains potentiels.\nMissions secondaires\nAssurer ponctuellement le remplacement des agents de planning en cas d'absence ou de surcharge d'activité;\nParticiper à l'élaboration et à l'ajustement des tournées;\nAffecter les moyens humains et matériels nécessaires à l'exploitation;\nContribuer à la continuité de service de l'agence.\nBac +3 à Bac +5 en Transport, Logistique, Supply Chain, Gestion de Projet ou Systèmes d'Information.\nPremière expérience réussie dans le transport, la logistique ou l'exploitation.\nUne expérience sur un TMS ou un projet d'amélioration opérationnelle constitue un atout.\nBonne compréhension des enjeux d'exploitation transport.\n orm of choice. At Adyen, everything we do is engineered for ambition.\nFor our teams, we create an environment with opportunities for our people to succeed, backed by the culture and support to ensure they are enabled to truly own their careers. We are motivated individuals who tackle unique technical challenges at scale and solve them as a team. Together, we deliver innovative and ethical solutions that help businesses achieve their am", "full_description": "This is Adyen\nAdyen provides payments, data, and financial products in a single solution for customers like Meta, Uber, H&M, and Microsoft - making us the financial technology platform of choice. At Adyen, everything we do is engineered for ambition.\nFor our teams, we create an environment with opportunities for our people to succeed, backed by the culture and support to ensure they are enabled to truly own their careers. We are motivated individuals who tackle unique technical challenges at scale and solve them as a team. Together, we deliver innovative and ethical solutions that help businesses achieve their ambitions faster.\nProject Operations Specialist\nProject Operations Specialists drive the successful implementation of payment, platform, and banking solutions for our customers, ensuring a seamless, high-quality experience every step of the way.\nIn this role, you will work closely with customers and internal teams to coordinate project activities, support operational execution, and help ensure successful rollouts on Adyen’s platform. You will apply and expand your expertise in project delivery, stakeholder coordination, operational processes, and Adyen’s products.\nWhat You’ll Do\nManage customer implementation projects from onboarding through go-live, taking ownership for project progress, stakeholder alignment, and successful delivery.\nCoordinate tasks, timelines, and follow-ups across internal and external stakeholders;\nWork closely with customer project and technical teams to support smooth rollouts;\nGuiding merchants on implementation best practices and helping them make informed rollout decisions.\nIndependently prepare for, participate in, and run customer meetings, ensuring clear actions, ownership, and next steps.\nSupport scalable operational handovers and business-as-usual setup after go-live;\nTroubleshoot operational issues and collaborate with internal teams to resolve blockers;\nBuild foundational expertise across Adyen’s products, operational processes, and project delivery methodologies;\nContribute operational feedback to improve project execution and customer experience.\nWho You Are\nExperienced in project coordination or delivery, operations, customer-facing roles, or technical project environments;\nStrong organizational and communication skills with attention to detail;\nComfortable managing multiple priorities in a fast-paced environment;\nCustomer-focused mindset with strong collaboration skills;\nInterested in technical systems, operational processes, and project delivery;\nAble to work effectively with international and cross-functional teams;\nFluency in French and English required. Additional European languages are a plus;\nWillingness to travel domestically and internationally where required.\nOur Diversity, Equity and Inclusion commitments\nOur unique approach is a product of our diverse perspectives. This diversity of backgrounds and cultures is essential in helping us maintain our momentum. Our business and technical challenges are unique, and we need as many different voices as possible to join us in solving them - voices like yours. No matter who you are or where you’re from, we welcome you to be your true self at Adyen.\nStudies show that women and members of underrepresented communities apply for jobs only if they meet 100% of the qualifications. Does this sound like you? If so, Adyen encourages you to reconsider and apply. We look forward to your application!\nWhat’s next?\nEnsuring a smooth and enjoyable candidate experience is critical for us. We aim to get back to you regarding your application within 5 business days. Our interview process tends to take about 4 weeks to complete, but may fluctuate depending on the role. Learn more about our hiring process here. Don’t be afraid to let us know if you need more flexibility.\nThis role is based out of our Paris office. We are an office-first company and value in-person collaboration; we do not offer remote-only roles.\nOnly applications submitted in English language will be considered."}, {"id": "op-3c92d405f874", "source_id": "6107420004", "source_name": "Mirakl Careers", "title": "Junior Workplace Experience Coordinator", "company": "Mirakl", "logo_url": "", "sector": "Marketplace & E-Commerce Supply SaaS", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris, France", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 2, "exp_label": "2–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 85, "match_tags": ["Ouverture Tech & Coordination projet", "Devis & Prestataires"], "posted_iso": "2026-11-04", "posted_fr": "4 Novembre 2026", "verified_at_iso": "2026-11-04T12:38:25Z", "url": "https://job-boards.greenhouse.io/mirakl/jobs/6107420004", "highlights": ["Founded in 2012, Mirakl has been at the forefront of marketplace innovation, empowering every business to compete in the platform economy.", "For more information, visit www.mirakl.com.", "🗓️ Founded in 2012 | Member of French Tech Next40", "👥 750+ employees in 9 offices worldwide: Paris, Barcelona, Bordeaux, Boston, London, Munich, New York, Sydney, Tokyo"], "summary_excerpt": "About Mirakl:\nFounded in 2012, Mirakl has been at the forefront of marketplace innovation, empowering every business to
