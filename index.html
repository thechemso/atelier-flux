<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Sélection vérifiée d'opportunités CDI, CDD et Graduate Programs à Paris, en Seine-Saint-Denis (93), en Île-de-France et en télétravail complet : Logistique d'œuvres d'art, Supply Chain et Opérations/Projets." />
  <title>ATELIER // FLUX — Opportunités Logistique d'Art, Supply Chain &amp; Projets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-ground: #F6F5F0;
      --bg-sheet: #FFFFFF;
      --bg-muted: #ECEAE2;
      --bg-hover: #F2F0E8;
      --bg-selected: #FBF4F0;

      --ink-950: #151513;
      --ink-700: #3D3C38;
      --ink-500: #66645E;
      --ink-400: #8C8981;

      --rule-light: #E4E1D8;
      --rule-strong: #C9C5B9;

      /* Pole 1: Fine Art & Exhibition Regie (Terracotta Crate Stencil) */
      --art-700: #AD3E1D;
      --art-600: #C24924;
      --art-100: #FCEEE9;
      --art-200: #F3D1C6;

      /* Pole 2: Supply Chain, Transit & Procurement (Maritime Petrol) */
      --supply-700: #184A66;
      --supply-100: #E9F2F7;
      --supply-200: #C6DDEA;

      /* Pole 3: Tech & Project Operations (Mineral Sage) */
      --ops-700: #245740;
      --ops-100: #EAF4EF;
      --ops-200: #C4DFD1;

      /* Salary & Status Accents */
      --sal-700: #1D5B3E;
      --sal-100: #E7F5EE;
      --warn-700: #8A5311;
      --warn-100: #FDF3E3;

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-ground);
      color: var(--ink-950);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle archival paper texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    a { color: inherit; }

    /* ---------------- MASTHEAD ---------------- */
    .masthead {
      background: var(--bg-sheet);
      border-bottom: 1px solid var(--rule-strong);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .masthead-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.03em;
      color: var(--ink-950);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark .slash {
      color: var(--art-600);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-500);
      padding-left: 12px;
      border-left: 1px solid var(--rule-strong);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-tabs {
      display: inline-flex;
      background: var(--bg-ground);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .view-tab {
      border: none;
      background: transparent;
      padding: 6px 13px;
      border-radius: var(--radius-xs);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-700);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .view-tab.active {
      background: var(--ink-950);
      color: #FFFFFF;
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(255,255,255,0.18);
    }
    .view-tab:not(.active) .tab-count {
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .utility-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .utility-btn:hover {
      background: var(--bg-hover);
      border-color: var(--ink-700);
    }

    /* ---------------- FILTER & SPOTLIGHT BAR ---------------- */
    .control-deck {
      background: var(--bg-ground);
      border-bottom: 1px solid var(--rule-light);
    }

    .control-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .top-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1 1 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 34px 9px 13px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--ink-950);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--ink-950);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--ink-500);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      display: none;
    }

    .spotlight-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .spot-pill {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.14s ease;
    }

    .spot-pill:hover {
      background: var(--bg-hover);
    }

    .spot-pill.art-spot.active {
      background: var(--art-700);
      border-color: var(--art-700);
      color: #FFFFFF;
    }

    .spot-pill.sal-spot.active {
      background: var(--sal-700);
      border-color: var(--sal-700);
      color: #FFFFFF;
    }

    .spot-pill.grad-spot.active {
      background: var(--supply-700);
      border-color: var(--supply-700);
      color: #FFFFFF;
    }

    .sort-select {
      padding: 7px 11px;
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-700);
      cursor: pointer;
      outline: none;
    }

    .filter-strips {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .group-caption {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-right: 4px;
    }

    .filter-chip {
      border: 1px solid var(--rule-light);
      background: var(--bg-sheet);
      color: var(--ink-700);
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .filter-chip:hover {
      border-color: var(--rule-strong);
      background: var(--bg-hover);
    }

    .filter-chip.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
    }

    .filter-chip .c-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      opacity: 0.78;
    }

    .reset-link {
      border: none;
      background: transparent;
      color: var(--art-700);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    /* ---------------- WORKSPACE SPLIT PANE ---------------- */
    .workspace {
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: minmax(370px, 47%) 1fr;
      gap: 18px;
      align-items: start;
    }

    .results-Summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 10px;
      font-size: 12px;
      color: var(--ink-500);
      font-family: var(--font-mono);
    }

    .offer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .offer-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease, background-color 0.14s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .offer-card:hover {
      border-color: var(--rule-strong);
      background: #FCFBF8;
    }

    .offer-card.selected {
      border-color: var(--ink-950);
      background: var(--bg-selected);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pole-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      letter-spacing: 0.01em;
    }

    .pole-ART_LOGISTICS {
      background: var(--art-100);
      color: var(--art-700);
      border: 1px solid var(--art-200);
    }

    .pole-SUPPLY_CHAIN {
      background: var(--supply-100);
      color: var(--supply-700);
      border: 1px solid var(--supply-200);
    }

    .pole-TECH_PROJECT_OPS {
      background: var(--ops-100);
      color: var(--ops-700);
      border: 1px solid var(--ops-200);
    }

    .zone-stamp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
    }

    .card-brand-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .company-logo-box {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 8px;
      background: #FFFFFF;
      border: 1px solid var(--rule-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
      box-shadow: 0 1px 2px rgba(21, 21, 19, 0.04);
    }

    .company-logo-box.logo-lg {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 10px;
      padding: 5px;
    }

    .company-logo-box.logo-sm {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      padding: 3px;
    }

    .company-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .company-monogram {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.02em;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-lg .company-monogram { font-size: 17px; }
    .logo-sm .company-monogram { font-size: 10.5px; }

    .mono-ART_LOGISTICS { background: var(--art-100); color: var(--art-700); }
    .mono-SUPPLY_CHAIN { background: var(--supply-100); color: var(--supply-700); }
    .mono-TECH_PROJECT_OPS { background: var(--ops-100); color: var(--ops-700); }

    .card-brand-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink-950);
    }

    .card-company {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-700);
    }

    .card-bottom-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px solid var(--bg-muted);
    }

    .meta-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mono-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      background: var(--bg-ground);
      color: var(--ink-700);
      border: 1px solid var(--rule-light);
    }

    .salary-pill-yes {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      background: var(--sal-100);
      color: var(--sal-700);
    }

    .salary-pill-no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-400);
    }

    .status-dot-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--ink-950);
      color: #FFFFFF;
    }

    /* ---------------- DETAIL READING PANE ---------------- */
    .detail-pane {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-md);
      position: sticky;
      top: 68px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding: 24px 26px;
    }

    .detail-header {
      border-bottom: 1px solid var(--rule-light);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .detail-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.24;
      color: var(--ink-950);
      margin-bottom: 6px;
    }

    .detail-company-line {
      font-size: 14.5px;
      color: var(--ink-700);
      font-weight: 500;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .primary-apply-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink-950);
      color: #FFFFFF;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13.5px;
      transition: background 0.14s ease;
    }
    .primary-apply-btn:hover {
      background: var(--art-700);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .spec-cell {
      background: var(--bg-ground);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .spec-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-500);
      margin-bottom: 3px;
    }

    .spec-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-950);
    }

    .spec-val.sal-highlight {
      color: var(--sal-700);
    }

    .spec-val.sal-muted {
      color: var(--ink-500);
      font-weight: 500;
    }

    /* Pipeline action bar inside fiche */
    .pipeline-box {
      background: #FAF9F5;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .pipeline-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 8px;
    }

    .pipeline-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pipe-btn {
      border: 1px solid var(--rule-strong);
      background: var(--bg-sheet);
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .pipe-btn:hover { background: var(--bg-hover); }

    .pipe-btn.active {
      background: var(--ink-950);
      border-color: var(--ink-950);
      color: #FFFFFF;
      font-weight: 600;
    }

    .pipe-btn.hide-btn.active {
      background: #8B2626;
      border-color: #8B2626;
      color: #FFFFFF;
    }

    .note-area {
      width: 100%;
      min-height: 58px;
      padding: 8px 10px;
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-xs);
      background: var(--bg-sheet);
      font-size: 12.5px;
      resize: vertical;
      outline: none;
    }
    .note-area:focus { border-color: var(--ink-700); }

    .match-tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .match-tag {
      font-size: 11.5px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--bg-muted);
      color: var(--ink-700);
    }

    .section-subtitle {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-700);
      margin: 16px 0 8px;
    }

    .highlights-list {
      padding-left: 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--ink-700);
      font-size: 13.5px;
    }

    .desc-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-700);
      white-space: pre-line;
    }

    .empty-state {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 40px 24px;
      text-align: center;
      color: var(--ink-500);
    }

    /* ---------------- KANBAN SUIVI VIEW ---------------- */
    .kanban-wrap {
      display: none;
    }
    .kanban-wrap.active {
      display: block;
    }

    .kanban-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .kanban-col {
      background: var(--bg-muted);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-md);
      padding: 12px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13.5px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .k-card {
      background: var(--bg-sheet);
      border: 1px solid var(--rule-light);
      border-radius: var(--radius-sm);
      padding: 11px 12px;

75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Tableaux de bord & Coûts"], "posted_iso": "2025-07-29", "posted_fr": "29 Juillet 2025", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://jobs.lever.co/convelio/7375dd4f-0c49-40b2-8d62-a153e4240280", "highlights": ["Our mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.", "We currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.", "You'll be managing the shipment end to end -- from customer interation, quoting, booking the shipment until final delivery, overseeing the whole project from start to finish for the clients in your portfolio.", "Manage incoming customers requests, including quotes & use of our pricing algorithm."], "summary_excerpt": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe curren", "full_description": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.\n🎩 Your Role:\nWe are looking for a high-energy, results-driven, team-oriented Fine Art Shipping coordinator to join our rapidly-growing team Operations team to help us extend our success and keep our clients happy! You will be the key point of contact for both our customers and our transport partners.\nYou'll be managing the shipment end to end -- from customer interation, quoting, booking the shipment until final delivery, overseeing the whole project from start to finish for the clients in your portfolio.\n✏️ What you'll do:\n- Manage incoming customers requests, including quotes & use of our pricing algorithm.\n- Follow the customers shipments and proactively update them on latest evolutions.\n- Develop your own customers relationships and guarantee Convelio's reactivity and level of service.\n- Communicate with the 3PL to fix thousands of different issues every day, from booking white glove handlers to airlines.\n- Suggest improvements in operational processes within the Operations team.\n- Contribute to improvements hand in hand with the tech team on our current and future (very!) sexy platforms and products.\n🧑‍🎨 Your profile:\n- You have a first experience in Freight Forwarding and a desire to develop your customer care skills.\n- You are positive, curious, self-motivated and hands-on\n- You are an excellent learner and have the desire to adapt to new concepts and technologies\n- You are comfortable working with numbers (you’ll need to handle quotes for our customers!)\n- You are detail-oriented, you have strong organizational skills and are disciplined in daily activity planning (ability to manage tightly, over time, a large quantity of information)\n- You enjoy working in a challenging, fast-paced, target-driven and team-oriented environment\n- You are fluent in French and English, you have excellent written and verbal communication skills.\n🌍 What we offer:\n- An opportunity to be part of a fast-growing and innovative company that is transforming the art logistics industry.\n- Work from our new office in Le Bourget in the same building as our warehouse, to be close to our operations.\n- Flexible remote policy (up to 3 days per week) to accommodate a healthy work-life balance.\n- A challenging and fulfilling role with a high level of autonomy and responsibility in managing operations for art shipments.\n- Develop a strong bedrock of logistics and art market knowledge to leverage in your new role through Convelio’s onboarding program.\n- A supportive and dynamic work environment, where your ideas and initiatives are valued.\n- Continuous learning and development opportunities to enhance your professional growth in the art logistics domain.\n⚙️ The hiring process:\n- First phone and video call with a Talent Acquisition team member\n- Video interview with a Team Lead\n- Case study and debrief with our Head of Operations\n- Final team fit interview\n---------------------\nLearn more...\n---------------------\nEqual Employment Opportunity employer\nConvelio is proud to be an Equal Employment Opportunity employer. We are committed to equal opportunities based upon race, , colour, national origin, gender (including pregnancy, childbirth, or related medical conditions), sexual orientation, gender identify, gender expression, age, status as a protected veteran, status as an individual with a disability, or other applicable legally protected characteristics. We carefully hire the best talent we can find, which means actively seeking diversity of beliefs, backgrounds, education, and ways of thinking. We are passionate about building an inclusive culture where diversity is celebrated and leveraged to create better design and business decisions."}, {"id": "op-c2695d2a61c9", "source_id": "36dfe7b6-c43f-4a04-82bb-e791456a3d55", "source_name": "Convelio Careers", "title": "Declarant.e Douane", "company": "Convelio", "logo_url": "", "sector": "Logistique & Transport d'Œuvres d'Art (ArtTech)", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Le Bourget (93)", "city_raw": "Le Bourget, Île-de-France", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Flux internationaux"], "posted_iso": "2026-06-09", "posted_fr": "9 Juin 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://jobs.lever.co/convelio/36dfe7b6-c43f-4a04-82bb-e791456a3d55", "highlights": ["Our mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.", "We currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.", "Assist with verification of the information and documents needed for customs declaration", "Ensure compliance with customs regulations"], "summary_excerpt": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe curren", "full_description": "🎨 Who Are We?\nConvelio is a licensed freight forwarding startup evolving at the intersection of Tech, Logistics and the Art World. The startup specialises in the global shipping & storage of high-end goods: paintings, sculptures, basically any valuable or bulky merchandise, alongside market leading SaaS technology to solve the problems that Registrars and Art Operations professionals face today.\nOur mission is to become a tech-driven company in a traditional industry, and therefore make the shipping & storage of bulky and valuable items as easy as possible by providing an online and seamless experience.\nWe currently serve a wide range of customers from art galleries, antique dealers, auction houses, online platforms to interior designers.\n🎩 Your Role:\nAs a Customs Declarant at Convelio in the EU Operations department, you will play a pivotal role in shaping the future of art logistics. With your unique skill set and passion for innovation, you will contribute to our mission of revolutionizing the industry.\n✏️ What you'll do:\n- Assist with verification of the information and documents needed for customs declaration\n- Ensure compliance with customs regulations\n- Provide accurate and timely data entry into our operating system\n- Gather all of the documentation to apply for customs procedures or formalities\n- Process these requests either directly or through agents : request export or import customs declaration, launch applications for customs formalities, etc.\n- Make sure that our customs processes are conducted in a timely manner, and well-documented\n- Keep our operations teams and our clients informed on the status of all of these processes\n🧑‍🎨 Your profile:\nAt Convelio, we value diversity and believe in giving opportunities to talented individuals from a variety of backgrounds. We do not want to limit the potential of exceptional candidates by imposing a long list of requirements. However, to succeed in this role, you should possess the following attributes:\n- You are fluent in French and English\n- You have formal training and a first experience as a customs declarant\n- General knowledge of customs regulations, procedures, and document requirements for international transport (familiarity with art specificities desired, but not mandatory)\n- You have a strong interest in operations\n- You have great attention to detail, and good organizational skills\n- You are enthusiastic, ambitious, self-motivated, and hands-on\n- You enjoy working in a challenging fast-paced, target-driven, and team-oriented environment\n- You are comfortable learning and adapting to new concepts and new tools\n- You have excellent written and oral communication skills, and aim to simplify complex customs problems into accessible information\n🌍 What we offer:\n- An opportunity to be part of a fast-growing and innovative company that is transforming the art logistics industry.\n- A challenging and fulfilling role with a high level of autonomy and responsibility in managing customs operations for art shipments.\n- A supportive and dynamic work environment, where your ideas and initiatives are valued.\n- Flexible teleworking policy (up to 3 days per week) to accommodate a healthy work-life balance.\n- Continuous learning and development opportunities to enhance your professional growth in the art logistics domain.\n---------------------\nLearn more...\n---------------------\nEqual Employment Opportunity employer\nConvelio is proud to be an Equal Employment Opportunity employer. We are committed to equal opportunities based upon race, , colour, national origin, gender (including pregnancy, childbirth, or related medical conditions), sexual orientation, gender identify, gender expression, age, status as a protected veteran, status as an individual with a disability, or other applicable legally protected characteristics. We carefully hire the best talent we can find, which means actively seeking diversity of beliefs, backgrounds, education, and ways of thinking. We are passionate about building an inclusive culture where diversity is celebrated and leveraged to create better design and business decisions."}, {"id": "op-b6bd0f805bc1", "source_id": "4476687199", "source_name": "LinkedIn Emplois", "title": "Coordinateur logistique Fine Art", "company": "GROUP ESI", "logo_url": "", "sector": "Œuvres d'Art, Régie & Patrimoine", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Louvres (95)", "city_raw": "Louvres", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Devis & Prestataires", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-14", "posted_fr": "14 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4476687199/", "highlights": ["Référence dans le transport d'œuvres d'art, ESI Fine Art propose des solutions logistiques sur mesure pour les professionnels du marché de l'art.", "Basés à Louvres (95), nous recherchons un Coordinateur transport logistique H/F.", "Recueillir les besoins et définir les spécificités techniques et logistiques (volumes, contraintes, lieux d’intervention, typologie des œuvres et du mobilier),", "Elaborer et suivre le planning des opérations en coordination avec les équipes transport, manutention et installation,"], "summary_excerpt": "Référence dans le transport d'œuvres d'art, ESI Fine Art propose des solutions logistiques sur mesure pour les professionnels du marché de l'art.\nBasés à Louvres (95), nous recherchons un Coordinateur transport logistique H/F.\nLe Coordinateur assure le lien opérationnel entre le client et les équipes internes (transport, manutention, installation). Il garantit la bonne exécution des projets, de la planification a l’installation finale de l'opération, des œuvres et objets d’art.\nMissions principales\nGestion de projet :\nRecueillir les besoins et définir les spécificités techniques et logistiques (volumes, contraint", "full_description": "Référence dans le transport d'œuvres d'art, ESI Fine Art propose des solutions logistiques sur mesure pour les professionnels du marché de l'art.\nBasés à Louvres (95), nous recherchons un Coordinateur transport logistique H/F.\nLe Coordinateur assure le lien opérationnel entre le client et les équipes internes (transport, manutention, installation). Il garantit la bonne exécution des projets, de la planification a l’installation finale de l'opération, des œuvres et objets d’art.\nMissions principales\nGestion de projet :\nRecueillir les besoins et définir les spécificités techniques et logistiques (volumes, contraintes, lieux d’intervention, typologie des œuvres et du mobilier),\nElaborer et suivre le planning des opérations en coordination avec les équipes transport, manutention et installation,\nPiloter les différentes étapes : emballage, transport (aérien, maritime, routier), déballage, mise en place, installation et accrochage,\nAssurer un suivi fluide du projet et être l'interlocuteur privilégié du client tout au long du processus.\nCoordination interne et externe :\nCollaborer étroitement avec les équipes opérationnelles, les emballeurs, installateurs et le chargé de projet du cabinet d’architecte,\nGarantir une communication claire et continue entre les parties prenantes : clients, partenaires, prestataires, équipes internes,\nGérer les aspects administratifs du projet : devis, bons de transport, assurances, formalités douanières si nécessaire.\nSuivi qualité et satisfaction client :\nContrôler la qualité des prestations et la conformité des installations réalisées,\nGérer les imprévus, risques et litiges avec réactivité, professionnalisme et diplomatie,\nRéaliser un bilan de fin de projet : retour d’expérience, axes d’amélioration, évaluation de la satisfaction client.\nGestion de la facturation :\nRéception et traitement des factures fournisseurs : vérification de la conformité, validation avec les équipes concernées, transmission aux services comptables,\nEmission des factures clients : collecte des éléments nécessaires (devis, bons d’intervention, heures, prestations réalisées), préparation et envoi des factures selon les délais établis,\nSuivi et relances : assurer le suivi des paiements, relancer les clients en cas d’impayés ou de retard, maintenir un reporting clair et a jour,\nCoordination interne : travailler avec la comptabilité et les opérations pour garantir la cohérence entre prestations réalisées et éléments facturés.\nProfil recherché\nFormation & Expérience\nBac+3 à Bac+5 en gestion de projet, logistique, arts appliqués ou architecture d’intérieur,\nExpérience significative en coordination de projets, idéalement dans le secteur culturel, muséal, du transport spécialisé ou de l'aménagement haut de gamme.\nCompétences :\nMaitrise des outils de gestion de projet et de planification,\nConnaissance du transport et de la manipulation d’œuvres d’art (normes, emballage, sécurité),\nSensibilité à l’univers de la décoration, du design et du patrimoine artistique,\nMaitrise des processus de facturation et aisance avec les outils administratifs et logiciels internes,\nOrganisation, rigueur et sens du détail,\nEsprit de service, autonomie et capacité à évoluer dans un environnement exigeant,\nExcellente communication et aisance relationnelle.\nTous nos postes sont ouverts aux personnes en situation de handicap."}, {"id": "op-573b45a8584f", "source_id": "4487209443", "source_name": "LinkedIn Emplois", "title": "Coordinateur Logistique Art", "company": "Carpenters", "logo_url": "", "sector": "Œuvres d'Art, Régie & Patrimoine", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Mitry-Mory (77)", "city_raw": "Mitry-Mory", "family_id": "ART_LOGISTICS", "family_label": "Œuvres d'Art, Régie & Patrimoine", "family_short": "Œuvres d'Art & Régie", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 99, "match_tags": ["Cœur parcours · Œuvres d'art & Régie", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-11-04", "posted_fr": "4 Novembre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4487209443/", "highlights": ["Organise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.", "Coordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.", "Manage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.", "Liaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations."], "summary_excerpt": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operatio", "full_description": "About the Role\nThe Operations & Registrar is a key operational role within the Logistics, Fairs & Exhibitions department. Based primarily Mitry Mory, the position holder is responsible for organising the safe packing, transport, and installation of artworks across CWG’s global operations — from artist studios through to gallery exhibitions, art fairs, and private client deliveries.\nWorking closely with the Global Head of Logistics, Fairs & Exhibitions, the role encompasses end-to-end coordination of shipments, inventory management, condition reporting, customs documentation, and process optimisation. The Operations & Registrar also plays a central role in art fair logistics and HNWI client installations and post-sales, ensuring a luxury-standard delivery experience at every touchpoint.\nDay-to-Day Responsibilities\n1. Packing, Shipping & Transport\nOrganise the safe packing and transport of artworks, negotiating best-value pricing while maintaining the highest standards of artwork safety in transit.\nCoordinate shipments and installations to and from galleries, artist studios, clients, and fair venues — domestically and internationally.\nManage customs documentation, fine art formalities (temporary imports/exports, carnets ATA), insurance certificates, and plus-value declarations.\nLiaise with approved transport suppliers, crating workshops, and installation teams to ensure timely and damage-free operations.\nMonitor and improve shipping lead times; target ≤ 3 weeks from payment and end of production to delivery.\nDevelop direct shipping routes from artist studios to clients/galleries where possible, reducing handling and transit time.\n2. Inventory, Condition Reporting & Data Management\nMaintain accurate shipping records, inventory logs, condition reports, and installation instructions across all CWG databases.\nComplete condition reports (Articheck) within 24 hours of receiving artworks and before any release.\nUpdate Sage X3 records in real time: stock receipts, intercompany transfers, deliveries, and invoicing.\nParticipate in bi-annual full inventories and monthly spot audits; contribute to maintaining stock discrepancy below 2%.\n3. Communication & Process Development\nAct as an operational link between the Logistics department, Production, Artist Studios, Sales, and Gallery teams to ensure fluid, structured communication.\nContribute to developing and documenting standard operating procedures for shipping, packing, installation, and condition reporting.\nParticipate in cross-departmental process improvement initiatives to streamline.\nActively contribute to the mise en place and optimisation of Logistics Department processes and organisation.\n4. Fairs, Exhibitions & HNWI Client Installations\nHandle end-to-end logistics for art fair participation: planning, transport, customs, booth set-up, artwork installation, and de-installation.\nCoordinate with the Fairs & Exhibitions team on retroactive calendars, steering meetings, and cross-departmental milestones.\nManage HNWI client installations with a luxury-standard approach: meticulous planning, white-glove handling, and post-installation follow-up.\nContribute to carbon footprint tracking per fair and material reuse objectives (target 70% reuse rate).\n5. Budget & Cost Control\nParticipate in tracking local logistics budgets and operational expenditure.\nVerify supplier invoices, compare quoted vs. actual vs. invoiced amounts, and flag discrepancies.\nIdentify cost reduction levers in crate production, transport, and storage operations.\nContribute to a monthly budget review meeting with the Global Head of Logistics, Fairs & Exhibitions.\n6. Client Satisfaction\nDrive improved satisfaction by streamlining communication with Production and increasing direct shipments from artist studios.\nContribute to the design and implementation of a client satisfaction tracking methodology in collaboration with Sales and Production.\nMaintain luxury-standard delivery experiences for all client-facing operations."}, {"id": "op-f5b11415eb65", "source_id": "4482530528", "source_name": "LinkedIn Emplois", "title": "Agent de transit aérien Export", "company": "Yusen Logistics", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "34 000 – 39 000 € brut/an", "has_salary": true, "salary_max_eur": 39000, "affinity_score": 99, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-28", "posted_fr": "28 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4482530528/", "highlights": ["Dans un contexte de forte croissance de notre activité Air Freight liée à de nouveaux contrats stratégiques, nous renforçons notre équipe Export.", "Vous rejoignez une équipe dynamique composée de 8 collaborateurs, au cœur d’un environnement international exigeant et stimulant.", "Rattaché(e) au Responsable Export, vous prenez en charge la gestion complète de dossiers de transit aérien export :", "Gérer et suivre les dossiers export de bout en bout"], "summary_excerpt": "À propos de Yusen Logistics\nYusen Logistics œuvre pour devenir l’entreprise de logistique de supply chain privilégiée à l’échelle mondiale. Notre offre complète est conçue pour créer de meilleures connexions entre les entreprises, les clients et les communautés, grâce à des solutions innovantes de gestion de la supply chain, de commission de transport, d’entreposage et de distribution. En tant qu’entreprise, nous sommes attachés à une culture d’amélioration continue, afin que chacun de nos collaborateurs soit engagé, connecté et créatif pour faire de nous le choix privilégié dans le monde.\nwww.yusen-logistics.com", "full_description": "À propos de Yusen Logistics\nYusen Logistics œuvre pour devenir l’entreprise de logistique de supply chain privilégiée à l’échelle mondiale. Notre offre complète est conçue pour créer de meilleures connexions entre les entreprises, les clients et les communautés, grâce à des solutions innovantes de gestion de la supply chain, de commission de transport, d’entreposage et de distribution. En tant qu’entreprise, nous sommes attachés à une culture d’amélioration continue, afin que chacun de nos collaborateurs soit engagé, connecté et créatif pour faire de nous le choix privilégié dans le monde.\nwww.yusen-logistics.com/\nPrésentation du poste\nDans un contexte de forte croissance de notre activité Air Freight liée à de nouveaux contrats stratégiques, nous renforçons notre équipe Export.\nVous rejoignez une équipe dynamique composée de 8 collaborateurs, au cœur d’un environnement international exigeant et stimulant.\nResponsabilités principales\nRattaché(e) au Responsable Export, vous prenez en charge la gestion complète de dossiers de transit aérien export :\nGérer et suivre les dossiers export de bout en bout\nÊtre l’interlocuteur privilégié des clients (suivi, information, satisfaction)\nCoordonner les opérations avec les équipes internes (Handling, Customer Service, fournisseurs)\nGarantir le respect des délais, des réglementations et de la qualité de service\nOptimiser les flux (groupage, consolidation des envois)\nPré-saisir les données douanières\nGérer les litiges en lien avec le service client\nCe que vous apporterez au poste\nFormation Bac+2 minimum en Transport / Commerce international\nA minima 3 ans d’expérience en transit aérien export (hors alternance)\nAnglais professionnel à l’oral et à l’écrit (échanges réguliers à l’international)\nRéglementation transport aérien & douane\nOutils informatiques (Excel ; idéalement CargoWise)\nGestion des flux internationaux\nAutonomie et proactivité\nRigueur et sens des responsabilités\nEsprit d’équipe et adaptabilité\nMaîtrise des opérations de transit aérien export\nOrientation client et culture du service\nOrganisation et gestion des priorités dans un environnement dynamique\nCe que nous offrons\nPoste basé à Roissy CDG (open space – pas de déplacements)\nCDI – Statut TAM\n37h/semaine\n1 jour de télétravail hebdomadaire\nRémunération : la fourchette salariale pour ce poste est comprise entre 34 000 € et 39 000 € bruts annuels, en fonction de l’expérience et des compétences.\nPourquoi nous rejoindre ?\nChez Yusen Logistics, vous aurez l’opportunité de contribuer à des projets porteurs de sens, de travailler aux côtés de professionnels talentueux et de développer votre carrière dans un environnement qui valorise l’innovation, la responsabilité et la collaboration.\nChez Yusen Logistics, nous comprenons l’intérêt d’utiliser l’IA et d’autres technologies pour accompagner le processus de candidature. Toutefois, nous encourageons les candidats à utiliser ces outils pour enrichir leur candidature, plutôt que pour remplacer leur propre effort et leur authenticité. Lors du processus d’entretien, nous attendons des réponses qui reflètent votre propre expérience, votre réflexion et v adership auront un impact direct sur la satisfacti", "full_description": "- Vous avez obtenu(e) votre diplôme universitaire avant la date de début OU diplomé(e) au cours des 24 derniers mois\n- Vous êtes au minimum titulaire d’une licence (bac+3)\n- Vous disposez d’excellentes capacités de communication en français et en anglais\n- Vous faites preuve de fortes capacités d'analyse et avez le goût pour les données\nEn tant que Responsable d'Équipe Logistique Junior chez Amazon, vous jouerez un rôle clé dans notre mission : permettre à des millions de clients de recevoir leurs commandes à l'heure promise. Chaque jour, vos décisions et votre leadership auront un impact direct sur la satisfaction de nos clients au sein de notre réseau europée\nKey job responsibilities\nVos responsabilités clés\n- Porter au quotidien notre engagement premier - la santé et la sécurité de nos collaborateurs - en veillant au respect des standards et en promouvant une culture de sécurité exemplaire\n- Fédérer et développer une équipe de 20 à 100 collaborateurs aux parcours variés, en créant un environnement de travail motivant où chacun peut s'épanouir et progresser\n- Piloter la performance de votre périmètre et la qualité des processus pour garantir à des millions de clients une expérience exceptionnelle\n- Etre moteur de l'amélioration continue des processus, en vous appuyant sur vos collaborateurs et sur l'analyse des données pour viser l'excellence opérationnelle\nPour cela, vous travaillez en étroite collaboration avec les autres services sur site et au sein de notre réseau logistique\nA day in the life\nJournée type\nChez Amazon, nous avons développé des méthodes de management qui ont fait leurs preuves à l'échelle mondiale. En nous rejoignant, vous bénéficierez d'un parcours d'intégration structuré, de formations à nos standards opérationnels et d’un accompagnement par des managers expérimentés. Ce rôle est une opportunité unique d'apprendre le management de terrain au cœur de nos opérations et de progresser rapidement vers des responsabilités importantes au sein d'Amazon.\nAbout the team\nÀ propos de l’équipe\nSelon votre profil et vos aspirations, vous pourrez évoluer dans l'un des environnements suivants :\n- Centres de distribution (Customer Fulfilment): Ces entrepôts modernes sont le point de départ de notre chaîne logistique. Nos équipes y assurent la réception, le stockage et la préparation des commandes, garantissant une gestion efficace des stocks et une expédition rapide vers nos clients\n- Centres de tri (Amazon Transportation Services): Ces hubs logistiques sont au cœur de notre réseau de distribution. Nos équipes y orchestrent le tri et l'acheminement des colis entre les centres de distribution et les agences de livraison, optimisant les flux pour assurer rapidité et précision\n- Agences de livraison (Amazon Logistics): Ces sites représentent le dernier maillon de notre chaîne logistique, au plus près des clients. Nos équipes y coordonnent les livraisons du dernier kilomètre, travaillant en étroite collaboration avec nos partenaires pour offrir une expérience clients exceptionnelle\nLes postes à pourvoir suivent le rythme des équipes opérationnelles, et vous travaillez en horaires décalés.\n- Stage, alternance ou première expérience en environnement industriel/logistique\n- Expérience en gestion de projet ou en animation d'équipe\n- Maîtrise des outils bureautiques\nAmazon est un employeur engagé pour l'égalité des chances. Nous sommes convaincus qu'une main d'oeuvre diversifée est essentielle à notre réussite. Nous prenons nos décisions de recrutement en fonction de votre expérience et de vos compétences. Nous apprécions votre envie de découvrir, d'inventer, de simplifier et de construire. La protection de votre vie privée et la sécurité de vos données constituent depuis longtemps une priorité absolue pour Amazon. Veuillez consulter notre Politique de Confidentialité pour en savoir plus sur la façon dont nous collectons, utilisons nt\nNégociateur(rice)\nAisance relationnelle\nCe que nous vous offrons :\nUne rémunération motivante, combinant primes individuelles sur objectifs et un dispositif collectif complet (participation, intéressement, épargne salariale) pour partager les succès de l’entreprise.\nUn environnement de travail stimulant et convivial basé sur l’humain et la collaboration.\nUn restaurant d’entreprise subventionné.\nUne mutuelle familiale.\nUn accès aux avantages du CSE (chèques cadeaux, chèques vacances, etc).\nUn service de conciergerie (assistance santé, assistance administrative et juridique, etc).\nEnvie de relever de nouveaux challenges dans un environnement dynamique ?\nVenez écrire votre histoire chez le Leader de la bijouterie en Europe !"}, {"id": "op-080beb9d4f61", "source_id": "4482722412", "source_name": "LinkedIn Emplois", "title": "Agent de Transit Aérien Import/Export (H/F)", "company": "Kuehne+Nagel", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 2, "exp_label": "2–3 ans d'exp.", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-22", "posted_fr": "22 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.linkedin.com/jobs/view/4482722412/", "highlights": ["Ouvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.", "Organiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éve  notre équipe à Tremblay-en-France ! Votre expertise fera toute la différence.\nComment avoir de l'impact\nOuvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.\nOrganiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éventuelles) et suivre le statut des marchandises jusqu’à la livraison.\nÉtablir, vérifier et transmettre l’ensemble de la documentation transport & douane (MAWB, HAWB, certificats, manifeste, compliance, instructions douanières).\nCoordonner les opérations avec les compagnies aériennes, agents overseas, manutentionnaires et transporteurs, pour garantir une fluidité des flux.\nPlanifier et superviser les enlèvements et livraisons, en s’assurant de la conformité des marchandises (DG, particularités cargo).\nGérer les imprévus et litiges (retards, avaries, manquants) en apportant des solutions rapides et en maintenant une communication proactive avec les clients.\nFournir un support client proactif et professionnel, en apportant conseils sur les solutions de transport, coûts, délais et contraintes réglementaires.\nGarantir la satisfaction client par un suivi rigoureux et une gestion transparente de chaque étape du dossier.\nAssurer la facturation, le contrôle des coûts et l’analyse de rentabilité par dossier, en étant capable d’expliquer écarts ou pertes si nécessaire.\nSuivre les indicateurs de performance (OTD, litiges, délais) et respecter les procédures internes qualité et sécurité.\nCe que nous recherchons chez vous\nMinimum Bac+2 en transport, logistique ou filière équivalente.\nMinimum 2 ans d’expérience en fret aérien exigés.\nExcellente connaissance des réglementations aériennes (IATA) et des règles douanières import/export.\nMaîtrise des documents de transport aérien (MAWB, HAWB, certificats, manifeste, etc.).\nSolides compétences en logistique internationale : Incoterms, freight, handling, spécificités cargo.\nEsprit d’équipe, excellent relationnel et sens du service client.\nProactivité, autonomie, adaptabilité et capacité à trouver des solutions alternatives.\nMaîtrise de l’anglais professionnel.\nCe que nous vous proposons\nRejoindre Kuehne+Nagel, c’est s’engager dans une entreprise labellisée Great Place to Work et être prêt(e) à relever les défis du futur. Au-delà de rejoindre une équipe agréable dans un contexte stimulant, nous vous proposons (selon les postes) une rémunération attractive, des primes sur objectifs, un dispositif d’intéressement et participation, des tickets restaurant, des formations tout au long de votre vie chez Kuehne+Nagel, ainsi que des possibilités d’évolution en France et à l’international.\nQui sommes-nous\nLa logistique façonne notre vie quotidienne – des biens que nous consommons, aux soins de santé dont nous avons besoin. Chez Kuehne+Nagel, votre quotidien va au-delà de la logistique ; il accompagne les petits comme les grands moments de tout un chacun à travers le monde.\nEn tant que leader mondial avec une structure solide et avec une vision tournée vers l'avenir, nous offrons un environnement sûr et stable où votre carrière peut avoir un véritable impact. Que nous aidions à livrer des médicaments vitaux, à développer des solutions de transport durables ou à soutenir des associations locales, votre carrière contribuera à bien plus que vous ne l’imaginez.\nNous remercions les cabinets de recrutement pour leur intérêt. Toutefois, nous vous invitons à ne pas soumettre de candidatures non sollicitées. Toute candidature transmise sans accord préalable signé ne pourra être prise en compte, et aucun frais ne sera engagé."}, {"id": "op-7ff7c4d5a398", "source_id": "4479814546", "source_name": "LinkedIn Emplois", "title": "Passenger Car Supply Chain Logistics Specialist", "company": "BYD EUROPE", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONN ssion and want to create positive impact by joining a diverse and dynamic team.\nBYD is a leading, high-tech multinational, based in Shenzhen, China. Operates in four core fields of IT, automotive, new energy, and rail transit and employs over 300,000 people worldwide. As a global pioneer in New Energy Solutions BYD is dedicated to building a zero-emission ecosystem.\nBYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicles, including all-electric cars, all-electric buses, and all-electric forklift trucks.\nBelow Should Be Changed---------------------------------\nAbout BYD France\nBYD France is the French National Sales Company of BYD BV Europe and BYD Company Ltd, a China-based company and a leading global supplier of green energy technologies. BYD France offers a range of electric vehicles, including all-electric cars, buses & forklifts. BYD is expanding its operations in France to support a growing portfolio of New Electric Vehicle Passenger car and LCVs projects.\nKey Responsibilities:\n1/Coordinate outbound loading & shipment of passenger cars, closely track vessel schedules, ocean freight status and ETA updates for vehicle consignments. 2/Manage daily collaboration and performance evaluation for European local logistics vendors (ocean forwarder, port operator, yard agent, customs broker), push for service improvement and cost‑efficiency. 3/Full lifecycle monitoring of port arrival, customs declaration & clearance progress; proactively identify document risks, resolve clearance holds and avoid delivery delays. 4/Troubleshoot on‑site logistics incidents including cargo damage, port congestion, yard stock discrepancy, transshipment anomalies; drive cross‑party problem closure with vendors and internal stakeholders. 5/Maintain shipment & inventory data accuracy, produce regular logistics status reports, highlight risks and propose countermeasures to leadership. 6/Align with internal planning, sales and quality teams to match regional delivery KPIs, optimize logistics flow and continuously improve end‑to‑end vehicle delivery reliability.\nSkills, Qualifications, and Experience Required:\nBachelor’s degree in Logistics, Supply Chain, Business Administration, or a related field.\n1–3 years of experience in logistics, transportation, or supply chain operations.\nExperience in automotive logistics is a plus.\nProficiency in Microsoft Excel and logistics reporting tools.\nStrong organizational, communication, and problem-solving skills.\nAbility to work in a fast-paced international environment.\nFluent in French and English; Chinese is a plus."}, {"id": "op-a5bd9761a1f1", "source_id": "83850272", "source_name": "HelloWork", "title": "Assistant·e Coordinateur Transport - CDD H/F", "company": "VENTE UNIQUE.COM", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDD", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris 19e (75)", "city_raw": "Paris 19e - 75", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "26 000 – 30 000 € brut/an", "has_salary": true, "salary_max_eur": 30000, "affinity_score": 92, "match_tags": ["Supply Chain & Pilotage des flux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-29", "posted_fr": "29 Octobre 2026", "verified_at_iso": "2026-11-04T12:38:24Z", "url": "https://www.hellowork.com/fr-fr/emplois/83850272.html", "highlights": ["Nous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.", "Tu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).", "🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.", "1. Gérer les incidents de livraison"], "summary_excerpt": "Les missions du poste\nDescriptif du poste :\nNous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.\nTu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).\n🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.\nTes missions :\n1. Gérer les incidents de livraison\n* Traiter les réclamations et inci", "full_description": "Les missions du poste\nDescriptif du poste :\nNous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.\nTu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).\n🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.\nTes missions :\n1. Gérer les incidents de livraison\n* Traiter les réclamations et incidents clients liés aux livraisons (retards, pertes, dommages, etc.)\n* Coordonner avec les transporteurs et les équipes internes pour résoudre les problèmes rapidement et efficacement\n2. Suivre et communiquer\n* Assurer un suivi proactif des incidents jusqu'à leur résolution complète\n* Informer régulièrement le service client de l'état d'avancement des réclamations\n3. Analyser et améliorer en continu\n* Analyser les incidents pour identifier les causes récurrentes et proposer des solutions d'amélioration\n* Participer à l'élaboration de rapports et de tableaux de bord pour suivre les performances et les indicateurs clés\n4. Travailler main dans la main avec les équipes\n* Collaborer étroitement avec les équipes logistiques, commerciales et du service client pour assurer une gestion fluide des incidents\n* Participer aux réunions de coordination et apporter un support opérationnel aux équipes sur le terrain\n5. Vérifier la facturation et gérer les litiges\n* Vérifier la facturation des livraisons pour s'assurer de l'exactitude des coûts et des services facturés\n* Gérer les litiges liés aux transports, en coordination avec les services financiers et juridiques de l'entreprise\nTA TEAM\nGwendoline sera ta manager pour cette nouvelle aventure 🤝 Tu seras aussi accompagné.e de toute l'équipe Transport/Logistique, composée de personnes aussi bienveillantes les unes que les autres 😉\nPrêt.e à rejoindre une équipe dynamique qui t'écoutera vraiment, laissera de la place à tes idées et te confiera des responsabilités dès le premier jour ? 💪\nLe profil recherché\nProfil recherché :\nTu es rigoureux.se, organisé.e et tu as une forte capacité d'analyse et de synthèse. Une première expérience en B2B, logistique/transport ou gestion de flux est appréciée. Une expérience pure en transport n'est pas obligatoire si tu maîtrises la logique de flux et/ou la résolution de problèmes. Les profils issus d'alternance sont également les bienvenus.\nCôté compétences, on attend de toi :\n* Une maîtrise d'Excel et des tableurs, avec une aisance pour l'analyse de fichiers de données\n* Des notions de base en transport/logistique\n* Des connaissances en géographie française (et idéalement européenne)\n* Des bases en Anglais (niveau B1, l'usage de Google Translate est accepté pour la gestion du flux)\nEt côté personnalité :\n* De la rigueur, de l'organisation et une bonne gestion des priorités\n* De la réactivité, une bonne capacité d'adaptation et un esprit ouvert : le poste comprend des imprévus et demande d'identifier et de résoudre rapidement les problèmes de livraison\n* Du dynamisme et de la proactivité, avec l'envie de t'étoffer et d'élargir ton périmètre à la gestion d'autres transporteurs\n* Le sens du travail en équipe et de l'entraide\n* Une capacité à accepter la critique\nNous avons besoin de quelqu'un qui matche avec nos valeurs : performance et convivialité !\nAussi, on espère que tu as un fort attrait pour l'univers du e-commerce et de l'aménagement de la maison ! 🛍️\nLe processus de recrutement :\nIl se déroule en 3 étapes principales :\n1- Tri des CV par les RH\n2- Entretien RH avec Nolane, Talent Acquisition Specialist (motivation, personnalité)\n3- Entretien Manager avec Gwendoline (Romain, notre responsable du pôle SEU, est susceptible d'être également présent)\nConditions & Avantages :\n* Type de contrat : CDD 12 mois\n* À pourvoir dès que possible\n* Rémunération selon profil\n* 1 jour de télétravail par semaine\n* 6 semaines de congés payés par an\n* Convention collective applicable : Négoce de l'ameublement 1880\n* Mutuelle Alan (70% à la charge de la société)\n* Swile : carte Tickets restaurant (50% à la charge de l'entreprise)\n* Participation à l'abonnement des transports en commun (50% à la charge de l'entreprise)\n* Pour les minis de la VU team, des places en crèche sont disponibles grâce aux Petits Chaperons Rouges ! 🧸\n* Dog friendly 🐶\n* Localisation : Poste basé à Clavel métro ligne 11, 5, 2, 7B ou bus ligne 20, 26, 71 🚇\nVente-unique.com est un employeur garantissant l'égalité des chances, ce qui signifie que nous nous engageons à ne pas discriminer les employés en fonction de leurs origines, de la , du sexe, de l'origine nationale, de l'âge, du handicap ou des informations génétiques. Si des aménagements raisonnables sont nécessaires pour le processus, n'hésitez pas à en discuter avec l'équipe recrutement.\nBienvenue chez VENTE UNIQUE.COM\nQui sommes-nous ?\nPionnier du e-commerce mobilier et décoration depuis 2006, Vente-unique.com s'est imposé comme une référence dans 16 pays grâce à son esprit visionnaire et son exigence de performance.\nAnnée après année, nous élargissons notre univers pour devenir un groupe en expansion continue dans l'équipement de la maison :\n* Avec la reprise de la marque Habitat en 2024, icône du design accessible,\n* Avec notre marketplace, qui connecte des millions de produits à nos clients,\n* Et avec nos solutions de fulfillment, qui garantissent une logistique rapide et fiable.\nDerrière cette aventure, une équipe jeune, internationale et passionnée réunit tous les métiers en interne (IT, Marketing, achats, logistique, service client...). Cette organisation intégrée nous permet de rester agiles, innovants et performants.\n👉 Chez Vente-unique.com, tu trouveras la solidité d'une entreprise cotée en bourse, allée à l'énergie d'un acteur e-commerce en pleine croissance.\n🎯 Notre mission : offrir du bonheur à tous les étages, en rendant le design et le confort accessibles à chacun.\nAvantages :\n* Tickets restaurants\n* Mutuelle\n* PEE\n* 50% Transports"}, {"id": "op-bfa8b3d55679", "source_id": "4483472237", "source_name": "LinkedIn Emplois", "title": "Agent de Transit Route - H/F - Survilliers (95) – CDI", "company": "Expeditors", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Survilliers (95)", "city_raw": "Survilliers", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "33 800 € brut/an", "has_salary": true, "salary_max_eur": 33800, "affinity_score": 92, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-30", "posted_fr": "30 Octobre 2026", "verified_at_iso": "2026-11-04T
