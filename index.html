 L'utilisation d'outils informatiques métier fait partie du quotidien.\nLe poste convient à des personnes appréciant :\nUn Anglais courant à l'écrit comme à l'oral impératif (Niveau C1-C2).\nla gestion de dossiers multiples\nl'organisation et la rigueur opérationnelle\nle travail en coordination avec différents interlocuteurs\nLes parcours variés ou évolutifs sont considérés dès lors que les compétences opérationnelles sont présentes.\nBienvenue chez Mathez Transports Internationaux\nTransitaire international né à Nice en 1950, Mathez Transports Internationaux a développé des compétences spécifiques dans les domaines du yachting, des arts, du spectacle, des salons & congrès et de la TVA.\nCommissionnaire de transport aérien, maritime et multimodal, représentant en douane agréé OEA-Full, agent maritime, spécialiste TVA, nous offrons aux entreprises françaises qui travaillent à l'international un service sur mesure, des compétences dédiées et un vaste réseau international.\nInfos complémentaires\nConditions :\nCDI - 39h/semaine avec 11 RTT\nStatut employé\nPrise de poste : dès que possible\nRémunération selon profil\nAvantages :\nPrime de participation\nPrime de fin d'année\nCSE laissant place à des réductions de la vie quotidienne (Courses, cinéma, voyages ...)\nEnvironnement de travail stable et structuré\nValeurs:\nL'entreprise s'appuie sur un fonctionnement concret et collaboratif.\nLe travail s'effectue dans un cadre où l'entraide entre équipes et la transmission des compétences font partie du quotidien.\nProcessus de recrutement:\n1 entretien téléphonique RH\n1 entretien avec le manager opérationnel\nUn retour est apporté systématiquement lorsque vous intégrez le processus de recrutement\nCandidature:\nPostulez directement via : https://www.mathezfreight.com/fr/profil/emploi/\nPartage:\nCette opportunité peut intéresser votre réseau ? N'hésitez pas à la partager.\nLes étapes de recrutement\nLes étapes de recrutement peuvent varier selon l'offre à laquelle vous postulez.\nSélection des CV et transmission aux managers opérationnel pour sélection\n1er entretien RH dans le but de faire un compte rendu aux managers\n2ème entretien opérationnel avec les managers ou direction\nRetours systématiques aux candidats reçus\nVoir moins"}, {"id": "op-7ce96fe38c08", "source_id": "10521849", "source_name": "Amazon Logistics & Tech", "title": "Responsable d'équipe logistique junior", "company": "Amazon", "logo_url": "", "sector": "Logistique, Supply Chain & Tech", "contract_type": "Graduate Program", "is_graduate_program": true, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Graduate · Bac+3 OK", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 95, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Parcours Graduate"], "posted_iso": "2026-08-31", "posted_fr": "31 Août 2026", "verified_at_iso": "2026-11-11T05:50:49Z", "url": "https://www.amazon.jobs/en/jobs/10521849/responsable-d-equipe-logistique-junior", "highlights": ["Vous avez obtenu(e) votre diplôme universitaire avant la date de début OU diplomé(e) au cours des 24 derniers mois", "Vous êtes au minimum titulaire d’une licence (bac+3)", "Vous disposez d’excellentes capacités de communication en français et en anglais", "Vous faites preuve de fortes capacités d'analyse et avez le goût pour les données"], "summary_excerpt": "- Vous avez obtenu(e) votre diplôme universitaire avant la date de début OU diplomé(e) au cours des 24 derniers mois\n- Vous êtes au minimum titulaire d’une licence (bac+3)\n- Vous disposez d’excellentes capacités de communication en français et en anglais\n- Vous faites preuve de fortes capacités d'analyse et avez le goût pour les données\nEn tant que Responsable d'Équipe Logistique Junior chez Amazon, vous jouerez un rôle clé dans notre mission : permettre à des millions de clients de recevoir leurs commandes à l'heure promise. Chaque jour, vos décisions et votre leadership auront un impact direct sur la satisfacti", "full_description": "- Vous avez obtenu(e) votre diplôme universitaire avant la date de début OU diplomé(e) au cours des 24 derniers mois\n- Vous êtes au minimum titulaire d’une licence (bac+3)\n- Vous disposez d’excellentes capacités de communication en français et en anglais\n- Vous faites preuve de fortes capacités d'analyse et avez le goût pour les données\nEn tant que Responsable d'Équipe Logistique Junior chez Amazon, vous jouerez un rôle clé dans notre mission : permettre à des millions de clients de recevoir leurs commandes à l'heure promise. Chaque jour, vos décisions et votre leadership auront un impact direct sur la satisfaction de nos clients au sein de notre réseau europée\nKey job responsibilities\nVos responsabilités clés\n- Porter au quotidien notre engagement premier - la santé et la sécurité de nos collaborateurs - en veillant au respect des standards et en promouvant une culture de sécurité exemplaire\n- Fédérer et développer une équipe de 20 à 100 collaborateurs aux parcours variés, en créant un environnement de travail motivant où chacun peut s'épanouir et progresser\n- Piloter la performance de votre périmètre et la qualité des processus pour garantir à des millions de clients une expérience exceptionnelle\n- Etre moteur de l'amélioration continue des processus, en vous appuyant sur vos collaborateurs et sur l'analyse des données pour viser l'excellence opérationnelle\nPour cela, vous travaillez en étroite collaboration avec les autres services sur site et au sein de notre réseau logistique\nA day in the life\nJournée type\nChez Amazon, nous avons développé des méthodes de management qui ont fait leurs preuves à l'échelle mondiale. En nous rejoignant, vous bénéficierez d'un parcours d'intégration structuré, de formations à nos standards opérationnels et d’un accompagnement par des managers expérimentés. Ce rôle est une opportunité unique d'apprendre le management de terrain au cœur de nos opérations et de progresser rapidement vers des responsabilités importantes au sein d'Amazon.\nAbout the team\nÀ propos de l’équipe\nSelon votre profil et vos aspirations, vous pourrez évoluer dans l'un des environnements suivants :\n- Centres de distribution (Customer Fulfilment): Ces entrepôts modernes sont le point de départ de notre chaîne logistique. Nos équipes y assurent la réception, le stockage et la préparation des commandes, garantissant une gestion efficace des stocks et une expédition rapide vers nos clients\n- Centres de tri (Amazon Transportation Services): Ces hubs logistiques sont au cœur de notre réseau de distribution. Nos équipes y orchestrent le tri et l'acheminement des colis entre les centres de distribution et les agences de livraison, optimisant les flux pour assurer rapidité et précision\n- Agences de livraison (Amazon Logistics): Ces sites représentent le dernier maillon de notre chaîne logistique, au plus près des clients. Nos équipes y coordonnent les livraisons du dernier kilomètre, travaillant en étroite collaboration avec nos partenaires pour offrir une expérience clients exceptionnelle\nLes postes à pourvoir suivent le rythme des équipes opérationnelles, et vous travaillez en horaires décalés.\n- Stage, alternance ou première expérience en environnement industriel/logistique\n- Expérience en gestion de projet ou en animation d'équipe\n- Maîtrise des outils bureautiques\nAmazon est un employeur engagé pour l'égalité des chances. Nous sommes convaincus qu'une main d'oeuvre diversifée est essentielle à notre réussite. Nous prenons nos décisions de recrutement en fonction de votre expérience et de vos compétences. Nous apprécions votre envie de découvrir, d'inventer, de simplifier et de construire. La protection de votre vie privée et la sécurité de vos données constituent depuis longtemps une priorité absolue pour Amazon. Veuillez consulter notre Politique de Confidentialité pour en savoir plus sur la façon dont nous collectons, utilisons et traitons les données personnelles de nos candidats.\nOur inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https://amazon.jobs/content/en/how-we-hire/accommodations for more information. If the country/region you’re applying in isn’t listed, please contact your Recruiting Partner."}, {"id": "op-4f0bbc1142ad", "source_id": "4479370733", "source_name": "LinkedIn Emplois", "title": "Acheteur junior/Acheteuse junior", "company": "Histoire d'Or", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 95, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-16", "posted_fr": "16 Octobre 2026", "verified_at_iso": "2026-11-11T05:52:46Z", "url": "https://www.linkedin.com/jobs/view/4479370733/", "highlights": ["Acheteur junior Bijoux & Montres (H/F) CDI", "Histoire d’Or est le leader sur le marché de la bijouterie horlogerie en France. Notre succès réside dans la promesse de rendre le bijou accessible au plus grand nombre.", "Nous nous exprimons à travers nos sept marques à forte notoriété natio ur la base des besoins remontés par les équipes de l’offre des différents pays du Groupe.\nVos principales missions :\nRelation et négociation fournisseurs\nContact privilégié et opérationnel avec les fournisseurs.\nPréparation et conduite des négociations annuelles avec la responsable du bureau d’achat.\nAmélioration de nos conditions d’achat auprès des fournisseurs.\nGestion des achats sur son périmètre\nSuivi des achats et de la performance des fournisseurs.\nGarant de la mise à jour de l’ensemble des conditions d’achats sur son périmètre et de leur communication aux entités concernées : prix, délais, accords de retours, conditions diverses, etc.\nInterlocuteur principal des demandeurs internes (France et international) sur l’ensemble des sujets transverses en lien avec les fournisseurs : supply team, legal team, offer team, logistique, etc.\nIdentifie les besoins proches ou communs aux enseignes et fait des propositions de sourcing commun, avec un objectif de gains d’achats et de constitution de synergies.\nRecherche, présélectionne et propose des fournisseurs et des produits appropriés répondant aux exigences prix-qualité-délais de l’entreprise.\nGestion et suivi des incidents de livraison, d’étiquetage et de paiement.\nÉlaboration des rétroplannings des briefs sur le périmètre des montres et gestion du développement des nouveautés.\nOrganise et coordonne les réunions de présentation des nouveautés des marques propres de montres avec les différents chefs de produit.\nParticipe aux salons de sourcing.\nContribution à la politique Achats du Groupe\nVeille sur l’ensemble des options disponibles sur les marchés.\nProposition de nouveaux fournisseurs en ligne avec la stratégie du Groupe.\nContribue au maintien et à l’amélioration de la qualité des produits et des délais d’approvisionnement.\nAssure le reporting de son activité et contribue au reporting de la Direction Achats Groupe.\nParticipe aux réunions transverses avec les services concernés sur les projets ou les thématiques achats.\nProfil recherché :\nDiplômé(e) d'une école de Commerce Internationnal, et bénéficiez d'une expérience significative en achats\nMaîtrise de l'anglais\nMaîtrise des outils de bureautique\nManagement\nNégociateur(rice)\nAisance relationnelle\nCe que nous vous offrons :\nUne rémunération motivante, combinant primes individuelles sur objectifs et un dispositif collectif complet (participation, intéressement, épargne salariale) pour partager les succès de l’entreprise.\nUn environnement de travail stimulant et convivial basé sur l’humain et la collaboration.\nUn restaurant d’entreprise subventionné.\nUne mutuelle familiale.\nUn accès aux avantages du CSE (chèques cadeaux, chèques vacances, etc).\nUn service de conciergerie (assistance santé, assistance administrative et juridique, etc).\nEnvie de relever de nouveaux challenges dans un environnement dynamique ?\nVenez écrire votre histoire chez le Leader de la bijouterie en Europe !"}, {"id": "op-ba45283e9b66", "source_id": "4462553522", "source_name": "LinkedIn Emplois", "title": "MRO Platform Logistics Process Coordinator H/F", "company": "Airbus Helicopters", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 95, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-22", "posted_fr": "22 Octobre 2026", "verified_at_iso": "2026-11-11T05:53:14Z", "url": "https://www.linkedin.com/jobs/view/4462553522/", "highlights": ["Envolez-vous avec Airbus Helicopters !", " futures missions :\nEn rejoignant l'équipe « Amélioration Continue et Projets » (5 personnes), vous jouerez un rôle moteur en tant que coordinateur dans le suivi des processus et leur respect.\nVos principales missions seront les suivantes :\nSuivi et adhésion aux processus :\nCoordonner le PDCA des actions d'amélioration de la plateforme logistique\nPiloter la mise en œuvre des évolutions ou des nouveaux processus\nAssurer le suivi du respect des processus par les prestataires logistiques lors des audits et évaluations périodiques\nRéférent MY CES et déploiement des procédures :\nParticiper activement à la mise en place des standards (guides et modes opératoires, supports de communication internes et externes)\nCoordonner la rédaction des procédures et assurer leur publication selon le standard Airbus\nPiloter la conformité du déploiement des procédures au sein de l'activité logistique\nGestion des ressources générales et numériques :\nGérer les commandes de fournitures et prestations diverses liées à l'activité\nSuivre le processus d'achat du département\nÊtre le point de contact privilégié de la DSI (IT) pour les sujets matériels\nValider les droits d'accès aux différents outils informatiques\nDes déplacements professionnels sont à prévoir, vous devez donc être disposé(e) à voyager dans ce cadre.\nVotre profil :\nExpérience professionnelle minimale de 3 à 5 ans en logistique et/ou qualité au sein du secteur aéronautique.\nFormation supérieure en Logistique ou Global Supply Chain.\nExpertise avérée en coordination de projets et gestion de plans d'action.\nConnaissances qualité et réglementaires : ISO 9001, EN9100, PART145, PART21.\nMaîtrise des outils informatiques : G Suite et outils de suivi/gestion de plans d'action (PDCA, SQCDP).\nLangues : Anglais courant, Français courant.\nQualités / Soft skills : Rigoureux(se), autonome, pédagogue et doté(e) d'un excellent esprit d'équipe et de compétences relationnelles.\nCe poste nécessite une habilitation de sécurité ou d'être éligible à une habilitation par les autorités reconnues.\nCe poste nécessite la connaissance des risques potentiels de conformité et l'engagement à agir avec intégrité, comme condition du succès, de la réputation et de la croissance durable de l'entreprise.\n3 Raisons pour nous rejoindre :\nNos Valeurs : Six valeurs essentielles constituent le noyau de notre entreprise. Définies pour les employés par les employés, nos valeurs Airbus façonnent l'ADN de notre activité, en reflétant le mélange unique des qualités que l'on trouve dans chacun des membres de notre famille mondiale.\nInclusion et diversité : Nous favorisons un cadre de travail inclusif et valorisant, où la diversité de chacun est appréciée et respectée. Une main-d'œuvre inclusive et diversifiée est le moteur de l'innovation chez Airbus. Elle nous rend unique, contribue à une meilleure résolution des problèmes.\nRémunération et avantages :\nChez Airbus, nous construisons l'avenir ensemble et votre succès est notre priorité.\nAttendez-vous à un package de rémunération global, compétitif et transparent (incluant salaires, primes, intéressement, participation et plan d'actionnariat privilégié), conçu pour récompenser l'impact et la performance que vous apportez, à la fois individuelle et collective.\nNous investissons dans votre épanouissement complet : développement professionnel (formation, mentorat, mobilité internationale), couverture santé, retraite, et un engagement pour un équilibre vie pro/vie perso soutenu (soutien à la parentalité, flexibilité).\nEt pour votre quotidien, des avantages qui font la différence :\nUn CSE dynamique proposant de nombreux avantages (restaurant d'entreprise, associations culturelles et sportives, indemnités de voyages, etc.).\nFacilités de transport : Profitez du remboursement de 80 % de votre pass annuel de transport.\nNotre processus de recrutement :\nCandidatez en ligne.\nAnalyse de votre candidature par le service recrutement.\nNos postes nécessitent une habilitation de sécurité, complétez le questionnaire qui vous sera envoyé.\nRéalisez les entretiens de recrutement : entretien RH et entretien technique avec votre futur manager.\nRecevez l'offre d'embauche !\nPrêt à vous envoler ? Donnez une nouvelle dimension à votre carrière en candidatant en ligne maintenant !\nThis job requires an awareness of any potential compliance risks and a commitment to act with integrity, as the foundation for the Company’s success, reputation and sustainable growth.\nCompany:\nAirbus Helicopters SAS\nEmployment Type:\nPermanent\nClasse Emploi (France): Classe E10\nExperience Level:\nProfessional\nJob Family:\nLogistics\nBy submitting your CV or application you are consenting to Airbus using and storing information about you for monitoring purposes relating to your application or future employment. This information will only be used by Airbus.\nAirbus is committed to achieving workforce diversity and creating an inclusive working environment. We welcome all applications irrespective of social and cultural background, age, gender, disability, sexual orientation or religious belief.\nAirbus is, and always has been, committed to equal opportunities for all. As such, we will never ask for any type of monetary exchange in the frame of a recruitment process. Any impersonation of Airbus to do so should be reported to emsom@airbus.com .\nAt Airbus, we support you to work, connect and collaborate more easily and flexibly. Wherever possible, we foster flexible working arrangements to stimulate innovative thinking.\n#YESPOST"}, {"id": "op-080beb9d4f61", "source_id": "4482722412", "source_name": "LinkedIn Emplois", "title": "Agent de Transit Aérien Import/Export (H/F)", "company": "Kuehne+Nagel", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 2, "exp_label": "2–3 ans d'exp.", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-22", "posted_fr": "22 Octobre 2026", "verified_at_iso": "2026-11-11T05:53:14Z", "url": "https://www.linkedin.com/jobs/view/4482722412/", "highlights": ["Ouvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.", "Organiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éventuelles) et suivre le statut des marchandises jusqu’à la livraison.", "Établir, vérifier et transmettre l’ensemble de la documentation transport & douane (MAWB, HAWB, certificats, manifeste, compliance, instructions douanières).", "Coordonner les opérations avec les compagnies aériennes, agents overseas, manutentionnaires et transporteurs, pour garantir une fluidité des flux."], "summary_excerpt": "C'est plus qu'un métier\nChez Kuehne+Nagel, le transport c'est bien plus qu’acheminer de la marchandise. Chaque jour, grâce à votre expertise, des produits du quotidien mais également des produits à forte valeur ajoutée arrivent auprès de ceux qui en ont besoin : des pièces d’avion livrées en urgence à l’aéroport, des cellules souches expédiées dans un strict respect des mesures de sécurité, etc. Chez Kuehne+Nagel, chaque mission fait la différence. Et la vôtre encore plus que vous ne l’imaginez.\n‎\nPrêt(e) à faire décoller votre carrière au cœur du fret aérien international ? Chez Kuehne+Nagel, nous recherchons de", "full_description": "C'est plus qu'un métier\nChez Kuehne+Nagel, le transport c'est bien plus qu’acheminer de la marchandise. Chaque jour, grâce à votre expertise, des produits du quotidien mais également des produits à forte valeur ajoutée arrivent auprès de ceux qui en ont besoin : des pièces d’avion livrées en urgence à l’aéroport, des cellules souches expédiées dans un strict respect des mesures de sécurité, etc. Chez Kuehne+Nagel, chaque mission fait la différence. Et la vôtre encore plus que vous ne l’imaginez.\n‎\nPrêt(e) à faire décoller votre carrière au cœur du fret aérien international ? Chez Kuehne+Nagel, nous recherchons des Agents de Transit Aérien Général Cargo (Import/Export) H/F capables de piloter des dossiers de transport de bout en bout, d'orchestrer des flux sensibles, et d’offrir un service client irréprochable. Si vous aimez résoudre les imprévus, coordonner des acteurs du monde entier et garantir des opérations sans faille, rejoignez notre équipe à Tremblay-en-France ! Votre expertise fera toute la différence.\nComment avoir de l'impact\nOuvrir, traiter et suivre les dossiers de transit aérien, en assurant une gestion proactive et une communication claire avec les clients.\nOrganiser les expéditions selon les instructions clients (réservations aériennes, coordination avec compagnies, négociations éventuelles) et suivre le statut des marchandises jusqu’à la livraison.\nÉtablir, vérifier et transmettre l’ensemble de la documentation transport & douane (MAWB, HAWB, certificats, manifeste, compliance, instructions douanières).\nCoordonner les opérations avec les compagnies aériennes, agents overseas, manutentionnaires et transporteurs, pour garantir une fluidité des flux.\nPlanifier et superviser les enlèvements et livraisons, en s’assurant de la conformité des marchandises (DG, particularités cargo).\nGérer les imprévus et litiges (retards, avaries, manquants) en apportant des solutions rapides et en maintenant une communication proactive avec les clients.\nFournir un support client proactif et professionnel, en apportant conseils sur les solutions de transport, coûts, délais et contraintes réglementaires.\nGarantir la satisfaction client par un suivi rigoureux et une gestion transparente de chaque étape du dossier.\nAssurer la facturation, le contrôle des coûts et l’analyse de rentabilité par dossier, en étant capable d’expliquer écarts ou pertes si nécessaire.\nSuivre les indicateurs de performance (OTD, litiges, délais) et respecter les procédures internes qualité et sécurité.\nCe que nous recherchons chez vous\nMinimum Bac+2 en transport, logistique ou filière équivalente.\nMinimum 2 ans d’expérience en fret aérien exigés.\nExcellente connaissance des réglementations aériennes (IATA) et des règles douanières import/export.\nMaîtrise des documents de transport aérien (MAWB, HAWB, certificats, manifeste, etc.).\nSolides compétences en logistique internationale : Incoterms, freight, handling, spécificités cargo.\nEsprit d’équipe, excellent relationnel et sens du service client.\nProactivité, autonomie, adaptabilité et capacité à trouver des solutions alternatives.\nMaîtrise de l’anglais professionnel.\nCe que nous vous proposons\nRejoindre Kuehne+Nagel, c’est s’engager dans une entreprise labellisée Great Place to Work et être prêt(e) à relever les défis du futur. Au-delà de rejoindre une équipe agréable dans un contexte stimulant, nous vous proposons (selon les postes) une rémunération attractive, des primes sur objectifs, un dispositif d’intéressement et participation, des tickets restaurant, des formations tout au long de votre vie chez Kuehne+Nagel, ainsi que des possibilités d’évolution en France et à l’international.\nQui sommes-nous\nLa logistique façonne notre vie quotidienne – des biens que nous consommons, aux soins de santé dont nous avons besoin. Chez Kuehne+Nagel, votre quotidien va au-delà de la logistique ; il accompagne les petits comme les grands moments de tout un chacun à travers le monde.\nEn tant que leader mondial avec une structure solide et avec une vision tournée vers l'avenir, nous offrons un environnement sûr et stable où votre carrière peut avoir un véritable impact. Que nous aidions à livrer des médicaments vitaux, à développer des solutions de transport durables ou à soutenir des associations locales, votre carrière contribuera à bien plus que vous ne l’imaginez.\nNous remercions les cabinets de recrutement pour leur intérêt. Toutefois, nous vous invitons à ne pas soumettre de candidatures non sollicitées. Toute candidature transmise sans accord préalable signé ne pourra être prise en compte, et aucun frais ne sera engagé."}, {"id": "op-aca34b85cc7b", "source_id": "4486165095", "source_name": "LinkedIn Emplois", "title": "ACHETEUR / APPROVISIONNEUR (H/F)", "company": "VENUM", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris et périphérie", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Tableaux de bord & Coûts"], "posted_iso": "2026-11-02", "posted_fr": "2 Novembre 2026", "verified_at_iso": "2026-11-11T05:52:45Z", "url": "https://www.linkedin.com/jobs/view/4486165095/", "highlights": ["Demand & Supply Planning Manager (H/F)", "CDI | Boulogne-Billancourt (92) Immeuble Campus", "Depuis plus de 20 ans, Venum accompagne les plus grands athlètes et organisations sportives à travers le monde.", "Partenaire officiel de l'UFC et marque de référence dans les sports de combat, dynamique, innovante et en"], "summary_excerpt": "Demand & Supply Planning Manager (H/F)\nCDI | Boulogne-Billancourt (92) Immeuble Campus\nDepuis plus de 20 ans, Venum accompagne les plus grands athlètes et organisations sportives à travers le monde.\nPartenaire officiel de l'UFC et marque de référence dans les sports de combat, dynamique, innovante et en\nconstante évolution. Nous créons des produits et des contenus qui inspirent une communauté internationale de\npassionnés.\nDans le cadre de notre développement Nous recherchons un(e) Demand & Supply Planning Manager capable\nd'anticiper les besoins et de garantir la disponibilité des produits sans générer de surstock", "full_description": "Demand & Supply Planning Manager (H/F)\nCDI | Boulogne-Billancourt (92) Immeuble Campus\nDepuis plus de 20 ans, Venum accompagne les plus grands athlètes et organisations sportives à travers le monde.\nPartenaire officiel de l'UFC et marque de référence dans les sports de combat, dynamique, innovante et en\nconstante évolution. Nous créons des produits et des contenus qui inspirent une communauté internationale de\npassionnés.\nDans le cadre de notre développement Nous recherchons un(e) Demand & Supply Planning Manager capable\nd'anticiper les besoins et de garantir la disponibilité des produits sans générer de surstocks ni de rupture.\nVotre mission\nRattaché(e) au Directeur Achats et Logistique, vous pilotez les achats du groupe en fonction des ventes, des stocks\net des besoins futurs. Votre objectif : commander les bonnes quantités au bon moment, pour les produits fondations\ncomme pour les nouvelles collections.\nAnalyse des ventes et optimisation des stocks\nAnalyser les ventes, les historiques et les stocks des différentes entités du groupe pour maintenir un niveau\noptimal\nAnticiper la saisonnalité et les périodes de forte demande.\nSuivre la rotation, la couverture, les risques de rupture et les stocks dormants.\nDéfinir les seuils de réapprovisionnement et les stocks de sécurité.\nConstruire et ajuster les prévisions avec la Direction Produits, les équipes commerciales, e-commerce et\nlogistiques.\nPlanification et pilotage des achats\nDéterminer les quantités à commander et les dates de commande selon les prévisions, les stocks, les délais de\nproduction et de livraison.\nGarantir le réassort régulier des produits fondations.\nPlanifier les achats des nouvelles collections selon les lancements.\nAdapter les commandes aux ventes et aux besoins des entités du groupe.\nLimiter les surstocks et l'immobilisation de trésorerie tout en évitant les ruptures.\nCommandes et relations fournisseurs\nPréparer, négocier et passer les commandes auprès des fournisseurs internationaux existants.\nSuivre les commandes jusqu'à leur réception dans les entrepôts.\nCoordonner les importations avec les fournisseurs et transitaires.\nGérer les retards, anomalies et litiges, et communiquer les dates de livraison des réassorts et nouveautés.\nTrouver des solutions en cas de rupture de stock\nReporting et amelioration continue\nSuivre les indicateurs : taux de rupture, couverture, rotation, disponibilité et fiabilité des prévisions.\nMettre à jour les tableaux de bord et analyser les écarts entre prévisions et ventes.\nAméliorer les processus et assurer le suivi administratif des commandes, factures et livraisons.\nVotre profil\nIssu(e) d’une formation supérieure en achats, supply chain, logistique, vous justifiez d’une expérience\nsignificative dans une fonction similaire.\nVous possédez une solide expérience dans l'analyse des ventes, la gestion des stocks et la planification des\napprovisionnements.\nVous savez anticiper les besoins, tenir compte de la saisonnalité et ajuster les quantités commandées afin de\ngarantir la disponibilité des produits tout en évitant les surstocks.\nVous êtes à l'aise avec les chiffres et maîtrisez parfaitement Excel ainsi que les outils de gestion et de\nreporting.\nVous faites preuve de rigueur, d'organisation et d'un excellent esprit d'analyse.\nAutonome, réactif(ve) et force de proposition, vous savez prendre des initiatives, anticiper les difficultés et gérer\nles priorités.\nVous maîtrisez impérativement l'anglais, à l'écrit comme à l'oral.\nUne expérience dans le textile, les équipements sportifs, la distribution ou le e-commerce serait un véritable\natout.\nPourquoi rejoindre Venum ?\nUne marque reconnue mondialement, une équipe passionnée et un poste ayant un impact direct sur la disponibilité\ndes produits et la performance commerciale.\nEnvie de relever le défi ? Envoyez votre CV à recrutement@venum.com et sandrine.cougnard@dragonbleu.fr"}, {"id": "op-7ff7c4d5a398", "source_id": "4479814546", "source_name": "LinkedIn Emplois", "title": "Passenger Car Supply Chain Logistics Specialist", "company": "BYD EUROPE", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Courbevoie (92)", "city_raw": "Courbevoie", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 94, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires", "Flux internationaux"], "posted_iso": "2026-10-15", "posted_fr": "15 Octobre 2026", "verified_at_iso": "2026-11-11T05:52:21Z", "url": "https://www.linkedin.com/jobs/view/4479814546/", "highlights": ["Our Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.", "BYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicles, including all-electric cars, all-electric buses, and all-electric forklift trucks.", "Below Should Be Changed", "Skills, Qualifications, and Experience Required:"], "summary_excerpt": "About BYD\nOur Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.\nBYD is a leading, high-tech multinational, based in Shenzhen, China. Operates in four core fields of IT, automotive, new energy, and rail transit and employs over 300,000 people worldwide. As a global pioneer in New Energy Solutions BYD is dedicated to building a zero-emission ecosystem.\nBYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicl", "full_description": "About BYD\nOur Purpose is to build a zero-emission future that reconnects humanity with nature. We are looking for talent that connects with this mission and want to create positive impact by joining a diverse and dynamic team.\nBYD is a leading, high-tech multinational, based in Shenzhen, China. Operates in four core fields of IT, automotive, new energy, and rail transit and employs over 300,000 people worldwide. As a global pioneer in New Energy Solutions BYD is dedicated to building a zero-emission ecosystem.\nBYD Europe BV located in Hoofddorp, Netherlands. BYD Europe BV offers a full line of BYD electric vehicles, including all-electric cars, all-electric buses, and all-electric forklift trucks.\nBelow Should Be Changed---------------------------------\nAbout BYD France\nBYD France is the French National Sales Company of BYD BV Europe and BYD Company Ltd, a China-based company and a leading global supplier of green energy technologies. BYD France offers a range of electric vehicles, including all-electric cars, buses & forklifts. BYD is expanding its operations in France to support a growing portfolio of New Electric Vehicle Passenger car and LCVs projects.\nKey Responsibilities:\n1/Coordinate outbound loading & shipment of passenger cars, closely track vessel schedules, ocean freight status and ETA updates for vehicle consignments. 2/Manage daily collaboration and performance evaluation for European local logistics vendors (ocean forwarder, port operator, yard agent, customs broker), push for service improvement and cost‑efficiency. 3/Full lifecycle monitoring of port arrival, customs declaration & clearance progress; proactively identify document risks, resolve clearance holds and avoid delivery delays. 4/Troubleshoot on‑site logistics incidents including cargo damage, port congestion, yard stock discrepancy, transshipment anomalies; drive cross‑party problem closure with vendors and internal stakeholders. 5/Maintain shipment & inventory data accuracy, produce regular logistics status reports, highlight risks and propose countermeasures to leadership. 6/Align with internal planning, sales and quality teams to match regional delivery KPIs, optimize logistics flow and continuously improve end‑to‑end vehicle delivery reliability.\nSkills, Qualifications, and Experience Required:\nBachelor’s degree in Logistics, Supply Chain, Business Administration, or a related field.\n1–3 years of experience in logistics, transportation, or supply chain operations.\nExperience in automotive logistics is a plus.\nProficiency in Microsoft Excel and logistics reporting tools.\nStrong organizational, communication, and problem-solving skills.\nAbility to work in a fast-paced international environment.\nFluent in French and English; Chinese is a plus."}, {"id": "op-a5bd9761a1f1", "source_id": "83850272", "source_name": "HelloWork", "title": "Assistant·e Coordinateur Transport - CDD H/F", "company": "VENTE UNIQUE.COM", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDD", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris 19e (75)", "city_raw": "Paris 19e - 75", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "26 000 – 30 000 € brut/an", "has_salary": true, "salary_max_eur": 30000, "affinity_score": 92, "match_tags": ["Supply Chain & Pilotage des flux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-29", "posted_fr": "29 Octobre 2026", "verified_at_iso": "2026-11-11T05:50:32Z", "url": "https://www.hellowork.com/fr-fr/emplois/83850272.html", "highlights": ["Nous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.", "Tu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).", "🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.", "1. Gérer les incidents de livraison"], "summary_excerpt": "Les missions du poste\nDescriptif du poste :\nNous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.\nTu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).\n🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.\nTes missions :\n1. Gérer les incidents de livraison\n* Traiter les réclamations et inci", "full_description": "Les missions du poste\nDescriptif du poste :\nNous recherchons un.e Assistant.e Coordinateur Transport pour rejoindre le service Transport de Vente-unique.com et participer au bon déroulement des livraisons de nos clients BtoC sur le marché français.\nTu seras rattaché.e à Gwendoline et tu intégreras une équipe déjà en place de 6 personnes (2 sur le fulfillment, 4 sur VU/Habitat).\n🎯 Ton objectif : résoudre rapidement les incidents de livraison pour que nos clients soient satisfaits et que nos opérations logistiques restent fluides.\nTes missions :\n1. Gérer les incidents de livraison\n* Traiter les réclamations et incidents clients liés aux livraisons (retards, pertes, dommages, etc.)\n* Coordonner avec les transporteurs et les équipes internes pour résoudre les problèmes rapidement et efficacement\n2. Suivre et communiquer\n* Assurer un suivi proactif des incidents jusqu'à leur résolution complète\n* Informer régulièrement le service client de l'état d'avancement des réclamations\n3. Analyser et améliorer en continu\n* Analyser les incidents pour identifier les causes récurrentes et proposer des solutions d'amélioration\n* Participer à l'élaboration de rapports et de tableaux de bord pour suivre les performances et les indicateurs clés\n4. Travailler main dans la main avec les équipes\n* Collaborer étroitement avec les équipes logistiques, commerciales et du service client pour assurer une gestion fluide des incidents\n* Participer aux réunions de coordination et apporter un support opérationnel aux équipes sur le terrain\n5. Vérifier la facturation et gérer les litiges\n* Vérifier la facturation des livraisons pour s'assurer de l'exactitude des coûts et des services facturés\n* Gérer les litiges liés aux transports, en coordination avec les services financiers et juridiques de l'entreprise\nTA TEAM\nGwendoline sera ta manager pour cette nouvelle aventure 🤝 Tu seras aussi accompagné.e de toute l'équipe Transport/Logistique, composée de personnes aussi bienveillantes les unes que les autres 😉\nPrêt.e à rejoindre une équipe dynamique qui t'écoutera vraiment, laissera de la place à tes idées et te confiera des responsabilités dès le premier jour ? 💪\nLe profil recherché\nProfil recherché :\nTu es rigoureux.se, organisé.e et tu as une forte capacité d'analyse et de synthèse. Une première expérience en B2B, logistique/transport ou gestion de flux est appréciée. Une expérience pure en transport n'est pas obligatoire si tu maîtrises la logique de flux et/ou la résolution de problèmes. Les profils issus d'alternance sont également les bienvenus.\nCôté compétences, on attend de toi :\n* Une maîtrise d'Excel et des tableurs, avec une aisance pour l'analyse de fichiers de données\n* Des notions de base en transport/logistique\n* Des connaissances en géographie française (et idéalement européenne)\n* Des bases en Anglais (niveau B1, l'usage de Google Translate est accepté pour la gestion du flux)\nEt côté personnalité :\n* De la rigueur, de l'organisation et une bonne gestion des priorités\n* De la réactivité, une bonne capacité d'adaptation et un esprit ouvert : le poste comprend des imprévus et demande d'identifier et de résoudre rapidement les problèmes de livraison\n* Du dynamisme et de la proactivité, avec l'envie de t'étoffer et d'élargir ton périmètre à la gestion d'autres transporteurs\n* Le sens du travail en équipe et de l'entraide\n* Une capacité à accepter la critique\nNous avons besoin de quelqu'un qui matche avec nos valeurs : performance et convivialité !\nAussi, on espère que tu as un fort attrait pour l'univers du e-commerce et de l'aménagement de la maison ! 🛍️\nLe processus de recrutement :\nIl se déroule en 3 étapes principales :\n1- Tri des CV par les RH\n2- Entretien RH avec Nolane, Talent Acquisition Specialist (motivation, personnalité)\n3- Entretien Manager avec Gwendoline (Romain, notre responsable du pôle SEU, est susceptible d'être également présent)\nConditions & Avantages :\n* Type de contrat : CDD 12 mois\n* À pourvoir dès que possible\n* Rémunération selon profil\n* 1 jour de télétravail par semaine\n* 6 semaines de congés payés par an\n* Convention collective applicable : Négoce de l'ameublement 1880\n* Mutuelle Alan (70% à la charge de la société)\n* Swile : carte Tickets restaurant (50% à la charge de l'entreprise)\n* Participation à l'abonnement des transports en commun (50% à la charge de l'entreprise)\n* Pour les minis de la VU team, des places en crèche sont disponibles grâce aux Petits Chaperons Rouges ! 🧸\n* Dog friendly 🐶\n* Localisation : Poste basé à Clavel métro ligne 11, 5, 2, 7B ou bus ligne 20, 26, 71 🚇\nVente-unique.com est un employeur garantissant l'égalité des chances, ce qui signifie que nous nous engageons à ne pas discriminer les employés en fonction de leurs origines, de la , du sexe, de l'origine nationale, de l'âge, du handicap ou des informations génétiques. Si des aménagements raisonnables sont nécessaires pour le processus, n'hésitez pas à en discuter avec l'équipe recrutement.\nBienvenue chez VENTE UNIQUE.COM\nQui sommes-nous ?\nPionnier du e-commerce mobilier et décoration depuis 2006, Vente-unique.com s'est imposé comme une référence dans 16 pays grâce à son esprit visionnaire et son exigence de performance.\nAnnée après année, nous élargissons notre univers pour devenir un groupe en expansion continue dans l'équipement de la maison :\n* Avec la reprise de la marque Habitat en 2024, icône du design accessible,\n* Avec notre marketplace, qui connecte des millions de produits à nos clients,\n* Et avec nos solutions de fulfillment, qui garantissent une logistique rapide et fiable.\nDerrière cette aventure, une équipe jeune, internationale et passionnée réunit tous les métiers en interne (IT, Marketing, achats, logistique, service client...). Cette organisation intégrée nous permet de rester agiles, innovants et performants.\n👉 Chez Vente-unique.com, tu trouveras la solidité d'une entreprise cotée en bourse, allée à l'énergie d'un acteur e-commerce en pleine croissance.\n🎯 Notre mission : offrir du bonheur à tous les étages, en rendant le design et le confort accessibles à chacun.\nAvantages :\n* Tickets restaurants\n* Mutuelle\n* PEE\n* 50% Transports"}, {"id": "op-a0a6e8e48812", "source_id": "4488129548", "source_name": "LinkedIn Emplois", "title": "Coordinateur logistique H/F", "company": "Akkodis", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_93", "zone_rank": 1, "zone_label": "Seine-Saint-Denis (93)", "city_display": "Tremblay-en-France (93)", "city_raw": "Tremblay-en-France", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "30 000 € brut/an", "has_salary": true, "salary_max_eur": 30000, "affinity_score": 92, "match_tags": ["Supply Chain & Pilotage des flux", "Tableaux de bord & Coûts"], "posted_iso": "2026-11-06", "posted_fr": "6 Novembre 2026", "verified_at_iso": "2026-11-11T05:52:10Z", "url": "https://www.linkedin.com/jobs/view/4488129548/", "highlights": ["Présents dans 30 pays, nos 50 000 experts en IT et en ingénierie allient expertise technologique et connaissance sectorielle pour bâtir un avenir durable, portés par une culture d'inclusion et de diversité.", "Akkodis est la marque technologique de The Adecco Group​", "La ligne de service Consulting & Solutions d'Akkodis France renforce ses équipes en région et recrute un Coordinateur logistique H/F en CDI à Tremblay-En-France.", "Assurer la création, la gestion et la mise à jour des commandes dans les systèmes (ERP)."], "summary_excerpt": "Akkodis, est un acteur mondial de l'ingénierie et de l'IT et un leader dans la smart industrie. Nous accompagnons la transformation digitale de nos clients à travers quatre services : Consulting, Solutions, Talent et Academy. Nous co-créons et imaginons des solutions de pointe pour répondre aux défis majeurs de notre société.\nPrésents dans 30 pays, nos 50 000 experts en IT et en ingénierie allient expertise technologique et connaissance sectorielle pour bâtir un avenir durable, portés par une culture d'inclusion et de diversité.\nAkkodis en France, ce sont près de 9.000 experts répartis sur l'ensemble du territoir", "full_description": "Akkodis, est un acteur mondial de l'ingénierie et de l'IT et un leader dans la smart industrie. Nous accompagnons la transformation digitale de nos clients à travers quatre services : Consulting, Solutions, Talent et Academy. Nous co-créons et imaginons des solutions de pointe pour répondre aux défis majeurs de notre société.\nPrésents dans 30 pays, nos 50 000 experts en IT et en ingénierie allient expertise technologique et connaissance sectorielle pour bâtir un avenir durable, portés par une culture d'inclusion et de diversité.\nAkkodis en France, ce sont près de 9.000 experts répartis sur l'ensemble du territoire, des collaborateurs partageant des valeurs fortes d'honnêteté, de respect, d'équité et d'inclusion. Notre engagement : leur permettre au quotidien d'être eux-mêmes au travail, et acteurs de leur vie et de leur développement au sein d'Akkodis.\nAkkodis est une entreprise handi-engagée et inclusive. Tous nos postes sont ouverts aux handicaps et à la diversité. Tous différents, tous compétents !\nAkkodis est la marque technologique de The Adecco Group​\nDescription\nLa ligne de service Consulting & Solutions d'Akkodis France renforce ses équipes en région et recrute un Coordinateur logistique H/F en CDI à Tremblay-En-France.\nCe poste, situé dans le secteur aéronautique et aviation, offre l'opportunité d'intégrer une équipe dynamique en charge de la gestion administrative et commerciale des ventes, avec une forte interaction entre les différents départements et une orientation vers le service client.\nResponsabilités principales :\nAssurer la création, la gestion et la mise à jour des commandes dans les systèmes (ERP).\nPiloter le carnet de commandes de bout en bout (saisie, validation, suivi, facturation).\nGarantir la fiabilité et la conformité des données dans les outils internes.\nGérer les prévisions de ventes (forecast) et assurer leur mise à jour.\nSuivre les approvisionnements et anticiper les risques de rupture.\nCoordonner les flux logistiques avec les équipes internes (entrepôts, transport, production).\nOptimiser la planification des commandes en fonction des contraintes supply chain.\nAnalyser les indicateurs de performance (taux de service, OTIF, délais) et produire des reportings.\nIdentifier les anomalies et mettre en place des actions correctives.\nContribuer à l'amélioration continue des processus ADV et Supply Chain.\nParticiper à la gestion des stocks et à leur optimisation.\nEnvironnement de travail :\nLe poste s'inscrit dans un contexte industriel exigeant, typique du secteur aéronautique et aviation. L'utilisation quotidienne d'outils bureautiques (Excel, Word, Power Point, Access) et de systèmes de gestion (ERP, CRM) est essentielle. L'organisation, la rigueur et l'esprit d'équipe sont au cœur des interactions, dans un environnement où la réactivité et la précision sont attendues.\nLa maîtrise de l'anglais est indispensable\nProfile\nLe poste est ouvert à tous les niveaux d'expérience, avec une formation minimum de bac +2 en supply chain / transport. Une maîtrise des outils bureautiques (Excel, Word, Power Point, Access).\nUne expérience dans l'industrie aéronautique ou dans un secteur technique serait appréciée.\nLa connaissance d'un logiciel ERP comme SAP ainsi que des compétences en résolution de problèmes et gestion des conflits, sont des atouts. L'anglais professionnel est requis pour la communication internationale.\nAkkodis accompagne ses clients dans la mondialisation de leurs projets, aussi un anglais courant est requis pour l'ensemble de nos collaborateurs. ​"}, {"id": "op-22faf6e0dc56", "source_id": "4485754210", "source_name": "LinkedIn Emplois", "title": "[CDI] Acheteur / Acheteuse (H/F)", "company": "KONCRETE", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 91, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires"], "posted_iso": "2026-11-02", "posted_fr": "2 Novembre 2026", "verified_at_iso": "2026-11-11T05:52:46Z", "url": "https://www.linkedin.com/jobs/view/4485754210/", "highlights": ["Koncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.", "Nous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.", "Tes missions1. Comprendre et qualifier les besoins d’achat", "Recueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances."], "summary_excerpt": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les ", "full_description": "À propos de Koncrete\nKoncrete simplifie l’achat de matériaux et l’évacuation de déblais pour les professionnels du BTP, en s’appuyant sur un réseau de fournisseurs, de plateformes et de transporteurs partenaires.\nNotre ambition : permettre aux professionnels de trouver des solutions adaptées à leurs chantiers, compétitives et fiables. Les achats sont au cœur de cette promesse : développer le bon réseau, obtenir les bonnes conditions et construire des offres pertinentes pour chaque besoin.\nLe poste\nNous recherchons un Acheteur / une Acheteuse en CDI, avec une première expérience solide, pour prendre en charge les consultations fournisseurs, comparer les offres et négocier les conditions d’achat.\nTu sais déjà mener une consultation, relancer des fournisseurs et défendre une recommandation chiffrée. Tu souhaites gagner en autonomie et développer ton expertise dans un environnement entrepreneurial où tes décisions ont un impact concret sur la compétitivité des offres et la rentabilité des projets.\nUn rôle 100 % achats : ton périmètre couvre le sourcing, les consultations, l’analyse des offres, la négociation et le suivi de la performance fournisseurs. La planification des livraisons, la coordination quotidienne des tournées et la gestion des incidents opérationnels ne constituent pas tes missions principales : elles relèvent des équipes opérations.\nTes missions1. Comprendre et qualifier les besoins d’achat\nRecueillir les besoins auprès des équipes commerciales et opérationnelles : nature des matériaux ou prestations, volumes, localisation, contraintes techniques et échéances.\nVérifier que les informations nécessaires à une consultation sont complètes et lever les ambiguïtés avant de solliciter les partenaires.\nTraduire les besoins en demandes de prix ou cahiers des charges clairs, avec l’appui des équipes compétentes pour les exigences techniques et réglementaires.\nPrioriser les consultations selon leur urgence, leur potentiel et leurs enjeux économiques.\n2. Piloter les consultations fournisseurs de bout en bout\nIdentifier les fournisseurs, plateformes et transporteurs pertinents pour chaque besoin.\nPréparer et envoyer les demandes de prix, en précisant les quantités, spécifications, conditions attendues et délais de réponse.\nOrganiser la mise en concurrence et obtenir plusieurs offres comparables lorsque le marché le permet.\nSuivre les réponses, relancer les interlocuteurs et clarifier les éléments manquants ou incohérents.\nTenir un tableau de suivi des consultations : partenaires sollicités, réponses reçues, échéances, points ouverts et prochaines actions.\nConstruire une synthèse exploitable et recommander les solutions les plus pertinentes aux équipes concernées.\n3. Analyser les offres et négocier les conditions d’achat\nComparer les propositions à périmètre équivalent : prix, transport, frais annexes, disponibilité, délais, conditions de paiement et durée de validité.\nRaisonner en coût complet, et pas uniquement en prix unitaire, pour identifier la solution réellement compétitive.\nRepérer les écarts, exclusions et risques susceptibles de dégrader la marge ou la faisabilité de l’offre.\nNégocier les tarifs et les conditions commerciales dans le respect des objectifs et du cadre de validation interne.\nFormaliser les conditions obtenues par écrit et sécuriser leur bonne transmission aux équipes commerciales et opérationnelles.\nSolliciter une validation pour les engagements ou dérogations dépassant ton niveau de délégation.\n4. Développer et entretenir le réseau fournisseurs\nSourcer de nouveaux partenaires pour renforcer la couverture géographique et élargir les solutions disponibles.\nQualifier leur offre, leurs capacités, leurs zones d’intervention et leurs conditions commerciales.\nRecueillir les informations et documents nécessaires au référencement, avec l’appui des équipes compétentes.\nConstruire des relations de travail durables, tout en maintenant une mise en concurrence adaptée.\nIdentifier des alternatives sur les besoins récurrents ou sensibles pour limiter la dépendance à un partenaire unique.\nRéévaluer les conditions négociées en fonction des volumes, des évolutions de marché et des retours terrain.\n5. Fiabiliser les données et améliorer les méthodes achats\nMaintenir à jour la base fournisseurs, les grilles tarifaires et l’historique des consultations.\nAssurer la traçabilité des offres et des accords : version, date, périmètre, validité et conditions particulières.\nConstruire des modèles de consultation et des grilles de comparaison simples et réutilisables.\nSuivre les résultats de tes consultations et identifier les leviers d’amélioration.\nExploiter les retours des opérations pour ajuster la sélection et l’évaluation des partenaires.\nProposer des améliorations concrètes pour accélérer les consultations et fiabiliser les décisions d’achat.\nLe profil recherché\nUne première expérience solide, sans être un profil senior\nTu disposes idéalement de 1 à 3 ans d’expérience en achats, approvisionnement ou sourcing, avec une pratique réelle des consultations et de la négociation. Une alternance significative et responsabilisante peut être prise en compte.\nTu as déjà géré plusieurs demandes en parallèle, comparé des devis et échangé directement avec des fournisseurs.\nUne formation en achats, supply chain, commerce ou gestion est appréciée ; nous regardons surtout tes compétences et tes réalisations concrètes.\nUne expérience dans le BTP, les matériaux, le transport ou un environnement industriel est un plus, pas un prérequis.\nTes compétences\nRigueur analytique : tu sais construire un comparatif fiable, vérifier les unités et calculer un coût complet.\nNégociation : tu prépares tes échanges, argumentes avec des éléments concrets et sais rechercher un accord équilibré.\nOrganisation : tu pilotes tes échéances et relances sans perdre les dossiers en cours.\nRelationnel : tu es à l’aise au téléphone et sais poser les bonnes questions pour obtenir une réponse exploitable.\nAutonomie : tu fais avancer les sujets courants et sais alerter lorsqu’une décision nécessite un arbitrage.\nCuriosité : tu cherches à comprendre les produits, les contraintes des partenaires et les réalités des c us rejoignez la Direction des Flux et intégrez une équipe d’approvisionneurs et d’assistants approvisionnement, au cœur des enjeux de gestion des flux.\nVos Missions\nGérer intégralement un portefeuille étendu de fournisseurs\nS’assurer de la disponibilité des produits sur les plateformes de Cromology & ainsi maintenir le taux de service auprès des clients de Cromology\nPasser les commandes de réapprovisionnements & s’assurer du respect des engagements des fournisseurs\nAssurer des échanges avec les achats et le marketing négoce\nMesurer ", "full_description": "Donnez un coup de pinceau à votre avenir !\nRattaché au Supply Planning Manager, vous rejoignez la Direction des Flux et intégrez une équipe d’approvisionneurs et d’assistants approvisionnement, au cœur des enjeux de gestion des flux.\nVos Missions\nGérer intégralement un portefeuille étendu de fournisseurs\nS’assurer de la disponibilité des produits sur les plateformes de Cromology & ainsi maintenir le taux de service auprès des clients de Cromology\nPasser les commandes de réapprovisionnements & s’assurer du respect des engagements des fournisseurs\nAssurer des échanges avec les achats et le marketing négoce\nMesurer l’OTIF des fournisseurs & participer au développement du partenariat avec nos fournisseurs\nSuivre le niveau de stock & chercher à en améliorer la qualité\nContribuer au process de gestion de fin de vie des produits\nOptimiser les réceptions des fournisseurs sur nos plateformes logistiques & communiquer aux plateformes des livraisons prévues via le planning de livraisons mis en place\nParticiper à la gestion de la base de données en lien avec le Data management pour améliorer la qualité des données articles et réduire le traitement des écarts prix Proposer et mettre en place des actions d'amélioration en cas de dysfonctionnement ou de mauvaise performance\nContribuer à l’amélioration du service\nVotre Profil\nVous avez une première expérience en approvisionnement et/ou achats et appréciez les e r les réunions S&OP\nCette liste reste non exhaustive et pourra évoluer en fonction de vos attentes et de votre potentiel.\nProfil Recherché\nTitulaire d’un diplôme de niveau Bac +2/3 dans le domaine de l’approvisionnement, vous justifiez idéalement d’une première expérience réussie sur un poste similaire.\nVous avez de bonnes notions en achats, logistique et qualité, ainsi qu’une connaissance des flux logistiques et du transport (tracking, Incoterms), en tenant compte de la réglementation en vigueur.\nVous êtes à l’aise avec l’anglais (lu, écrit, parlé) et avec les outils informatiques (Pack Office). La connaissance du logiciel SAGE X3 serait un atout.\nAu-delà de vos compétences techniques, vous êtes reconnu(e) pour votre rigueur, votre sens de l’organisation et votre capacité d’analyse. Vous êtes d’un naturel dynamique avec un bon sens du relationnel, faites preuve de rigueur et d’organisation.\nEnfin, vous aimez le travail en équipe et vous souhaitez rejoindre un environnement stimulant ?\nAlors rejoignez-nous ! Ce poste est fait pour vous !"}, {"id": "op-fa21c7de2b2a", "source_id": "4478769610", "source_name": "LinkedIn Emplois", "title": "Chef d'Exploitation Logistique (H/F) - Bonneuil (95)", "company": "DHL Supply Chain", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Bonneuil-en-France (95)", "city_raw": "Bonneuil-en-France", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 87, "match_tags": ["Supply Chain & Pilotage des flux", "Devis & Prestataires"], "posted_iso": "2026-10-15", "posted_fr": "15 Octobre 2026", "verified_at_iso": "2026-11-11T05: avaux de rénovation énergétique. Accrédité par le Cofrac, Spekty s’inscrit dans la filière TIC (Testing, Inspection, Certification) pour vérifier la conformité, la performance et la durabilité des travaux réalisés partout en France.\n🎯 Notre raison d’être\nSécuriser la massification de la rénovation énergétique.\nAlors que des millions de logements doivent être rénovés dans les années à venir, nous faisons le choix de la rigueur, de l’exigence technique et de la pédagogie pour faire grandir une filière encore jeune et en pleine structuration.\nMission\nNotre force d’intervention terrain grandit, et notre équipe de coordination aussi ! Vous serez la personne qui aide nos équipes à donner le meilleur d’elles-mêmes.\nVos Missions Au Quotidien Seront De\nRéceptionner les nouvelles commandes et affecter les différentes missions aux techniciens\nRéaliser les plannings d'intervention et optimiser les tournées\nCommuniquer de façon quotidienne auprès des interlocuteurs internes et externes sur l'avancement des commandes\nCoordonner les équipes de techniciens, et s'assurer de l'application des standards et bonnes pratiques (process de travail, délais impartis à leurs missions, bonne transmission des informations, etc.)\nAssurer les relations entre les différents interlocuteurs du projet (clients, Chefs de projets, techniciens…)\nRépondre aux questions techniques et pratiques des équipes de techniciens à propos des contrôles à réaliser, le cas échéant - se coordonner avec les référents techniques internes sur les sujets complexes\nSuivre l'activité et gérer les différentes priorités au quotidien\nContribuer à l’excellence opérationnelle en proposant des améliorations sur l’ensemble des process et en partageant des bonnes pratiques\nL'équipe est jeune et dynamique avec de nombreux recrutements sur les 2 prochaines années. Les perspectives d'évolution sont donc rapides et réelles.\nPourquoi Spekty ?\nPour arriver dans une petite équipe au début d’une aventure ultra ambitieuse avec un très fort potentiel marché\nPour rejoindre un projet engagé qui participe à la transition énergétique\nPour avoir des responsabilités et un fort impact sur notre développement\nPour redorer le blason du marché de la rénovation énergétique, tout simplement !\nProfil\nTitulaire d’un diplôme Bac +2/+3 minimum, vous justifiez d’une première expérience réussie (stages et alternance inclus) en planification et/ou en ordonnancement d’équipes. Reconnu(e) pour votre rigueur et votre sens de l’organisation, vous savez allier diplomatie et sens des résultats, tout en gardant toujours en ligne de mire les objectifs de l’entreprise.\nDoté(e) d’un excellent relationnel, vous vous adaptez avec aisance à des interlocuteurs variés et appréciez le travail en équipe.\nLes +\nDe superbes bureaux tout neufs (avec une douche pour celles et ceux qui aiment faire du sport sur la pause déj !)\nCarte GET MUCHO (titres-resto, 9.85€/jour et cagnotte flex de 70€/mois)\nJusqu'à 50€ de prise en charge transports (Remboursement Passe Navigo ou forfait mobilité douce pour les adeptes du vélo)\nMutuelle Alan prise en charge à hauteur de 60%\nAccord d'intéressement\nRéférence de l'offre : f63n3bvtv1"}, {"id": "op-d86c34b525dc", "source_id": "4455782819", "source_name": "LinkedIn Emplois", "title": "Responsable d'Equipe Logistique (H/F), Responsable d’Equipe Logistique (Fulfilment Center)", "company": "Amazon", "logo_url": "", "sector": "Supply Chain, Flux & Achats", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "IDF_COURONNE", "zone_rank": 2, "zone_label": "Île-de-France (Couronne)", "city_display": "Brétigny-sur-Orge (91)", "city_raw": "Brétigny-sur-Orge", "family_id": "SUPPLY_CHAIN", "family_label": "Supply Chain, Flux & Achats", "family_short": "Supply Chain & Achats", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 83, "match_tags": ["  nouvelles pour proposer une gamme de produits plus large et de meilleure qualité, livrée rapidement et à un prix abordable.\nL’équipe CF est le premier maillon de la chaîne qui permet aux clients d’obtenir les produits à la vitesse qui fait notre réputation. Nous sommes basés dans les centres de traitement des commandes, qui sont au cœur du réseau des opérations d’Amazon. Nos centres sont parfois appelés le « premier kilomètre », car c’est là que la plupart des colis Amazon commencent leur voyage. Nous aidons à gérer les stocks dynamiques et à faciliter les livraisons rapides, 24 heures sur 24, 7 jours sur 7.\nNos centres de traitement des commandes regroupent des profils variés et les opportunités y sont nombreuses. Certains membres de l’équipe travaillent avec des produits physiques, tandis que d’autres analysent des données. Ensemble, nous travaillons pour que chacun puisse prendre des décisions éclairées dans toute l’entreprise.\nBasic Qualifications\nUn diplôme universitaire\nUne expérience significative dans la gestion des ressources humaines\nUne expérience dans la communication avec un large éventail de parties prenantes, y compris avec vos pairs et la direction\nUne expérience significative dans l’utilisation de données ou de témoignages pour influencer la prise de décisions de l’entreprise\nParfaite maîtrise de l’anglais et du français, à l’oral et à l’écri\nPreferred Qualifications\nLes compétences dites « souhaitables » vous aideront à tirer votre épingle du jeu mais elles ne sont pas nécessaires pour postuler à une offre chez Amazon. Si vous possédez toutes les compétences requises listées précédemment, contactez-nous sans plus tarder.\nConnaissance des techniques Lean, Six Sigma et Kaizen\nConnaissance d’un autre environnement logistique\nBonne maîtrise de la suite MS Office (Word, Excel, Outlook) dans un environnement professionnel\nAmazon est un employeur engagé pour l'égalité des chances. Nous sommes convaincus qu'une main d'oeuvre diversifée est essentielle à notre réussite. Nous prenons nos décisions de recrutement en fonction de votre expérience et de vos compétences. Nous apprécions votre envie de découvrir, d'inventer, de simplifier et de construire. La protection de votre vie privée et la sécurité de vos données constituent depuis longtemps une priorité absolue pour Amazon. Veuillez consulter notre Politique de Confidentialité pour en savoir plus sur la façon dont nous collectons, utilisons et traitons les données personnelles de nos candidats.\nOur inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https://amazon.jobs/content/en/how-we-hire/accommodations for more information. If the country/region you’re applying in isn’t listed, please contact your Recruiting Partner.\nCompany - Amazon France Logistique SAS\nJob ID: A10459810"}, {"id": "op-4b049c39b737", "source_id": "4477693804", "source_name": "LinkedIn Emplois", "title": "Coordinateur opérationnel en transfert d’entreprises F/H", "company": "Demeco Group", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Français", "salary_display": "2 300 € brut/mois", "has_salary": true, "salary_max_eur": 27600, "affinity_score": 89, "match_tags": ["Ouverture Tech & Coordination projet", "Écosystème Art & Expositions"], "posted_iso": "2026-10-09", "posted_fr": "9 Octobre 2026", "verified_at_iso": "2026-11-11T05:53:16Z", "url": "https://www.linkedin.com/jobs/view/4477693804/", "highlights": ["Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !", "Dans le cadre de notre développement, nous sommes à la recherche d'un Coordinateur opérationnel en transfert d’entreprises en CDI.", "Rattaché(e) au Chef de Projet et en lien avec les équipes opérationnelles, vous participez à la réussite des projets à haute valeur ajoutée en assurant la coordination complète des opérations sur le terrain.", "Vous veillez au bon déroulement des chantiers, de leur préparation jusqu'à leur réalisation, en garantissant le respect des délais, des exigences du client et des règles de sécurité."], "summary_excerpt": "Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !\nCréé en 1986, HEXVIA représente plus d’une cinquantaine de sociétés implantées au niveau européen. Groupe leader français dans le secteur de la mobilité, avec 140 M€ de chiffre d’affaires réalisés en 2026, nous comptons plus de 1300 collaborateurs rassemblés autour de valeurs communes : l’Humain, le Respect, la Force Collective et la Conquête.\nDemeco Entreprises, est la division du Groupe dédiée aux services des entreprises, propose depuis 40 ans des services sur-mesure à haute valeur ajoutée principalement auprès des grands groupes français, laboratoires, ", "full_description": "Rejoignez l’aventure HEXVIA : Alliés de votre mobilité !\nCréé en 1986, HEXVIA représente plus d’une cinquantaine de sociétés implantées au niveau européen. Groupe leader français dans le secteur de la mobilité, avec 140 M€ de chiffre d’affaires réalisés en 2026, nous comptons plus de 1300 collaborateurs rassemblés autour de valeurs communes : l’Humain, le Respect, la Force Collective et la Conquête.\nDemeco Entreprises, est la division du Groupe dédiée aux services des entreprises, propose depuis 40 ans des services sur-mesure à haute valeur ajoutée principalement auprès des grands groupes français, laboratoires, hôpitaux et lieux accueillant du public (évènementiel, hôtellerie, musées). Demeco Entreprises est spécialisés dans le conseil, l’organisation et l’exécution d’opérations de manutention, de transfert et de déménagement d’équipements à forte valeur ajoutée.\nDans le cadre de notre développement, nous sommes à la recherche d'un Coordinateur opérationnel en transfert d’entreprises en CDI.\nPourquoi venir chez nous ?\nNous délivrons nos services dans des environnements variés, allant de bureaux tertiaires, en passant par l’installation et l’aménagement complet d’espaces évènementiels ou touristiques, jusqu’au transfert « clef en main » de laboratoires ou d’hôpitaux complets.\nNos clients nous choisissent pour notre image de marque rassurante, notre professionnalisme, notre réactivité et notre fort esprit de service (EDF, Veolia, Servier, Alstom, Grand Palais de Paris, Ambassade des Etats-Unis…).\nDescription Du Poste\nRattaché(e) au Chef de Projet et en lien avec les équipes opérationnelles, vous participez à la réussite des projets à haute valeur ajoutée en assurant la coordination complète des opérations sur le terrain.\nVous veillez au bon déroulement des chantiers, de leur préparation jusqu'à leur réalisation, en garantissant le respect des délais, des exigences du client et des règles de sécurité.\nVos Principales Activités\nRéaliser chez les clients des visites techniques préparatoires à l’exécution des opérations ou dans le cadre d’appels d’offres\nChiffrer les besoins en équipements, moyens et ressources humaines\nEtablir des notes méthodologiques et des plannings qui répondent aux besoins des Clients\nOrganiser et encadrer ses équipes opérationnelles dans le respect des consignes et de la feuille de route du chef de projet (planifier, expliquer, accompagner, contrôler)\nContrôler le respect des consignes de sécurité et de qualité, le respect des délais et le bon déroulement des opérations\nCommuniquer en continu avec les représentants du Client\nÊtre force de proposition, décider et apporter des solutions lors de la réalisation du chantier\nParticiper aux opérations dans un esprit d’exemplarité des bonnes pratiques (15% du temps de travail, conduite d’engins le cas échéants)\nRéaliser les contrôles de conformité et la traçabilité en fin d’opération\nVous assurez l'interface entre le client, les équipes opérationnelles et les différents intervenants afin de garantir la bonne exécution des prestations. Véritable référent terrain, vous anticipez les besoins, coordonnez les moyens humains et matériels et apportez des solutions adaptées aux problématiques rencontrées durant les opérations.\nProfil recherché\nIdéalement issu(e) d'une formation dans le domaine du transport ou de la gestion de projets, vous justifiez d'une expérience significative de + 3 ans en pilotage de transferts (déménagements d’entreprises ou industries) ou en management logistique\nDoté(e) d'un excellent relationnel, vous savez fédérer les équipes, communiquer efficacement avec les clients et les différents intervenants, et faire preuve de réactivité face aux imprévus.\nAutonome, rigoureux(se) et organisé(e), vous êtes capable de gérer plusieurs opérations simultanément tout en garantissant le respect des délais, des consignes de sécurité et de la qualité de service.\nVous disposez de solides capacités managériales, d'un bon sens d'exemplarité, discrétion et d'écoute. Vous êtes à l'aise avec l'anticipation et savez prendre des décisions rapidement dans un environnement opérationnel exigeant.\nLa maîtrise des techniques liées au transfert administratif, la connaissance de la réglementation du transport ainsi que la lecture de plans constituent de véritables atouts pour réussir dans cette fonction.\nLa possession des permis PL/SPL, Caces R489 cat.3-4, Caces R486 Nacelle sont un plus. Casier judicier vierge impératif.\nDans le cadre de notre politique d'insertion professionnelle, nous examinons toutes les candidatures sur un pied d’égalité, y compris celles des personnes en situation de handicap ou en retour à l'emploi.\nSalaire Et Conditions\nType de contrat : CDI\nRémunération selon profil et expérience : 2300 € à 3 000 € sur 12 mois + Intéressement + avantages entreprise\nMutuelle, comité d’entreprise\nPoste basé à Paris (75) ou Roissy (95)\nDéplacements réguliers toute France\nDéplacements avec découchés 2 à 5 jours /mois\nLes exigences de certaines opérations peuvent imposer des amplitudes horaires importantes mais ponctuelles\nRattachement à une équipe de coordinateurs dédiés aux projets à grande envergure\nEntreprise en croissance offrant des possibilités d’évolution\nVous recherchez un poste opérationnel et challengeant alors n'hésitez plus et candidatez ! Toute l'équipe de Demeco Entreprises sera ravie de vous accueillir !"}, {"id": "op-318116fed6ec", "source_id": "4483208423", "source_name": "LinkedIn Emplois", "title": "Data Center IT Project Coordinator H/F/N", "company": "OVHcloud", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris et périphérie", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "Anglais", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 88, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux", "Tableaux de bord & Coûts"], "posted_iso": "2026-10-26", "posted_fr": "26 Octobre 2026", "verified_at_iso": "2026-11-11T05:51:45Z", "url": "https://www.linkedin.com/jobs/view/4483208423/", "highlights": ["Rejoignez l' équipe IT au cœur des opérations de nos Data Centres.", "Votre rôle : coordonner les projets, structurer les pratiques et piloter la performance de nos Data Centres à l'échelle mondiale.", "Vous serez au carrefour des équipes Projets, Planning, Supply Chain, CIO et opérations, avec un obj
