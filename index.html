analyser, sélectionner et déployer une solution de type TMS permettant d'optimiser la planification des tournées, l'affectation des ressources et la productivité opérationnelle. L'objectif est de compléter les outils métiers existants sans les remplacer.\nMissions principales\nAnalyser les processus de planification et d'exploitation actuels;\nIdentifier les problématiques terrain et les sources de non-productivité;\nRecueillir les besoins des exploitants et agents de planning;\nRéaliser une veille et un benchmark des solutions TMS et d'optimisation de tournées;\nConstruire les cahiers des charges fonctionnels;\nParticiper aux consultations et aux échanges avec les éditeurs;\nOrganiser et piloter les phases de test (POC);\nAccompagner le paramétrage et le déploiement de la solution retenue;\nAssurer le suivi des indicateurs de performance et du retour sur investissement;\nAccompagner la conduite du changement auprès des utilisateurs;\nAnalyser les données d'exploitation et identifier les gains potentiels.\nMissions secondaires\nAssurer ponctuellement le remplacement des agents de planning en cas d'absence ou de surcharge d'activité;\nParticiper à l'élaboration et à l'ajustement des tournées;\nAffecter les moyens humains et matériels nécessaires à l'exploitation;\nContribuer à la continuité de service de l'agence.\nBac +3 à Bac +5 en Transport, Logistique, Supply Chain, Gestion de Projet ou Systèmes d'Information.\nPremière expérience réussie dans le transport, la logistique ou l'exploitation.\nUne expérience sur un TMS ou un projet d'amélioration opérationnelle constitue un atout.\nBonne compréhension des enjeux d'exploitation transport.\nCapacité d'analyse, autonomie et esprit d'initiative.\nAisance relationnelle avec les équipes terrain et les partenaires externes\nA Savoir\nAgent de maîtrise au forfait jour\nCDI à pourvoir dès que possible\n13ème mois\nPrime sur objectif\nPrime de résultat / intéressement selon politique de l'entreprise"}, {"id": "op-c7e163706525", "source_id": "4480044836", "source_name": "LinkedIn Emplois", "title": "Junior Project Manager", "company": "Fever", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 1, "exp_label": "1–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 85, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux"], "posted_iso": "2026-10-22", "posted_fr": "22 Octobre 2026", "verified_at_iso": "2026-11-11T05:51:59Z", "url": "https://www.linkedin.com/jobs/view/4480044836/", "highlights": ["We’re Fever, the world’s leading tech platform for culture and live entertainment.", "Our mission? To democratize access to culture and entertainment. With our proprietary cutting-edge technology and data-driven approach, we’re revolutionizing the way people engage with live entertainment.", "To achieve our mission, we are looking for bar-raisers with a hands-on mindset who are eager to help shape the future of entertainment!", "Ready to be part of the experience?"], "summary_excerpt": "Hey there!\nWe’re Fever, the world’s leading tech platform for culture and live entertainment.\nOur mission? To democratize access to culture and entertainment. With our proprietary cutting-edge technology and data-driven approach, we’re revolutionizing the way people engage with live entertainment.\nEvery month, our platform inspires over 300 million people in +55 countries (and counting) to discover unforgettable experiences while also empowering event creators with our data and technology, helping them scale, innovate, and enhance their events to reach new audiences.\nOur results? We’ve teamed up with major indust", "full_description": "Hey there!\nWe’re Fever, the world’s leading tech platform for culture and live entertainment.\nOur mission? To democratize access to culture and entertainment. With our proprietary cutting-edge technology and data-driven approach, we’re revolutionizing the way people engage with live entertainment.\nEvery month, our platform inspires over 300 million people in +55 countries (and counting) to discover unforgettable experiences while also empowering event creators with our data and technology, helping them scale, innovate, and enhance their events to reach new audiences.\nOur results? We’ve teamed up with major industry leaders like Netflix, F.C. Barcelona, and Primavera Sound, presented international award-winning experiences, and are backed by several leading global investors! Impressive, right?\nTo achieve our mission, we are looking for bar-raisers with a hands-on mindset who are eager to help shape the future of entertainment!\nReady to be part of the experience?\nNow, let’s discuss this role and what you will do to help achieve Fever’s mission.\nAs part of the Fever Originals team, you will leverage data, market insights, and strong commercial instincts to create one-of-a-kind events and experiences that enable people to enjoy unforgettable moments. Our goal is to develop and scale innovative experiences while building strong relationships with venues, partners, and industry stakeholders.\nWho You'll Work With\nYou will join our office in Paris, working closely with internal teams while directly engaging with partners, providers, and venues across the market.\nIn this role, you will play a key part in growing Fever’s pipeline of original events. A significant part of your work will involve identifying, developing, and negotiating partnerships with venues and external stakeholders, while collaborating cross-functionally with departments such as Marketing, Operations, and Finance to bring experiences to life.\nThe team you will join is young, ambitious, and highly collaborative, composed of top profiles from companies such as McKinsey, Amazon, Google, KKR, Cirque du Soleil, PSG, and Roland Garros. Team members bring diverse cultural backgrounds and share a strong entrepreneurial mindset.\nEmployees are expected to work from the office Monday through Thursday, with the option to work remotely on Fridays.\nAbout the Role:\nAs a Junior Project Manager, you will work closely with your team to develop, launch, and manage Fever Originals experiences from concept to execution. The role combines project management, commercial development, and strategic partnerships, with a strong emphasis on venue negotiations, relationship management, and networking within the local entertainment and events ecosystem.\nWhen you join Fever, you will receive training and coaching to help you:\nIdentify and develop new business opportunities, including sourcing venues, partners, and collaborators for new event concepts\nLead venue sourcing and contract negotiations, securing optimal terms and building long-term partnerships with strategic venues\nEnsure the financial and operational feasibility of our events by analyzing and reporting on key metrics\nDrive revenue growth by optimizing ticket sales strategies and identifying opportunities to expand event reach\nAnalyze business performance, including P&L tracking, forecasting, and operational efficiency improvements\nCollaborate cross-functionally with Marketing, Operations, Legal, and Finance teams to ensure successful event launches and smooth operations\nScale successful experiences across additional cities and markets by building replicable operational models\nEnsure high-quality experiences, maintaining strong standards for customer satisfaction and operational delivery\nAbout You:\nWe are looking for someone who combines a strong commercial mindset, relationship-building abilities, and analytical thinking, with a proactive approach to developing partnerships and growing the business.\n1+ years of experience in project management, operations, consulting, business development, partnerships, or similar roles (this role is not primarily suited for traditional event planners)\nFrench on a native level as well as fluency in English with excellent communication skills. Spanish is a plus!\nStrong negotiation and networking skills, with the ability to build meaningful partnerships: you’re not afraid of picking up the phone and pitching to potential new partners\nExceptional organizational and project management skills, with the ability to plan, prioritize, and drive multiple workstreams to successful completion.\nResilient and results-driven, able to perform under pressure, take ownership, and manage several high-impact projects in parallel.\nProven ability to build and maintain strong relationships with venues, partners, brands, and stakeholders\nExcellent analytical skills, with the ability to use data to guide decision-making\nHighly solution-oriented, able to identify challenges and develop practical strategies to resolve them\nAbility to work and thrive in fast-paced environments and willingness to grow within the organization\nWhat You'll Get\nAttractive compensation package.\nOpportunity to have a real impact in a high-growth global category leader\n40% discount on all Fever events and experiences\nPrivate health insurance\nMeal tickets\nSubsidised transport card\nFlexible remuneration\nWork in the heart of the city, with possible travel across our markets\nResponsibility from day one and professional and personal growth\nGreat work environment with a young, international team of talented people to work with!\nOur Hiring Process:\nA 30 min video call with one of our Talent Acquisition Managers, to better understand your career plan, assess cultural fit and answer any questions you may have\nA 60 min online test with three topics: logic, analytics and written understanding\nA 30 min conversation with your future manager\nA 45 min video call with your future manager, including questions about your profile and a business case presentation (to be prepared in advance)\nYou will join a team of highly effective, motivated, and entrepreneurial professionals who move fast, take ownership, and get things done. Cultural fit means being humble, open to feedback, and willing to learn, while approaching challenges as opportunities and making decisions based on data and insight. We value individuals who are hands-on, collaborative, and able to prioritize what truly drives results. We encourage applicants from diverse and unconventional backgrounds, especially those who bring curiosity, a willingness to learn, and the drive to make a meaningful impact.\nThis role is based in Paris\nThank you for considering joining Fever. We cannot wait to learn more about you!\nIf you want to learn more about us: Fever's Blog | Tech.Eu |TechCrunch\nFever is committed to creating an inclusive and diverse workspace where everyone's background and ideas count. Our main goal is to find the best possible talent regardless of place of birth, racial or ethnic origin, gender, gender identity, , opinion, sexual orientation, disability, pregnancy, marital status, age or caring responsibilities. We encourage everyone to apply!\nIf you require any kind of accommodation during the selection process please contact our Talent team so we can help you by providing a welcoming and seamless journey.\nIf you want to know more about how Fever processes your personal data, click here Fever - Candidate Privacy Notice"}, {"id": "op-3c92d405f874", "source_id": "6107420004", "source_name": "Mirakl Careers", "title": "Junior Workplace Experience Coordinator", "company": "Mirakl", "logo_url": "", "sector": "Marketplace & E-Commerce Supply SaaS", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris, France", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 2, "exp_label": "2–3 ans d'exp.", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 85, "match_tags": ["Ouverture Tech & Coordination projet", "Devis & Prestataires"], "posted_iso": "2026-11-04", "posted_fr": "4 Novembre 2026", "verified_at_iso": "2026-11-11T05:50:35Z", "url": "https://job-boards.greenhouse.io/mirakl/jobs/6107420004", "highlights": ["Founded in 2012, Mirakl has been at the forefront of marketplace innovation, empowering every business to compete in the platform economy.", "For more information, visit www.mirakl.com.", "🗓️ Founded in 2012 | Member of French Tech Next40", "👥 750+ employees in 9 offices worldwide: Paris, Barcelona, Bordeaux, Boston, London, Munich, New York, Sydney, Tokyo"], "summary_excerpt": "About Mirakl:\nFounded in 2012, Mirakl has been at the forefront of marketplace innovation, empowering every business to compete in the platform economy.\nToday, Mirakl’s operating system combines an enterprise marketplace solution (Mirakl Platform) that enables retailers and B2B organizations to launch, scale, and operate marketplaces and dropship, AI-powered multichannel selling (Mirakl Connect), retail media (Mirakl Ads) and an agentic commerce infrastructure (Mirakl Nexus).\nWith dual headquarters in Boston and Paris, Mirakl helps a global ecosystem of 450+ marketplaces (B2C and B2B) and a network of over 100k t", "full_description": "About Mirakl:\nFounded in 2012, Mirakl has been at the forefront of marketplace innovation, empowering every business to compete in the platform economy.\nToday, Mirakl’s operating system combines an enterprise marketplace solution (Mirakl Platform) that enables retailers and B2B organizations to launch, scale, and operate marketplaces and dropship, AI-powered multichannel selling (Mirakl Connect), retail media (Mirakl Ads) and an agentic commerce infrastructure (Mirakl Nexus).\nWith dual headquarters in Boston and Paris, Mirakl helps a global ecosystem of 450+ marketplaces (B2C and B2B) and a network of over 100k third-party marketplace sellers. Brands like Macy’s, Decathlon, Carrefour, Asos, and Airbus Helicopters use Mirakl to grow their businesses in new and remarkable ways.\nFor more information, visit www.mirakl.com.\nMirakl in Numbers:\n🗓️ Founded in 2012 | Member of French Tech Next40\n👥 750+ employees in 9 offices worldwide: Paris, Barcelona, Bordeaux, Boston, London, Munich, New York, Sydney, Tokyo\nOur Values:\nWorking at Mirakl means accelerating your career alongside ambitious, passionate, and supportive colleagues. We're proud of the diversity of backgrounds, perspectives, and experiences that make our teams unique.\nOur 5 values guide how we collaborate:\n💡 Work Hard Together: Teamwork and collaboration are the foundation of our success\n🏆 Get Things Done: We prioritize action and efficiency for impactful results\n🚀 Go Above & Beyond: We tackle challenges proactively and always aim for excellence\n🎓 Succeed Through Expertise: Knowledge sharing and continuous learning are core to our culture\n🤝 Satisfy & Empower Clients: We're committed to our clients' success\nThe Team You'll Join\nYou'll be part of our Workplace Experience team led by Rémi Beaussart and Jacqueline Ngom.\nYou will be in charge of ensuring a smooth operational running of our office in Paris, with a focus on ensuring the best possible working conditions for all Mirakl workers. You will be based in Paris and will oversee the day-to-day operations of our 3200m² office, ensuring all facilities are maintained to the highest standards. At Mirakl, the office is more than a workplace, it's where collective energy, collaboration and culture come alive. As Workplace Experience Coordinator, you'll be at the heart of making our offices places people genuinely want to come to.\nYour Impact\nAs Mirakl continues to invest in bringing its teams together, the office experience has never been more central to how we work.\nAs Coordinator, Workplace Experience, you will be the backbone of our Paris office — ensuring our 3,200 m² space runs seamlessly and that every employee feels supported, at ease, and set up to thrive.\nEmployee Well-being and Satisfaction\nRespond promptly to daily requests from Mirakl workers through our ticketing system, prioritizing their satisfaction and ensuring the best possible workplace experience.\nBe the go-to person for employees' needs and queries\nContract & Supplier Management / Safety and Compliance\nAct as the primary contact for our business partners\nManage contracts and relationships with suppliers including cleaning services, technical maintenance, health & safety, green plants maintenance, and provision of snacks & refreshments\nProactively anticipate future needs and coordinate with vendors as required\nEnsure the office complies with all health and safety regulations, creating a safe working environment for all employees\nOperational Excellence\nSupport the WPE Manager on its activity and act as their back up as needed\nDevelop and/or implement operational procedures and policies that streamline our workplace functions\nIdentify opportunities for enhancing operational standards and efficiency\nLeverage AI to elevate Workplace Experience excellence\nCommunity Engagement and Event Support\nBe the logistical support for all internal events organized by various departments.\nUtilize your creativity and service mindset to contribute to a vibrant workplace community.\nAssist the Workplace Experience Manager in large event projects\nWhat You'll Bring to the Role\nExperience\n2+ years of experience in a similar Workplace, Facilities, or Office Management role (internships and apprenticeships included)\nProven track record of managing multiple priorities in a fast-paced environment with a strong service mindset\nExperience working with suppliers and managing contracts or vendor relationships\nSkills\nGreat interpersonal skills : you build trust easily with colleagues at all levels and external partners\nHighly organized and detail-oriented, with the ability to juggle competing priorities without dropping the ball\nProactive problem-solver who knows when to act independently and when to escalate\nStrong written and verbal communication skills (both in French and English)\nFlexible and resilient, comfortable adapting to changing priorities\nTools Used\nSiiT (ticketing system)\nGmail & Google Workspace (Docs, Sheets, Calendar, etc.)\nAI tools (Dust)\nLanguages\nFrench: Fluent\nEnglish: Professional\nCompensation, Perks & Benefits\n🏥 Health & Wellness: 100% health insurance coverage + yoga classes, fitness sessions and team breakfasts to keep you energized\n🍽️ Daily Perks: Swile meal voucher card\n🚲 Sustainable Transportation: Monthly bike leasing subscription or 50% Navigo reimbursement\n👶 Parental Support: Enhanced parental leave, including one month of fully paid leave for the second parent\n🚀 Career Growth: Access to tailored development programs and clear pathways for professional advancement\n🎉 Team Engagement: Regular team-building activities and company-wide offsite events\nOur Hiring Process\nWe warmly encourage you to apply to any of our roles, even if you think you're not an exact match.\nPlease click the \"Apply\" button to submit your application — this helps us make the best possible assessment and get back to you as quickly as possible.\nIntro Call — Get to know each other with a Talent Acquisition Specialist, discuss your background and answer your questions about Mirakl\nHiring Manager Interview — Deep dive with Rémi and Jacqueline on your experience, approach, and motivation\nValues Fit Interviews — Two structured interviews using the STAR methodology to assess alignment with our 5 core values\nFinal Decision & Offer — We move quickly and provide clear, transparent feedback\nWe welcome collaborators with their diverse perspectives and experiences to power us forward. These often far exceed conventional job requirements and help us create a culture of continuous learning. If you’re ready to join a global leader powering digital transformation for 450+ of the world’s most innovative retailers and B2B organizations.\nAs part of our recruitment process, Mirakl processes your personal data to review and manage your application and, where appropriate, to consider your profile for future opportunities. You can exercise your data protection rights at any time, and as further detailed in our policies. For more information about how we process your personal data and your rights, please consult our Recruitment Privacy Notice, here in English and here in French.\nWe may use Artificial Intelligence (AI) solutions to help streamline our hiring process, including screening applications, analyzing resumes, and assessing responses. While AI helps us work efficiently, all final hiring decisions are made by humans. For more information, visit our AI Guidelines for Candidates and Interviews."}, {"id": "op-f604d7aa4192", "source_id": "4487338531", "source_name": "LinkedIn Emplois", "title": "Implementation specialist", "company": "REVERS.IO", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Ville de Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 85, "match_tags": ["Ouverture Tech & Coordination projet", "Devis & Prestataires"], "posted_iso": "2026-11-06", "posted_fr": "6 Novembre 2026", "verified_at_iso": "2026-11-11T05:52:00Z", "url": "https://www.linkedin.com/jobs/view/4487338531/", "highlights": ["Deploy the platform at new clients, from scoping to go-live (3 to 9 months), with the product and tech teams", "Gather client requirements and design solutions", "Configure the rules engine and set up workflows in our dedicated editor", "Run accounts in production: follow-up, changes, and complex requests clients cannot resolve alone (analysis, diagnosis, fix, or escalation to the right team)"], "summary_excerpt": "Revers.io is a SaaS platform that digitalizes and automates after-sales operations for retailers and e-merchants: returns, repairs, warranties and second life. Built as an operating system for after-sales, it brings together requests from every channel, uses a rules engine to decide what happens next, and connects carriers, repairers, suppliers and warehouses.\nWith its MCP architecture, its Companion AI agents and configurable workflows, Revers.io helps clients such as Carrefour, Auchan, Fnac and Maisons du Monde serve their customers better, cut operating costs and handle after-sales requests faster.\nResponsibil", "full_description": "Revers.io is a SaaS platform that digitalizes and automates after-sales operations for retailers and e-merchants: returns, repairs, warranties and second life. Built as an operating system for after-sales, it brings together requests from every channel, uses a rules engine to decide what happens next, and connects carriers, repairers, suppliers and warehouses.\nWith its MCP architecture, its Companion AI agents and configurable workflows, Revers.io helps clients such as Carrefour, Auchan, Fnac and Maisons du Monde serve their customers better, cut operating costs and handle after-sales requests faster.\nResponsibilities\nDeploy the platform at new clients, from scoping to go-live (3 to 9 months), with the product and tech teams\nGather client requirements and design solutions\nConfigure the rules engine and set up workflows in our dedicated editor\nRun accounts in production: follow-up, changes, and complex requests clients cannot resolve alone (analysis, diagnosis, fix, or escalation to the right team)\nProfile\nmin 2 years in implementation, delivery or customer success on B2B SaaS\nGenuine interest in algorithmic logic: execution conditions, variables, key activation. This is the core of the configuration work.\nWorking knowledge of Jira\nAble to read an API (Postman, Swagger) and qualify a bug before escalating it\nFluent English and French, other languages are much appreciated\nA plus: experience in retail, after-sales service or logistics\nEnvironment\nWe use Jira, Notion, Postman, Swagger, Datadog and Claude every day. Notion serves as both our knowledge base and our project tracker.\nWhat we offer\nHelp build the reference platform for after-sales operations management in Europe\nNew offices at the Morning, across from Bercy, near the François Mitterrand Library: startup ecosystem, gym, rooftop\nMeal vouchers and Axa health insurance\nA role in the Services team, working directly with major accounts\nPermanent contract (CDI), starting as soon as possible\nRemote work (hybrid)\nHiring process\nQualification call\nPractical case in person in front of the Services team (1h30)\nInterview with Vincent (CEO)"}, {"id": "op-dd9174900b82", "source_id": "4461972059", "source_name": "LinkedIn Emplois", "title": "Project Operation Specialist", "company": "Adyen", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations & Projet", "min_years": 0, "exp_label": "Junior / 1–3 ans (Bac+3 OK)", "lang_badge": "FR / EN", "salary_display": "Salaire non précisé", "has_salary": false, "salary_max_eur": 0, "affinity_score": 85, "match_tags": ["Ouverture Tech & Coordination projet", "Flux internationaux"], "posted_iso": "2026-11-08", "posted_fr": "8 Novembre 2026", "verified_at_iso": "2026-11-11T05:51:46Z", "url": "https://www.linkedin.com/jobs/view/4461972059/", "highlights": ["Project Operations Specialists drive the successful implementation of payment, platform, and banking solutions for our customers, ensuring a seamless, high-quality experience every step of the way.", "Manage customer implementation projects from onboarding through go-live, taking ownership for project progress, stakeholder alignment, and successful delivery.", "Coordinate tasks, timelines, and follow-ups across internal and external stakeholders;", "Work closely with customer project and technical teams to support smooth rollouts;"], "summary_excerpt": "This is Adyen\nAdyen provides payments, data, and financial products in a single solution for customers like Meta, Uber, H&M, and Microsoft - making us the financial technology platform of choice. At Adyen, everything we do is engineered for ambition.\nFor our teams, we create an environment with opportunities for our people to succeed, backed by the culture and support to ensure they are enabled to truly own their careers. We are motivated individuals who tackle unique technical challenges at scale and solve them as a team. Together, we deliver innovative and ethical solutions that help businesses achieve their am", "full_description": "This is Adyen\nAdyen provides payments, data, and financial products in a single solution for customers like Meta, Uber, H&M, and Microsoft - making us the financial technology platform of choice. At Adyen, everything we do is engineered for ambition.\nFor our teams, we create an environment with opportunities for our people to succeed, backed by the culture and support to ensure they are enabled to truly own their careers. We are motivated individuals who tackle unique technical challenges at scale and solve them as a team. Together, we deliver innovative and ethical solutions that help businesses achieve their ambitions faster.\nProject Operations Specialist\nProject Operations Specialists drive the successful implementation of payment, platform, and banking solutions for our customers, ensuring a seamless, high-quality experience every step of the way.\nIn this role, you will work closely with customers and internal teams to coordinate project activities, support operational execution, and help ensure successful rollouts on Adyen’s platform. You will apply and expand your expertise in project delivery, stakeholder coordination, operational processes, and Adyen’s products.\nWhat You’ll Do\nManage customer implementation projects from onboarding through go-live, taking ownership for project progress, stakeholder alignment, and successful delivery.\nCoordinate tasks, timelines, and follow-ups across internal and external stakeholders;\nWork closely with customer project and technical teams to support smooth rollouts;\nGuiding merchants on implementation best practices and helping them make informed rollout decisions.\nIndependently prepare for, participate in, and run customer meetings, ensuring clear actions, ownership, and next steps.\nSupport scalable operational handovers and business-as-usual setup after go-live;\nTroubleshoot operational issues and collaborate with internal teams to resolve blockers;\nBuild foundational expertise across Adyen’s products, operational processes, and project delivery methodologies;\nContribute operational feedback to improve project execution and customer experience.\nWho You Are\nExperienced in project coordination or delivery, operations, customer-facing roles, or technical project environments;\nStrong organizational and communication skills with attention to detail;\nComfortable managing multiple priorities in a fast-paced environment;\nCustomer-focused mindset with strong collaboration skills;\nInterested in technical systems, operational processes, and project delivery;\nAble to work effectively with international and cross-functional teams;\nFluency in French and English required. Additional European languages are a plus;\nWillingness to travel domestically and internationally where required.\nOur Diversity, Equity and Inclusion commitments\nOur unique approach is a product of our diverse perspectives. This diversity of backgrounds and cultures is essential in helping us maintain our momentum. Our business and technical challenges are unique, and we need as many different voices as possible to join us in solving them - voices like yours. No matter who you are or where you’re from, we welcome you to be your true self at Adyen.\nStudies show that women and members of underrepresented communities apply for jobs only if they meet 100% of the qualifications. Does this sound like you? If so, Adyen encourages you to reconsider and apply. We look forward to your application!\nWhat’s next?\nEnsuring a smooth and enjoyable candidate experience is critical for us. We aim to get back to you regarding your application within 5 business days. Our interview process tends to take about 4 weeks to complete, but may fluctuate depending on the role. Learn more about our hiring process here. Don’t be afraid to let us know if you need more flexibility.\nThis role is based out of our Paris office. We are an office-first company and value in-person collaboration; we do not offer remote-only roles.\nOnly applications submitted in English language will be considered."}, {"id": "op-e5ee5ba89d3f", "source_id": "4488897944", "source_name": "LinkedIn Emplois", "title": "Assistant chef de projet IT H/F", "company": "norsys", "logo_url": "", "sector": "Opérations & Gestion de Projet", "contract_type": "CDI", "is_graduate_program": false, "zone_id": "PARIS_75", "zone_rank": 1, "zone_label": "Paris (75)", "city_display": "Paris (75)", "city_raw": "Paris", "family_id": "TECH_PROJECT_OPS", "family_label": "Opérations & Gestion de Projet", "family_short": "Opérations &   <script>
    (() => {
      const STORAGE_KEY = "atelier_flux_yoan_state_v1";
      const payloadRaw = document.getElementById("embedded-offers-data").textContent;
      const DATA = JSON.parse(payloadRaw);
      const LIVE_OFFERS = Array.isArray(DATA.offers) ? DATA.offers : [];
      const COMPANY_LOGOS = DATA.logos || {};
      const META = DATA.meta || {};

      const STATUS_LABELS = {
        saved: "À postuler",
        applied: "Postulé",
        interview: "Entretien",
        offer: "Offre reçue",
        hidden: "Masquée"
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { statuses: {}, notes: {}, snapshots: {} };
          const parsed = JSON.parse(raw);
          return {
            statuses: parsed.statuses || {},
            notes: parsed.notes || {},
            snapshots: parsed.snapshots || {}
          };
        } catch (e) {
          return { statuses: {}, notes: {}, snapshots: {} };
        }
      }

      let userState = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
        } catch (e) {}
        updateTrackedCounter();
      }

      const filters = {
        q: "",
        family: "ALL",
        zone: "ALL",
        contract: "ALL",
        onlyArt: false,
        onlySalary: false,
        onlyGrad: false,
        showHidden: false,
        sort: "relevance"
      };

      let selectedOfferId = LIVE_OFFERS.length > 0 ? LIVE_OFFERS[0].id : null;
      let activeView = "catalog";

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function foldAccents(str) {
        return String(str ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function safeExternalUrl(u) {
        const s = String(u || "").trim();
        if (s.startsWith("https://") || s.startsWith("http://")) return s;
        return "#";
      }

      function compLogoKey(company) {
        return String(company || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      }

      function companyInitials(company) {
        const words = String(company || "").trim().split(/[\s\-+&/.]+/).filter(Boolean);
        if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
        return String(company || "OP").slice(0, 2).toUpperCase();
      }

      function renderCompanyLogo(offer, sizeCls) {
        const key = compLogoKey(offer.company);
        const src = COMPANY_LOGOS[key] || (offer.logo_url && offer.logo_url.startsWith("https://") ? offer.logo_url : "");
        const initials = escapeHtml(companyInitials(offer.company));
        const fam = escapeHtml(offer.family_id || "SUPPLY_CHAIN");
        const cls = sizeCls ? `company-logo-box ${sizeCls}` : "company-logo-box";
        if (src) {
          return `<div class="${cls}"><img src="${escapeHtml(src)}" alt="Logo ${escapeHtml(offer.company)}" /></div>`;
        }
        return `<div class="${cls}" style="padding:2px;"><span class="company-monogram mono-${fam}">${initials}</span></div>`;
      }

      function snapshotOffer(offer) {
        if (!offer || !offer.id) return;
        userState.snapshots[offer.id] = {
          id: offer.id,
          title: offer.title,
          company: offer.company,
          logo_url: offer.logo_url || "",
          city_display: offer.city_display,
          contract_type: offer.contract_type,
          salary_display: offer.salary_display,
          has_salary: offer.has_salary,
          family_id: offer.family_id,
          family_short: offer.family_short,
          family_label: offer.family_label,
          exp_label: offer.exp_label,
          lang_badge: offer.lang_badge,
          url: offer.url,
          posted_fr: offer.posted_fr,
          highlights: offer.highlights || [],
          full_description: offer.full_description || ""
        };
      }

      function setOfferStatus(offerId, newStatus) {
        const offer = LIVE_OFFERS.find(o => o.id === offerId) || userState.snapshots[offerId];
        if (userState.statuses[offerId] === newStatus) {
          delete userState.statuses[offerId];
        } else {
          userState.statuses[offerId] = newStatus;
          if (offer) snapshotOffer(offer);
        }
        saveState();
        renderAll();
      }

      function setOfferNote(offerId, text) {
        const offer = LIVE_OFFERS.find(o => o.id === offerId) || userState.snapshots[offerId];
        const trimmed = String(text || "");
        if (!trimmed.trim()) {
          delete userState.notes[offerId];
        } else {
          userState.notes[offerId] = trimmed;
          if (offer) snapshotOffer(offer);
        }
        saveState();
      }

      function matchesBaseSearchAndToggles(o, ignoreAxis) {
        const st = userState.statuses[o.id];
        if (st === "hidden" && !filters.showHidden) return false;
        if (filters.onlyArt && o.family_id !== "ART_LOGISTICS") return false;
        if (filters.onlySalary && !o.has_salary) return false;
        if (filters.onlyGrad && !o.is_graduate_program && o.contract_type !== "Graduate Program") return false;

        if (ignoreAxis !== "family" && filters.family !== "ALL" && o.family_id !== filters.family) return false;
        if (ignoreAxis !== "zone" && filters.zone !== "ALL" && o.zone_id !== filters.zone) return false;
        if (ignoreAxis !== "contract" && filters.contract !== "ALL" && o.contract_type !== filters.contract) return false;

        if (filters.q) {
          const hay = foldAccents(
            `${o.title} ${o.company} ${o.city_display} ${o.sector} ${o.salary_display} ${(o.match_tags || []).join(" ")} ${o.summary_excerpt || ""}`
          );
          const terms = foldAccents(filters.q).split(/\s+/).filter(Boolean);
          for (const t of terms) {
            if (!hay.includes(t)) return false;
          }
        }
        return true;
      }

      function getFilteredOffers() {
        const list = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, null));
        const famRank = { ART_LOGISTICS: 0, SUPPLY_CHAIN: 1, TECH_PROJECT_OPS: 2 };
        list.sort((a, b) => {
          if (filters.sort === "recent") {
            return String(b.posted_iso || "").localeCompare(String(a.posted_iso || "")) || (b.affinity_score - a.affinity_score);
          }
          if (filters.sort === "salary") {
            if (Boolean(b.has_salary) !== Boolean(a.has_salary)) return b.has_salary ? 1 : -1;
            if ((b.salary_max_eur || 0) !== (a.salary_max_eur || 0)) return (b.salary_max_eur || 0) - (a.salary_max_eur || 0);
            return b.affinity_score - a.affinity_score;
          }
          // Default: trajectory relevance (Art spotlight -> Supply Chain -> Tech Ops, then score)
          const frA = famRank[a.family_id] ?? 9;
          const frB = famRank[b.family_id] ?? 9;
          if (frA !== frB) return frA - frB;
          if (b.affinity_score !== a.affinity_score) return b.affinity_score - a.affinity_score;
          return (a.zone_rank || 9) - (b.zone_rank || 9);
        });
        return list;
      }

      function updateDynamicCounts() {
        ["ALL", "ART_LOGISTICS", "SUPPLY_CHAIN", "TECH_PROJECT_OPS"].forEach(fam => {
          const el = document.querySelector(`[data-count-fam="${fam}"]`);
          if (!el) return;
          const n = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, "family") && (fam === "ALL" || o.family_id === fam)).length;
          el.textContent = String(n);
        });

        ["ALL", "PARIS_75", "IDF_93", "IDF_COURONNE", "REMOTE_FR"].forEach(zn => {
          const el = document.querySelector(`[data-count-zone="${zn}"]`);
          if (!el) return;
          const n = LIVE_OFFERS.filter(o => matchesBaseSearchAndToggles(o, "zone") && (zn === "ALL" || o.zone_id === zn)).length;
          el.textContent = String(n);
        });

        const hiddenCount = LIVE_OFFERS.filter(o => userState.statuses[o.id] === "hidden").length;
        const hiddenWrap = document.getElementById("hidden-counter-wrap");
        const hiddenBtn = document.getElementById("toggle-show-hidden-btn");
        if (hiddenCount > 0) {
          hiddenWrap.style.display = "inline";
          hiddenBtn.textContent = filters.showHidden
            ? `Masquer à nouveau (${hiddenCount})`
            : `Afficher les offres masquées (${hiddenCount})`;
        } else {
          hiddenWrap.style.display = "none";
        }

        const anyFilter =
          filters.q !== "" ||
          filters.family !== "ALL" ||
          filters.zone !== "ALL" ||
          filters.contract !== "ALL" ||
          filters.onlyArt ||
          filters.onlySalary ||
          filters.onlyGrad;
        document.getElementById("reset-filters-btn").style.display = anyFilter ? "inline-block" : "none";
        document.getElementById("clear-search-btn").style.display = filters.q ? "block" : "none";
      }

      function updateTrackedCounter() {
        const trackedIds = Object.keys(userState.statuses).filter(id => {
          const s = userState.statuses[id];
          return s && s !== "hidden";
        });
        document.getElementById("nav-tracked-count").textContent = String(trackedIds.length);
      }

      function renderOfferList(filtered) {
        const container = document.getElementById("offer-list-container");
        const counterText = document.getElementById("results-counter-text");
        counterText.textContent = `${filtered.length} opportunité${filtered.length > 1 ? "s" : ""} active${filtered.length > 1 ? "s" : ""} sur ${LIVE_OFFERS.length}`;

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p style="font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-950);margin-bottom:6px;">Aucune offre ne correspond à ce croisement de filtres</p>
              <p style="font-size:13px;">Essaie d'élargir la zone Île-de-France ou de réinitialiser les filtres actifs.</p>
            </div>
          `;
          return;
        }

        if (!selectedOfferId || !filtered.some(o => o.id === selectedOfferId)) {
          selectedOfferId = filtered[0].id;
        }

        container.innerHTML = filtered.map(o => {
          const isSel = o.id === selectedOfferId;
          const st = userState.statuses[o.id];
          const polePrefix = o.family_id === "ART_LOGISTICS" ? "★ " : "";
          const salHtml = o.has_salary
            ? `<span class="salary-pill-yes">${escapeHtml(o.salary_display)}</span>`
            : `<span class="salary-pill-no">Salaire non précisé</span>`;
          const statusHtml = st && STATUS_LABELS[st]
            ? `<span class="status-dot-pill">${escapeHtml(STATUS_LABELS[st])}</span>`
            : "";

          return `
            <article class="offer-card ${isSel ? "selected" : ""}" data-offer-id="${escapeHtml(o.id)}">
              <div class="card-top-meta">
                <span class="pole-tag pole-${escapeHtml(o.family_id)}">${polePrefix}${escapeHtml(o.family_short)}</span>
                <span class="zone-stamp">${escapeHtml(o.city_display)}</span>
              </div>
              <div class="card-brand-row">
                ${renderCompanyLogo(o, "")}
                <div class="card-brand-text">
                  <h2 class="card-title">${escapeHtml(o.title)}</h2>
                  <div class="card-company">${escapeHtml(o.company)}</div>
                </div>
              </div>
              <div class="card-bottom-meta">
                <div class="meta-pills">
                  <span class="mono-pill">${escapeHtml(o.contract_type)}</span>
                  <span class="mono-pill">${escapeHtml(o.lang_badge)}</span>
                  ${salHtml}
                </div>
                ${statusHtml}
              </div>
            </article>
          `;
        }).join("");

        container.querySelectorAll(".offer-card").forEach(card => {
          card.addEventListener("click", () => {
            selectedOfferId = card.getAttribute("data-offer-id");
            renderOfferList(filtered);
            renderDetailPane(filtered);
            if (window.innerWidth <= 940) {
              document.getElementById("detail-pane").classList.add("mobile-open");
            }
          });
        });
      }

      function renderDetailPane(filtered) {
        const pane = document.getElementById("detail-pane");
        const offer = filtered.find(o => o.id === selectedOfferId) || LIVE_OFFERS.find(o => o.id === selectedOfferId);
        if (!offer) {
          pane.innerHTML = `<div class="empty-state">Sélectionne une opportunité dans la liste pour afficher le descriptif complet.</div>`;
          return;
        }

        const st = userState.statuses[offer.id] || "";
        const noteVal = userState.notes[offer.id] || "";
        const polePrefix = offer.family_id === "ART_LOGISTICS" ? "★ " : "";
        const salClass = offer.has_salary ? "sal-highlight" : "sal-muted";
        const salText = offer.has_salary ? offer.salary_display : "Salaire non précisé";

        const tagsHtml = (offer.match_tags || []).map(
          t => `<span class="match-tag">${escapeHtml(t)}</span>`
        ).join("");

        const highlightsHtml = (offer.highlights && offer.highlights.length > 0)
          ? `<h3 class="section-subtitle">Points clés du poste</h3>
             <ul class="highlights-list">
               ${offer.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join("")}
             </ul>`
          : "";

        const dateLine = (offer.posted_iso && offer.posted_iso < "2026-10-01")
          ? `Vérifiée active le ${escapeHtml(META.updated_at_fr || "4 Novembre 2026")} · ${escapeHtml(offer.source_name)}`
          : `Publiée le ${escapeHtml(offer.posted_fr)} · ${escapeHtml(offer.source_name)}`;

        pane.innerHTML = `
          <div class="mobile-close-bar">
            <button type="button" class="mobile-back-btn" id="mobile-close-detail-btn">← Retour aux offres</button>
            <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-500);">${escapeHtml(offer.city_display)}</span>
          </div>

          <div class="detail-header">
            <div class="detail-kicker">
              <span class="pole-tag pole-${escapeHtml(offer.family_id)}">${polePrefix}${escapeHtml(offer.family_label)}</span>
              <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-500);">${dateLine}</span>
            </div>
            <div class="card-brand-row" style="align-items:center;gap:14px;">
              ${renderCompanyLogo(offer, "logo-lg")}
              <div class="card-brand-text">
                <h2 class="detail-title" style="margin-bottom:4px;">${escapeHtml(offer.title)}</h2>
                <div class="detail-company-line">${escapeHtml(offer.company)} · <span style="color:var(--ink-500);font-weight:400;">${escapeHtml(offer.sector)}</span></div>
              </div>
            </div>
            <div class="cta-row">
              <a class="primary-apply-btn" href="${escapeHtml(safeExternalUrl(offer.url))}" target="_blank" rel="noopener noreferrer">
                Voir l'offre et postuler ↗
              </a>
            </div>
          </div>

          <div class="spec-grid">
            <div class="spec-cell">
              <div class="spec-label">Localisation</div>
              <div class="spec-val">${escapeHtml(offer.city_display)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Rémunération</div>
              <div class="spec-val ${salClass}">${escapeHtml(salText)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Contrat &amp; Expérience</div>
              <div class="spec-val">${escapeHtml(offer.contract_type)} · ${escapeHtml(offer.exp_label)}</div>
            </div>
            <div class="spec-cell">
              <div class="spec-label">Langues</div>
              <div class="spec-val">${escapeHtml(offer.lang_badge)}</div>
            </div>
          </div>

          ${tagsHtml ? `<div class="match-tags-row">${tagsHtml}</div>` : ""}

          <div class="pipeline-box">
            <div class="pipeline-label">Classer dans mon suivi</div>
            <div class="pipeline-btns">
              <button type="button" class="pipe-btn ${st === "saved" ? "active" : ""}" data-set-status="saved">À postuler</button>
              <button type="button" class="pipe-btn ${st === "applied" ? "active" : ""}" data-set-status="applied">Postulé</button>
              <button type="button" class="pipe-btn ${st === "interview" ? "active" : ""}" data-set-status="interview">Entretien</button>
              <button type="button" class="pipe-btn ${st === "offer" ? "active" : ""}" data-set-status="offer">Offre reçue</button>
              <button type="button" class="pipe-btn hide-btn ${st === "hidden" ? "active" : ""}" data-set-status="hidden">Masquer</button>
            </div>
            <textarea class="note-area" id="detail-note-input" placeholder="Ajouter une note personnelle (contact, relance, date d'entretien)...">${escapeHtml(noteVal)}</textarea>
          </div>

          ${highlightsHtml}

          <h3 class="section-subtitle">Descriptif complet</h3>
          <div class="desc-body">${escapeHtml(offer.full_description || offer.summary_excerpt || "")}</div>
        `;

        const closeBtn = document.getElementById("mobile-close-detail-btn");
        if (closeBtn) {
          closeBtn.addEventListener("click", () => {
            pane.classList.remove("mobile-open");
          });
        }

        pane.querySelectorAll("[data-set-status]").forEach(btn => {
          btn.addEventListener("click", () => {
            setOfferStatus(offer.id, btn.getAttribute("data-set-status"));
          });
        });

        const noteInput = document.getElementById("detail-note-input");
        if (noteInput) {
          noteInput.addEventListener("input", () => {
            setOfferNote(offer.id, noteInput.value);
          });
        }
      }

      function renderKanban() {
        const board = document.getElementById("kanban-board-container");
        const cols = [
          { key: "saved", title: "À postuler" },
          { key: "applied", title: "Candidature envoyée" },
          { key: "interview", title: "Entretien en cours" },
          { key: "offer", title: "Offre reçue" }
        ];

        board.innerHTML = cols.map(col => {
          const items = Object.keys(userState.statuses)
            .filter(id => userState.statuses[id] === col.key)
            .map(id => LIVE_OFFERS.find(o => o.id === id) || userState.snapshots[id])
            .filter(Boolean);

          const cardsHtml = items.length === 0
            ? `<p style="font-size:12px;color:var(--ink-400);padding:8px 2px;">Aucune offre dans cette colonne.</p>`
            : items.map(item => {
                const note = userState.notes[item.id] || "";
                const isArchived = !LIVE_OFFERS.some(o => o.id === item.id);
                return `
                  <div class="k-card">
                    <div style="display:flex;justify-content:space-between;gap:6px;align-items:center;">
                      <span class="mono-pill">${escapeHtml(item.contract_type || "CDI")}</span>
                      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);">${escapeHtml(item.city_display || "")}</span>
                    </div>
                    <div class="card-brand-row" style="gap:9px;align-items:center;">
                      ${renderCompanyLogo(item, "logo-sm")}
                      <div class="card-brand-text">
                        <div class="k-card-title">${escapeHtml(item.title)}</div>
                        <div style="font-size:12.5px;color:var(--ink-700);font-weight:600;">${escapeHtml(item.company)}</div>
                      </div>
                    </div>
                    <div style="font-family:var(--font-mono);font-size:11px;color:${item.has_salary ? "var(--sal-700)" : "var(--ink-400)"};">
                      ${escapeHtml(item.salary_display || "Salaire non précisé")}
                    </div>
                    ${isArchived ? `<div style="font-size:11px;color:var(--warn-700);background:var(--warn-100);padding:3px 6px;border-radius:4px;">Archive conservée (annonce clôturée en ligne)</div>` : ""}
                    ${note ? `<div class="k-note-preview">${escapeHtml(note)}</div>` : ""}
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:6px;flex-wrap:wrap;">
                      <a href="${escapeHtml(safeExternalUrl(item.url))}" target="_blank" rel="noopener noreferrer" style="font-size:12px;font-weight:600;text-decoration:underline;">Lien annonce ↗</a>
                      <select data-move-id="${escapeHtml(item.id)}" style="font-size:11.5px;padding:3px 6px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--bg-sheet);">
                        <option value="saved" ${col.key === "saved" ? "selected" : ""}>À postuler</option>
                        <option value="applied" ${col.key === "applied" ? "selected" : ""}>Postulé</option>
                        <option value="interview" ${col.key === "interview" ? "selected" : ""}>Entretien</option>
                        <option value="offer" ${col.key === "offer" ? "selected" : ""}>Offre reçue</option>
                        <option value="remove">Retirer du suivi</option>
                      </select>
                    </div>
                  </div>
                `;
              }).join("");

          return `
            <section class="kanban-col">
              <div class="kanban-col-head">
                <span>${escapeHtml(col.title)}</span>
                <span class="mono-pill">${items.length}</span>
              </div>
              ${cardsHtml}
            </section>
          `;
        }).join("");

        board.querySelectorAll("[data-move-id]").forEach(sel => {
          sel.addEventListener("change", () => {
            const id = sel.getAttribute("data-move-id");
            const val = sel.value;
            if (val === "remove") {
              delete userState.statuses[id];
              saveState();
              renderAll();
            } else {
              userState.statuses[id] = val;
              saveState();
              renderAll();
            }
          });
        });
      }

      function renderAll() {
        document.getElementById("nav-total-count").textContent = String(LIVE_OFFERS.length);
        if (META.updated_at_fr) {
          document.getElementById("sync-meta-label").textContent =
            `Paris & Île-de-France · Actualisé le ${META.updated_at_fr}`;
        }
        updateDynamicCounts();
        updateTrackedCounter();
        const filtered = getFilteredOffers();
        renderOfferList(filtered);
        renderDetailPane(filtered);
        if (activeView === "kanban") {
          renderKanban();
        }
      }

      // Wire events
      document.getElementById("search-input").addEventListener("input", e => {
        filters.q = e.target.value || "";
        renderAll();
      });

      document.getElementById("clear-search-btn").addEventListener("click", () => {
        filters.q = "";
        document.getElementById("search-input").value = "";
        renderAll();
      });

      document.getElementById("toggle-art-btn").addEventListener("click", e => {
        filters.onlyArt = !filters.onlyArt;
        e.currentTarget.classList.toggle("active", filters.onlyArt);
        renderAll();
      });

      document.getElementById("toggle-salary-btn").addEventListener("click", e => {
        filters.onlySalary = !filters.onlySalary;
        e.currentTarget.classList.toggle("active", filters.onlySalary);
        renderAll();
      });

      document.getElementById("toggle-grad-btn").addEventListener("click", e => {
        filters.onlyGrad = !filters.onlyGrad;
        e.currentTarget.classList.toggle("active", filters.onlyGrad);
        renderAll();
      });

      document.getElementById("sort-select").addEventListener("change", e => {
        filters.sort = e.target.value;
        renderAll();
      });

      document.querySelectorAll("#family-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.family = btn.getAttribute("data-family");
          document.querySelectorAll("#family-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.querySelectorAll("#zone-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.zone = btn.getAttribute("data-zone");
          document.querySelectorAll("#zone-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.querySelectorAll("#contract-chips .filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          filters.contract = btn.getAttribute("data-contract");
          document.querySelectorAll("#contract-chips .filter-chip").forEach(b => b.classList.toggle("active", b === btn));
          renderAll();
        });
      });

      document.getElementById("reset-filters-btn").addEventListener("click", () => {
        filters.q = "";
        filters.family = "ALL";
        filters.zone = "ALL";
        filters.contract = "ALL";
        filters.onlyArt = false;
        filters.onlySalary = false;
        filters.onlyGrad = false;
        document.getElementById("search-input").value = "";
        document.getElementById("toggle-art-btn").classList.remove("active");
        document.getElementById("toggle-salary-btn").classList.remove("active");
        document.getElementById("toggle-grad-btn").classList.remove("active");
        document.querySelectorAll("#family-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        document.querySelectorAll("#zone-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        document.querySelectorAll("#contract-chips .filter-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
        renderAll();
      });

      document.getElementById("toggle-show-hidden-btn").addEventListener("click", () => {
        filters.showHidden = !filters.showHidden;
        renderAll();
      });

      function switchView(view) {
        activeView = view;
        const isCat = view === "catalog";
        document.getElementById("tab-catalog-btn").classList.toggle("active", isCat);
        document.getElementById("tab-catalog-btn").setAttribute("aria-selected", String(isCat));
        document.getElementById("tab-kanban-btn").classList.toggle("active", !isCat);
        document.getElementById("tab-kanban-btn").setAttribute("aria-selected", String(!isCat));
        document.getElementById("catalog-controls").style.display = isCat ? "block" : "none";
        document.getElementById("catalog-view").style.display = isCat ? "block" : "none";
        document.getElementById("kanban-view").classList.toggle("active", !isCat);
        renderAll();
      }

      document.getElementById("tab-catalog-btn").addEventListener("click", () => switchView("catalog"));
      document.getElementById("tab-kanban-btn").addEventListener("click", () => switchView("kanban"));

      document.getElementById("export-state-btn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(userState, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "suivi-opportunites.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });

      document.getElementById("import-state-btn").addEventListener("click", () => {
        document.getElementById("import-file-input").click();
      });

      document.getElementById("import-file-input").addEventListener("change", e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const imported = JSON.parse(String(ev.target.result || "{}"));
            if (imported && typeof imported === "object") {
              userState = {
                statuses: imported.statuses || {},
                notes: imported.notes || {},
                snapshots: imported.snapshots || {}
              };
              saveState();
              renderAll();
            }
          } catch (err) {}
        };
        reader.readAsText(f);
        e.target.value = "";
      });

      renderAll();
    })();
  </script>
</body>
</html>
